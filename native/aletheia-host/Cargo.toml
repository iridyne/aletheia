[package]
name = "aletheia-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Stable tray and CLI host for packaged Aletheia runtimes"
license = "MIT"

[lib]
name = "aletheia_host"
path = "src/hostlib.rs"

[[bin]]
name = "aletheia"
path = "src/bin/aletheia.rs"

[[bin]]
name = "aletheia-tray"
path = "src/bin/aletheia-tray.rs"
required-features = ["tray"]

[features]
# Desktop tray binary and its macOS GUI dependencies.  Omit on Linux CI so
# muda/winit do not need GTK platform headers.  Enable explicitly for macOS
# test and release builds: `cargo build --features tray`.
tray = ["dep:tray-icon", "dep:winit"]

[dependencies]
anyhow = "1.0.100"
directories = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "0.24.1", default-features = false, optional = true }
winit = { version = "0.30.12", optional = true }

[dev-dependencies]
tempfile = "3.23.0"

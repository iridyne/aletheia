[package]
name = "aletheia-host"
version = "0.1.0"
edition = "2021"
description = "Stable tray and CLI host for packaged Aletheia runtimes"
license = "MIT"

[lib]
name = "aletheia_host"
path = "src/lib.rs"

[[bin]]
name = "aletheia"
path = "src/bin/aletheia.rs"

[[bin]]
name = "aletheia-tray"
path = "src/bin/aletheia-tray.rs"

[dependencies]
anyhow = "1"
directories = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.21"
winit = "0.30"

[dev-dependencies]
tempfile = "3"

schema_version: 1
# Machine-readable projection of AGENTS.md and
# docs/governance/trust_and_change_control.md §6.1.
#
# This file is a safety/documentation contract only. It does not create a
# repository task system, grant authority, track workers, or store evidence.
trust_boundaries:
  - id: risk
    paths:
      - aletheia/risk/**
    focused_commands:
      - uv run pytest tests/specs/spec_risk_engine.py -q
      - uv run pytest tests/specs/spec_kill_conditions.py -q
  - id: execution
    paths:
      - aletheia/execution/**
    focused_commands:
      - uv run pytest tests/specs/spec_execution.py -q
      - uv run pytest tests/specs/spec_pipeline_execution_chain.py -q
  - id: bitget_auth
    paths:
      - aletheia/exchanges/bitget/auth.py
    focused_commands:
      - uv run pytest tests/specs/spec_execution.py -q
  - id: bitget_client
    paths:
      - aletheia/exchanges/bitget/client.py
    focused_commands:
      - uv run pytest tests/specs/spec_execution.py -q
  - id: secrets
    paths:
      - aletheia/config/secrets.py
    focused_commands:
      - uv run pytest tests/specs/spec_execution.py -q
  - id: permissions
    paths:
      - aletheia/agent_runtime/permissions.py
    focused_commands:
      - uv run pytest tests/specs/spec_execution.py -q
  - id: tool_registry
    paths:
      - aletheia/agent_runtime/tool_registry.py
    focused_commands:
      - uv run pytest tests/specs/spec_execution.py -q
  - id: agent_shell_registry
    paths:
      - aletheia/agent_shell/registry.py
    focused_commands:
      - uv run pytest tests/specs/spec_execution.py -q
  - id: audit_writer
    paths:
      - aletheia/files/jsonl.py
    focused_commands:
      - uv run pytest tests/specs/spec_audit_chain.py -q
  - id: live_routes
    paths:
      - aletheia/server/routes/live.py
    focused_commands:
      - uv run pytest tests/specs/spec_live_unlock.py -q
      - uv run pytest tests/specs/spec_audit_chain.py -q

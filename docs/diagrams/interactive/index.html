<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aletheia Interactive Architecture</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #f0f6fc;
    }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; }
    header {
      position: fixed;
      inset: 16px 16px auto 16px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 12px 14px;
      border: 1px solid #30363d;
      border-radius: 12px;
      background: rgb(13 17 23 / 92%);
      box-shadow: 0 8px 32px rgb(0 0 0 / 30%);
      backdrop-filter: blur(10px);
    }
    h1 { margin: 0; font-size: 16px; }
    p { margin: 3px 0 0; color: #8b949e; font-size: 12px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; }
    button, a {
      min-height: 34px;
      padding: 7px 11px;
      border: 1px solid #30363d;
      border-radius: 7px;
      background: #21262d;
      color: #f0f6fc;
      font: inherit;
      text-decoration: none;
      cursor: pointer;
    }
    button:hover, a:hover { background: #30363d; }
    #viewport {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      cursor: grab;
      touch-action: none;
      background:
        radial-gradient(circle at center, rgb(33 38 45 / 55%) 0, transparent 65%),
        #0d1117;
    }
    #viewport.dragging { cursor: grabbing; }
    #diagram {
      position: absolute;
      left: 0;
      top: 0;
      display: block;
      width: 1600px;
      height: auto;
      max-width: none;
      transform-origin: 0 0;
      user-select: none;
      -webkit-user-drag: none;
      filter: drop-shadow(0 12px 32px rgb(0 0 0 / 25%));
    }
    @media (max-width: 760px) {
      header { align-items: flex-start; flex-direction: column; }
      .controls { width: 100%; }
      button, a { flex: 1; text-align: center; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Aletheia complete architecture / 完整架构图</h1>
      <p class="hint">Drag to pan · wheel/pinch to zoom · double-click to fit</p>
    </div>
    <div class="controls" aria-label="Diagram controls">
      <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      <button id="fit" type="button">Fit / 适配</button>
      <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <a href="../rendered/readme_complete_architecture.svg" target="_blank" rel="noopener">Open SVG</a>
    </div>
  </header>
  <main id="viewport" aria-label="Interactive Aletheia architecture diagram">
    <img id="diagram" src="../rendered/readme_complete_architecture.svg" alt="Complete Aletheia architecture">
  </main>
  <script>
    const viewport = document.querySelector('#viewport');
    const diagram = document.querySelector('#diagram');
    const state = { x: 0, y: 0, scale: 1, dragging: false, px: 0, py: 0 };
    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

    function render() {
      diagram.style.transform = `translate(${state.x}px, ${state.y}px) scale(${state.scale})`;
    }

    function fit() {
      const headerSpace = 118;
      const availableWidth = viewport.clientWidth - 48;
      const availableHeight = viewport.clientHeight - headerSpace - 32;
      const diagramWidth = diagram.offsetWidth || 1600;
      const diagramHeight = diagram.offsetHeight || 1000;
      state.scale = clamp(Math.min(availableWidth / diagramWidth, availableHeight / diagramHeight), 0.05, 2);
      state.x = (viewport.clientWidth - diagramWidth * state.scale) / 2;
      state.y = headerSpace + Math.max(0, (availableHeight - diagramHeight * state.scale) / 2);
      render();
    }

    function zoomAt(factor, clientX, clientY) {
      const next = clamp(state.scale * factor, 0.05, 5);
      const ratio = next / state.scale;
      state.x = clientX - (clientX - state.x) * ratio;
      state.y = clientY - (clientY - state.y) * ratio;
      state.scale = next;
      render();
    }

    viewport.addEventListener('wheel', (event) => {
      event.preventDefault();
      zoomAt(Math.exp(-event.deltaY * 0.0012), event.clientX, event.clientY);
    }, { passive: false });

    viewport.addEventListener('pointerdown', (event) => {
      state.dragging = true;
      state.px = event.clientX;
      state.py = event.clientY;
      viewport.classList.add('dragging');
      viewport.setPointerCapture(event.pointerId);
    });

    viewport.addEventListener('pointermove', (event) => {
      if (!state.dragging) return;
      state.x += event.clientX - state.px;
      state.y += event.clientY - state.py;
      state.px = event.clientX;
      state.py = event.clientY;
      render();
    });

    viewport.addEventListener('pointerup', (event) => {
      state.dragging = false;
      viewport.classList.remove('dragging');
      viewport.releasePointerCapture(event.pointerId);
    });

    viewport.addEventListener('dblclick', fit);
    document.querySelector('#fit').addEventListener('click', fit);
    document.querySelector('#zoom-in').addEventListener('click', () => zoomAt(1.25, innerWidth / 2, innerHeight / 2));
    document.querySelector('#zoom-out').addEventListener('click', () => zoomAt(0.8, innerWidth / 2, innerHeight / 2));
    addEventListener('resize', fit);
    diagram.addEventListener('load', fit);
  </script>
</body>
</html>

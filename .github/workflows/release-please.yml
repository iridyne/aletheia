name: Prepare and tag releases

on:
  repository_dispatch:
    # A merged release candidate needs one trusted follow-up run to create its
    # tag and GitHub Release. This event is intentionally separate from the
    # owner-gated release-preparation batch.
    types: [release_candidate_merged, release_candidate_refresh]
  # The only preparation trigger is an explicit owner release-intent gate. Once
  # it is selected, candidate CI, merge, tag, and the downstream Runtime update
  # remain unattended.
  workflow_dispatch:
    inputs:
      operational_need:
        description: Release the accumulated batch because a Runtime update is needed
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: >-
    ${{
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'release_candidate_merged' &&
      format('release-please-tag-{0}', github.event.client_payload.merge_commit_sha) ||
      'release-please-prepare'
    }}
  cancel-in-progress: false

jobs:
  release:
    name: Maintain release pull request and tag approved releases
    if: >-
      (
        github.event_name == 'repository_dispatch' &&
        github.event.sender.login == 'github-actions[bot]'
      ) ||
      (
        inputs.operational_need == true &&
        github.actor == github.repository_owner
      )
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Validate the authorized release merge
        if: >-
          github.event_name == 'repository_dispatch' &&
          github.event.action == 'release_candidate_merged'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            const run = context.payload.client_payload;
            if (!/^[0-9a-f]{40}$/.test(run.merge_commit_sha || '')) {
              throw new Error('release merge SHA must be a 40-character lowercase Git object ID');
            }
            if (!/^[0-9a-f]{40}$/.test(run.expected_base_sha || '')) {
              throw new Error('release base SHA must be a 40-character lowercase Git object ID');
            }
            const {data: commit} = await github.rest.repos.getCommit({
              ...context.repo,
              ref: run.merge_commit_sha,
            });
            if (
              commit.parents.length !== 1 ||
              commit.parents[0].sha !== run.expected_base_sha
            ) {
              throw new Error('release merge contains commits outside the authorized batch');
            }
      - name: Validate the trusted release candidate refresh
        if: >-
          github.event_name == 'repository_dispatch' &&
          github.event.action == 'release_candidate_refresh'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            const run = context.payload.client_payload || {};
            const sourceRunId = Number.parseInt(run.source_run_id, 10);
            const candidateNumber = Number.parseInt(run.candidate_number, 10);
            const triggerPullRequest = Number.parseInt(run.trigger_pull_request, 10);
            const shaFields = [
              ['master_sha', run.master_sha],
              ['candidate_head_sha', run.candidate_head_sha],
              ['merge_base_sha', run.merge_base_sha],
              ['merge_commit_sha', run.merge_commit_sha],
            ];
            if (!Number.isInteger(sourceRunId) || sourceRunId <= 0) {
              throw new Error('refresh source workflow run must be a positive integer');
            }
            for (const [name, sha] of shaFields) {
              if (!/^[0-9a-f]{40}$/.test(sha || '')) {
                throw new Error(`${name} must be a 40-character lowercase Git object ID`);
              }
            }
            if (!Number.isInteger(candidateNumber) || candidateNumber <= 0) {
              throw new Error('refresh candidate number must be a positive integer');
            }
            if (!Number.isInteger(triggerPullRequest) || triggerPullRequest <= 0) {
              throw new Error('refresh trigger pull request must be a positive integer');
            }

            const {data: sourceRun} = await github.rest.actions.getWorkflowRun({
              ...context.repo,
              run_id: sourceRunId,
            });
            if (
              sourceRun.path !== '.github/workflows/refresh-release-candidate.yml' ||
              sourceRun.event !== 'workflow_run' ||
              sourceRun.head_branch !== 'master' ||
              !(
                sourceRun.status === 'in_progress' ||
                (sourceRun.status === 'completed' && sourceRun.conclusion === 'success')
              )
            ) {
              throw new Error('refresh dispatch did not originate from the trusted refresh workflow');
            }

            const {data: candidate} = await github.rest.pulls.get({
              ...context.repo,
              pull_number: candidateNumber,
            });
            if (
              candidate.state !== 'open' ||
              candidate.base.ref !== 'master' ||
              candidate.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
              candidate.head.sha !== run.candidate_head_sha ||
              !candidate.labels.some(({name}) => name === 'autorelease: pending')
            ) {
              throw new Error('refresh candidate is not the active repository-owned release candidate');
            }

            const {data: master} = await github.rest.repos.getBranch({
              ...context.repo,
              branch: 'master',
            });
            if (master.commit.sha !== run.master_sha) {
              throw new Error('master advanced after the refresh request; re-run the trusted refresh');
            }
            const comparison = await github.rest.repos.compareCommits({
              ...context.repo,
              base: candidate.head.sha,
              head: master.commit.sha,
            });
            if (
              comparison.data.merge_base_commit.sha !== run.merge_base_sha ||
              comparison.data.merge_base_commit.sha === master.commit.sha
            ) {
              throw new Error('refresh candidate is not the expected stale branch');
            }

            const {data: trigger} = await github.rest.pulls.get({
              ...context.repo,
              pull_number: triggerPullRequest,
            });
            if (
              trigger.state !== 'closed' ||
              !trigger.merged_at ||
              trigger.base.ref !== 'master' ||
              trigger.merge_commit_sha !== run.merge_commit_sha ||
              trigger.labels.some(({name}) => name === 'autorelease: pending')
            ) {
              throw new Error('refresh trigger is not the ordinary merged master pull request');
            }
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      # The repository Action policy permits GitHub-owned Actions only. Keep the
      # release tool itself at the exact version bundled by the rejected action.
      - name: Maintain releases and the release pull request
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_EVENT: ${{ github.event.action }}
        run: |
          set -euo pipefail
          release_please() {
            local attempt
            for attempt in 1 2 3; do
              if npm exec --yes --package=release-please@17.6.0 -- \
                release-please "$@" \
                --token="$GITHUB_TOKEN" \
                --repo-url="$GITHUB_REPOSITORY" \
                --target-branch=master \
                --config-file=release-please-config.json \
                --manifest-file=.release-please-manifest.json; then
                return 0
              fi
              [ "$attempt" -eq 3 ] && return 1
              sleep $((attempt * 5))
            done
          }
          if [ "$RELEASE_EVENT" = "release_candidate_merged" ]; then
            release_please github-release
          else
            release_please release-pr
          fi
      - name: Run CI for the pending release pull request
        if: >-
          github.event_name != 'repository_dispatch' ||
          github.event.action == 'release_candidate_refresh'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            const {data: pullRequests} = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              base: 'master',
            });
            for (const pullRequest of pullRequests) {
              if (!pullRequest.labels.some(({name}) => name === 'autorelease: pending')) {
                continue;
              }
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: pullRequest.number,
                labels: ['do-not-auto-merge'],
              });
              const {data: workflowRuns} = await github.rest.actions.listWorkflowRuns({
                ...context.repo,
                workflow_id: 'ci.yml',
                branch: pullRequest.head.ref,
                event: 'workflow_dispatch',
                per_page: 30,
              });
              const exactRuns = workflowRuns.workflow_runs.filter(
                ({head_sha}) => head_sha === pullRequest.head.sha,
              );
              const activeStatuses = new Set([
                'requested', 'waiting', 'pending', 'queued', 'in_progress',
              ]);
              if (exactRuns.some(({status}) => activeStatuses.has(status))) {
                core.info(`CI already active for ${pullRequest.head.sha}; reusing it`);
                continue;
              }
              if (exactRuns.some(({status, conclusion}) =>
                status === 'completed' && conclusion === 'success')) {
                await github.rest.repos.createDispatchEvent({
                  ...context.repo,
                  event_type: 'release_candidate_verified',
                  client_payload: {
                    head_branch: pullRequest.head.ref,
                    head_sha: pullRequest.head.sha,
                  },
                });
                continue;
              }
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: 'ci.yml',
                ref: pullRequest.head.ref,
              });
            }

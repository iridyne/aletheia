name: Hand off exact-head release CI

on:
  workflow_run:
    workflows: [Aletheia CI]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: release-ci-handoff-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  handoff:
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'release-please--branches--master') }}
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04, casi]
    timeout-minutes: 5
    steps:
      - name: Revalidate exact-head release intent and dispatch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            const run = context.payload.workflow_run;
            if (run.path !== '.github/workflows/ci.yml' || run.repository.full_name !== context.repo.owner + '/' + context.repo.repo) {
              throw new Error('untrusted upstream workflow identity');
            }
            const required = new Set(['Full CI verdict']);
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo, run_id: run.id, filter: 'latest', per_page: 100,
            });
            for (const name of required) {
              const job = jobs.find((candidate) => candidate.name === name);
              if (!job || job.conclusion !== 'success' || job.head_sha !== run.head_sha) {
                throw new Error(`missing successful exact-head job: ${name}`);
              }
            }
            if (run.event === 'pull_request') {
              const numbers = (run.pull_requests || []).map(({number}) => number);
              if (numbers.length !== 1) throw new Error('release CI must identify one PR');
              const {data: pullRequest} = await github.rest.pulls.get({
                ...context.repo, pull_number: numbers[0],
              });
              if (
                pullRequest.head.sha !== run.head_sha ||
                pullRequest.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                !pullRequest.head.ref.startsWith('release-please--branches--master') ||
                !pullRequest.labels.some(({name}) => name === 'autorelease: pending')
              ) throw new Error('release PR identity or exact head changed');
              await github.rest.repos.createDispatchEvent({
                ...context.repo,
                event_type: 'auto_merge_update',
                client_payload: {
                  operation: 'enable',
                  pull_request_number: pullRequest.number,
                  expected_head_sha: pullRequest.head.sha,
                  expected_base_sha: pullRequest.base.sha,
                  release_after_merge: true,
                },
              });
              return;
            }
            if (
              run.event !== 'workflow_dispatch' ||
              !run.head_branch.startsWith('release-please--branches--master')
            ) return;
            const {data: branch} = await github.rest.repos.getBranch({
              ...context.repo, branch: run.head_branch,
            });
            if (branch.commit.sha !== run.head_sha) throw new Error('release branch head changed');
            await github.rest.repos.createDispatchEvent({
              ...context.repo,
              event_type: 'release_candidate_verified',
              client_payload: {head_branch: run.head_branch, head_sha: run.head_sha},
            });

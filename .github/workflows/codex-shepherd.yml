name: Codex PR shepherd

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, ready_for_review, edited, synchronize, unlabeled]
  pull_request_review:
    branches: [master]
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [Aletheia CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      source_event:
        required: true
        type: string
      source_action:
        required: false
        type: string

permissions:
  contents: read

jobs:
  # PR-facing events run with a repository policy that rejects comment/label writes
  # from their GITHUB_TOKEN. Keep this job mutation-free: it only starts the trusted
  # default-branch workflow with Actions: write, which does not grant merge/content
  # authority. The workflow_dispatch run performs PR-side mutations after exact-head
  # revalidation.
  schedule:
    name: Schedule Codex shepherd update
    if: >-
      github.event_name == 'pull_request_target' ||
      (
        github.event_name == 'pull_request_review' &&
        (
          github.event.review.user.login == 'chatgpt-codex-connector' ||
          github.event.review.user.login == 'chatgpt-codex-connector[bot]'
        )
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (
          github.event.comment.user.login == 'chatgpt-codex-connector' ||
          github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
        )
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request'
      )
    permissions:
      actions: write
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dispatch trusted Shepherd update
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            const connectorLogin = 'chatgpt-codex-connector';
            const normalizeLogin = (login) => String(login || '').replace(/\[bot\]$/, '');
            const isConnectorLogin = (login) => normalizeLogin(login) === connectorLogin;
            const payload = context.payload;
            let pullRequestNumbers = [];

            if (context.eventName === 'pull_request_target') {
              pullRequestNumbers = [payload.pull_request?.number].filter(Boolean);
            } else if (context.eventName === 'pull_request_review') {
              if (!isConnectorLogin(payload.review?.user?.login)) return;
              pullRequestNumbers = [payload.pull_request?.number].filter(Boolean);
            } else if (context.eventName === 'issue_comment') {
              if (
                !payload.issue?.pull_request ||
                !isConnectorLogin(payload.comment?.user?.login)
              ) {
                return;
              }
              pullRequestNumbers = [payload.issue.number];
            } else if (context.eventName === 'workflow_run') {
              const run = payload.workflow_run;
              if (run?.event !== 'pull_request') return;
              pullRequestNumbers = [...new Set((run.pull_requests || []).map(({number}) => number))];
              if (pullRequestNumbers.length !== 1) {
                core.info(`expected one pull request for CI run, found ${pullRequestNumbers.length}`);
                return;
              }
            }

            for (const pullRequestNumber of [...new Set(pullRequestNumbers)]) {
              const {data: pullRequest} = await github.rest.pulls.get({
                ...context.repo,
                pull_number: pullRequestNumber,
              });
              if (
                pullRequest.state !== 'open' ||
                pullRequest.base.ref !== 'master' ||
                pullRequest.draft ||
                pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                pullRequest.head.ref.startsWith('release-please--branches--master')
              ) {
                continue;
              }
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: 'codex-shepherd.yml',
                ref: 'master',
                inputs: {
                  pull_request_number: String(pullRequest.number),
                  expected_head_sha: pullRequest.head.sha,
                  source_event: context.eventName,
                  source_action: String(payload.action || payload.workflow_run?.conclusion || ''),
                },
              });
            }

  apply:
    name: Apply Codex shepherd update
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: codex-shepherd-update-${{ github.event.inputs.pull_request_number }}
      cancel-in-progress: true
    steps:
      - name: Drive exact-head Codex review state
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            const connectorLogin = 'chatgpt-codex-connector';
            const shepherdLogin = 'github-actions[bot]';
            const shepherdPath = '.github/workflows/codex-shepherd.yml';
            const normalizeLogin = (login) => String(login || '').replace(/\[bot\]$/, '');
            const isConnectorLogin = (login) => normalizeLogin(login) === connectorLogin;
            const reviewedCommitPattern = /Reviewed commit:[^`]*`([0-9a-f]{7,40})`/i;
            const reviewMarkerPattern =
              /<!-- aletheia-codex-shepherd head=([0-9a-f]{40}) kind=review -->/g;
            const haltMarkerPattern =
              /<!-- aletheia-codex-shepherd halt head=([0-9a-f]{40}) reason=([a-z-]+) -->/g;
            const repairableCiConclusions = new Set(['failure', 'timed_out']);
            const request = context.payload.inputs || {};
            const pullRequestNumber = Number.parseInt(String(request.pull_request_number || ''), 10);
            const expectedHeadSha = String(request.expected_head_sha || '');
            const sourceEvent = String(request.source_event || '');

            if (!Number.isInteger(pullRequestNumber) || pullRequestNumber <= 0) {
              throw new Error('pull request number must be a positive integer');
            }
            if (!/^[0-9a-f]{40}$/.test(expectedHeadSha)) {
              throw new Error('expected head SHA must be a 40-character lowercase Git object ID');
            }
            if (!new Set([
              'pull_request_target',
              'pull_request_review',
              'issue_comment',
              'workflow_run',
            ]).has(sourceEvent)) {
              throw new Error(`unsupported Shepherd source event: ${sourceEvent}`);
            }

            const resolveReviewedCommitSha = async (body) => {
              const match = String(body || '').match(reviewedCommitPattern);
              if (!match) return null;
              try {
                const {data: commit} = await github.rest.repos.getCommit({
                  ...context.repo,
                  ref: match[1],
                });
                return commit.sha;
              } catch (error) {
                core.info(`could not resolve Connector reviewed commit ${match[1]}: ${error}`);
                return null;
              }
            };

            const {data: pullRequest} = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullRequestNumber,
            });
            if (
              pullRequest.state !== 'open' ||
              pullRequest.base.ref !== 'master' ||
              pullRequest.draft ||
              pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
              pullRequest.head.ref.startsWith('release-please--branches--master')
            ) {
              core.info('pull request is outside the autonomous Shepherd boundary');
              return;
            }
            if (pullRequest.head.sha !== expectedHeadSha) {
              core.info(
                `Shepherd request for ${expectedHeadSha} is stale; current head is ${pullRequest.head.sha}`,
              );
              return;
            }

            const [changedFiles, issueComments, allReviews] = await Promise.all([
              github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: pullRequest.number,
                per_page: 100,
              }),
              github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: pullRequest.number,
                per_page: 100,
              }),
              github.paginate(github.rest.pulls.listReviews, {
                ...context.repo,
                pull_number: pullRequest.number,
                per_page: 100,
              }),
            ]);

            const exactHeadReviews = allReviews.filter((review) =>
              isConnectorLogin(review.user?.login) &&
              review.commit_id === expectedHeadSha &&
              review.submitted_at &&
              review.state !== 'DISMISSED'
            );
            const shepherdComments = issueComments.filter(
              (comment) => comment.user?.login === shepherdLogin
            );
            const markers = shepherdComments.flatMap((comment) => {
              const body = String(comment.body || '');
              const found = [];
              for (const match of body.matchAll(reviewMarkerPattern)) {
                found.push({type: 'review', head: match[1]});
              }
              for (const match of body.matchAll(haltMarkerPattern)) {
                found.push({type: 'halt', head: match[1], reason: match[2]});
              }
              return found;
            });
            const exactHeadReviewRequest = markers.some(
              ({type, head}) => type === 'review' && head === expectedHeadSha
            );
            const exactHeadHalt = markers.some(
              ({type, head}) => type === 'halt' && head === expectedHeadSha
            );

            const postComment = async (body) => {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pullRequest.number,
                body,
              });
            };
            let holdLabelPresent = pullRequest.labels.some(
              ({name}) => name === 'do-not-auto-merge'
            );
            const ensureHoldLabel = async () => {
              if (holdLabelPresent) return;
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: pullRequest.number,
                labels: ['do-not-auto-merge'],
              });
              holdLabelPresent = true;
            };
            const holdForOwner = async (reason, message) => {
              if (!exactHeadHalt) {
                await postComment(
                  `${message}\n\n` +
                  `Codex Cloud repair is not authorized to push back to this repository yet, so ` +
                  `the Shepherd fails closed instead of claiming an autonomous repair.\n\n` +
                  `<!-- aletheia-codex-shepherd halt head=${expectedHeadSha} reason=${reason} -->`
                );
              }
              // Persist the exact-head halt marker before the label. If this run is
              // canceled between mutations, any successor restores the label from the
              // marker before source-specific returns.
              await ensureHoldLabel();
            };

            // Halt markers are durable control state. Repair a marker-only partial
            // write before any event-specific early return, regardless of which source
            // event caused this successor run.
            if (exactHeadHalt) {
              await ensureHoldLabel();
            }

            if (changedFiles.length !== pullRequest.changed_files) {
              await holdForOwner(
                'file-list-incomplete',
                `GitHub returned ${changedFiles.length} of ${pullRequest.changed_files} changed files ` +
                `for exact head \`${expectedHeadSha}\`; Shepherd cannot prove the authority boundary.`
              );
              return;
            }

            const changesShepherdAuthority = changedFiles.some(({filename, previous_filename}) =>
              [filename, previous_filename].includes(shepherdPath)
            );
            if (changesShepherdAuthority) {
              if (!exactHeadHalt) {
                await postComment(
                  `Codex Shepherd authority changed on exact head \`${expectedHeadSha}\`. ` +
                  `This control-plane change requires explicit owner merge and cannot resume ` +
                  `through ordinary auto-merge.\n\n` +
                  `<!-- aletheia-codex-shepherd halt head=${expectedHeadSha} reason=shepherd-self-change -->`
                );
              }
              await ensureHoldLabel();
              return;
            }

            if (holdLabelPresent) {
              core.info('do-not-auto-merge holds this pull request');
              return;
            }

            if (exactHeadReviews.length !== 0) {
              await holdForOwner(
                'review-finding',
                `Codex reported exact-head review findings on \`${expectedHeadSha}\`. ` +
                `Owner disposition or a write-capable repair executor is required.`
              );
              return;
            }

            let connectorCleanExactHead = false;
            for (const comment of issueComments) {
              if (
                !isConnectorLogin(comment.user?.login) ||
                !/Didn't find any major issues\./i.test(String(comment.body || ''))
              ) {
                continue;
              }
              const reviewedCommitSha = await resolveReviewedCommitSha(comment.body);
              if (reviewedCommitSha === expectedHeadSha) {
                connectorCleanExactHead = true;
                break;
              }
            }

            if (!exactHeadReviewRequest && !connectorCleanExactHead) {
              await postComment(
                `@codex review\n\n` +
                `Please review exact head \`${expectedHeadSha}\`. Follow the repository AGENTS.md ` +
                `review rules and report only consequential findings. CI remains the authority for ` +
                `deterministic checks.\n\n` +
                `<!-- aletheia-codex-shepherd head=${expectedHeadSha} kind=review -->`
              );
              return;
            }

            if (sourceEvent === 'pull_request_target') return;

            const latestCiRun = async () => {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                ...context.repo,
                event: 'pull_request',
                head_sha: expectedHeadSha,
                per_page: 100,
              });
              return runs
                .filter((run) => run.name === 'Aletheia CI')
                .sort((a, b) => Date.parse(b.updated_at) - Date.parse(a.updated_at))[0] || null;
            };

            if (sourceEvent === 'issue_comment' || sourceEvent === 'workflow_run') {
              if (!connectorCleanExactHead) return;
              const run = await latestCiRun();
              if (
                !run ||
                run.status !== 'completed' ||
                !repairableCiConclusions.has(run.conclusion)
              ) {
                return;
              }
              await holdForOwner(
                'ci-failure',
                `Aletheia CI run ${run.id} concluded \`${run.conclusion}\` on exact head ` +
                `\`${expectedHeadSha}\` after a clean Codex review. A write-capable repair executor ` +
                `is required.`
              );
            }

name: Codex PR shepherd

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, ready_for_review, edited, synchronize, unlabeled]
  pull_request_review:
    branches: [master]
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_run:
    workflows: [Aletheia CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        required: true
        type: string
      expected_head_sha:
        required: true
        type: string
      expected_base_sha:
        required: true
        type: string
      source_event:
        required: true
        type: string
      source_action:
        required: false
        type: string

permissions:
  contents: read

jobs:
  schedule:
    name: Schedule Codex shepherd update
    if: >-
      github.event_name == 'pull_request_target' ||
      (
        github.event_name == 'pull_request_review' &&
        (
          github.event.review.user.login == 'chatgpt-codex-connector' ||
          github.event.review.user.login == 'chatgpt-codex-connector[bot]'
        )
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (
          github.event.comment.user.login == 'chatgpt-codex-connector' ||
          github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
        )
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request'
      )
    permissions:
      actions: write
      contents: read
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dispatch trusted Shepherd update
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            const connectorLogin = 'chatgpt-codex-connector';
            const normalizeLogin = (login) => String(login || '').replace(/\[bot\]$/, '');
            const isConnectorLogin = (login) => normalizeLogin(login) === connectorLogin;
            const payload = context.payload;
            let pullRequestNumbers = [];

            if (context.eventName === 'pull_request_target') {
              pullRequestNumbers = [payload.pull_request?.number].filter(Boolean);
            } else if (context.eventName === 'pull_request_review') {
              if (!isConnectorLogin(payload.review?.user?.login)) return;
              pullRequestNumbers = [payload.pull_request?.number].filter(Boolean);
            } else if (context.eventName === 'issue_comment') {
              if (!payload.issue?.pull_request || !isConnectorLogin(payload.comment?.user?.login)) {
                return;
              }
              pullRequestNumbers = [payload.issue.number];
            } else if (context.eventName === 'workflow_run') {
              const run = payload.workflow_run;
              if (run?.event !== 'pull_request') return;
              pullRequestNumbers = [...new Set((run.pull_requests || []).map(({number}) => number))];
              if (pullRequestNumbers.length !== 1) {
                core.info(`expected one pull request for CI run, found ${pullRequestNumbers.length}`);
                return;
              }
            }

            for (const pullRequestNumber of [...new Set(pullRequestNumbers)]) {
              const {data: pullRequest} = await github.rest.pulls.get({
                ...context.repo,
                pull_number: pullRequestNumber,
              });
              if (
                pullRequest.state !== 'open' ||
                pullRequest.base.ref !== 'master' ||
                pullRequest.draft ||
                pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                pullRequest.head.ref.startsWith('release-please--branches--master')
              ) {
                continue;
              }
              const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${pullRequest.base.sha}...${pullRequest.head.sha}`,
              });
              const expectedBaseSha = comparison.merge_base_commit.sha;
              if (!/^[0-9a-f]{40}$/.test(expectedBaseSha || '')) {
                throw new Error('pull request merge-base SHA is unavailable');
              }
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: 'codex-shepherd.yml',
                ref: 'master',
                inputs: {
                  pull_request_number: String(pullRequest.number),
                  expected_head_sha: pullRequest.head.sha,
                  expected_base_sha: expectedBaseSha,
                  source_event: context.eventName,
                  source_action: String(payload.action || payload.workflow_run?.conclusion || ''),
                },
              });
            }

  apply:
    name: Apply Codex shepherd update
    if: github.event_name == 'workflow_dispatch'
    permissions:
      actions: write
      contents: read
      issues: write
      pull-requests: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: codex-shepherd-update-${{ github.event.inputs.pull_request_number }}
      cancel-in-progress: false
    steps:
      - name: Converge exact-diff Codex review state
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            const connectorLogin = 'chatgpt-codex-connector';
            const shepherdLogin = 'github-actions[bot]';
            const shepherdPath = '.github/workflows/codex-shepherd.yml';
            const normalizeLogin = (login) => String(login || '').replace(/\[bot\]$/, '');
            const isConnectorLogin = (login) => normalizeLogin(login) === connectorLogin;
            const reviewedCommitPattern = /Reviewed commit:[^`]*`([0-9a-f]{7,40})`/i;
            const reviewMarkerPattern =
              /<!-- aletheia-codex-shepherd head=([0-9a-f]{40}) base=([0-9a-f]{40}) kind=review -->/g;
            const noteMarkerPattern =
              /<!-- aletheia-codex-shepherd head=([0-9a-f]{40}) base=([0-9a-f]{40}) kind=note reason=([a-z-]+) -->/g;
            const request = context.payload.inputs || {};
            const pullRequestNumberInput = String(request.pull_request_number || '');
            if (!/^[1-9][0-9]*$/.test(pullRequestNumberInput)) {
              throw new Error('pull request number must use canonical positive-integer form');
            }
            const pullRequestNumber = Number(pullRequestNumberInput);
            if (!Number.isSafeInteger(pullRequestNumber)) {
              throw new Error('pull request number exceeds the safe integer range');
            }
            const expectedHeadSha = String(request.expected_head_sha || '');
            const expectedBaseSha = String(request.expected_base_sha || '');
            const sourceEvent = String(request.source_event || '');

            if (!/^[0-9a-f]{40}$/.test(expectedHeadSha)) {
              throw new Error('expected head SHA must be a 40-character lowercase Git object ID');
            }
            if (!/^[0-9a-f]{40}$/.test(expectedBaseSha)) {
              throw new Error('expected merge-base SHA must be a 40-character lowercase Git object ID');
            }
            if (!new Set([
              'pull_request_target',
              'pull_request_review',
              'issue_comment',
              'workflow_run',
            ]).has(sourceEvent)) {
              throw new Error(`unsupported Shepherd source event: ${sourceEvent}`);
            }

            const resolveReviewedCommitSha = async (body) => {
              const match = String(body || '').match(reviewedCommitPattern);
              if (!match) return null;
              try {
                const {data: commit} = await github.rest.repos.getCommit({
                  ...context.repo,
                  ref: match[1],
                });
                return commit.sha;
              } catch (error) {
                core.info(`could not resolve Connector reviewed commit ${match[1]}: ${error}`);
                return null;
              }
            };

            const loadCurrentIdentity = async () => {
              const {data: pullRequest} = await github.rest.pulls.get({
                ...context.repo,
                pull_number: pullRequestNumber,
              });
              if (
                pullRequest.state !== 'open' ||
                pullRequest.base.ref !== 'master' ||
                pullRequest.draft ||
                pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                pullRequest.head.ref.startsWith('release-please--branches--master')
              ) {
                return {pullRequest, baseSha: null, eligible: false};
              }
              const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${pullRequest.base.sha}...${pullRequest.head.sha}`,
              });
              return {
                pullRequest,
                baseSha: comparison.merge_base_commit.sha,
                eligible: true,
              };
            };

            const dispatchCurrentIdentity = async (reason) => {
              const current = await loadCurrentIdentity();
              if (!current.eligible || !/^[0-9a-f]{40}$/.test(current.baseSha || '')) return false;
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo,
                workflow_id: 'codex-shepherd.yml',
                ref: 'master',
                inputs: {
                  pull_request_number: String(current.pullRequest.number),
                  expected_head_sha: current.pullRequest.head.sha,
                  expected_base_sha: current.baseSha,
                  source_event: sourceEvent,
                  source_action: `reconcile:${reason}`,
                },
              });
              return true;
            };

            const initialIdentity = await loadCurrentIdentity();
            if (!initialIdentity.eligible) {
              core.info('pull request is outside the autonomous Shepherd boundary');
              return;
            }
            const pullRequest = initialIdentity.pullRequest;
            if (
              pullRequest.head.sha !== expectedHeadSha ||
              initialIdentity.baseSha !== expectedBaseSha
            ) {
              core.info(
                `Shepherd request for ${expectedHeadSha}@${expectedBaseSha} is stale; ` +
                `current review identity is ${pullRequest.head.sha}@${initialIdentity.baseSha}`,
              );
              await dispatchCurrentIdentity('stale-apply');
              return;
            }

            const identityStillCurrent = async () => {
              const current = await loadCurrentIdentity();
              const matches =
                current.eligible &&
                current.pullRequest.head.sha === expectedHeadSha &&
                current.baseSha === expectedBaseSha;
              if (!matches) {
                core.info(
                  `skipping stale Shepherd comment for ${expectedHeadSha}@${expectedBaseSha}`,
                );
                await dispatchCurrentIdentity('stale-comment-boundary');
              }
              return matches;
            };

            const [changedFiles, issueComments, allReviews] = await Promise.all([
              github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: pullRequest.number,
                per_page: 100,
              }),
              github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: pullRequest.number,
                per_page: 100,
              }),
              github.paginate(github.rest.pulls.listReviews, {
                ...context.repo,
                pull_number: pullRequest.number,
                per_page: 100,
              }),
            ]);

            const shepherdComments = issueComments.filter(
              (comment) => comment.user?.login === shepherdLogin
            );
            const markers = shepherdComments.flatMap((comment) => {
              const body = String(comment.body || '');
              const found = [];
              for (const match of body.matchAll(reviewMarkerPattern)) {
                found.push({
                  type: 'review',
                  head: match[1],
                  base: match[2],
                  createdAt: comment.created_at,
                });
              }
              for (const match of body.matchAll(noteMarkerPattern)) {
                found.push({
                  type: 'note',
                  head: match[1],
                  base: match[2],
                  reason: match[3],
                  createdAt: comment.created_at,
                });
              }
              return found;
            });
            const sameHeadReviewRequests = markers
              .filter(({type, head, createdAt}) =>
                type === 'review' && head === expectedHeadSha && Boolean(createdAt)
              )
              .sort((a, b) => a.createdAt.localeCompare(b.createdAt));
            const latestSameHeadReviewRequest = sameHeadReviewRequests.at(-1) || null;
            const latestReviewRequestAt = (
              latestSameHeadReviewRequest?.base === expectedBaseSha
            ) ? latestSameHeadReviewRequest.createdAt : null;
            const exactDiffReviewRequest = latestReviewRequestAt !== null;

            const cleanCompletionTimes = [];
            for (const comment of issueComments) {
              if (
                !isConnectorLogin(comment.user?.login) ||
                !comment.created_at ||
                !/Didn't find any major issues\./i.test(String(comment.body || ''))
              ) {
                continue;
              }
              const reviewedCommitSha = await resolveReviewedCommitSha(comment.body);
              if (reviewedCommitSha === expectedHeadSha) {
                cleanCompletionTimes.push(comment.created_at);
              }
            }
            const formalReviewCompletionTimes = allReviews
              .filter((review) =>
                isConnectorLogin(review.user?.login) &&
                review.commit_id === expectedHeadSha &&
                review.submitted_at &&
                review.state !== 'DISMISSED'
              )
              .map((review) => review.submitted_at);
            const connectorCompletionTimes = [
              ...formalReviewCompletionTimes,
              ...cleanCompletionTimes,
            ].sort();
            const requestHasCompletion = (requestMarker) =>
              connectorCompletionTimes.some((completedAt) =>
                completedAt > requestMarker.createdAt
              );

            const exactDiffReviews = latestReviewRequestAt === null ? [] : allReviews.filter((review) =>
              isConnectorLogin(review.user?.login) &&
              review.commit_id === expectedHeadSha &&
              review.submitted_at &&
              review.submitted_at > latestReviewRequestAt &&
              review.state !== 'DISMISSED'
            );

            const postComment = async (body) => {
              if (!(await identityStillCurrent())) return false;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pullRequest.number,
                body,
              });
              return true;
            };
            const noteForOwner = async (reason, message) => {
              const alreadyNoted = markers.some(
                ({type, head, base, reason: notedReason}) =>
                  type === 'note' &&
                  head === expectedHeadSha &&
                  base === expectedBaseSha &&
                  notedReason === reason
              );
              if (alreadyNoted) return true;
              return postComment(
                `${message}\n\n` +
                `<!-- aletheia-codex-shepherd head=${expectedHeadSha} base=${expectedBaseSha} ` +
                `kind=note reason=${reason} -->`
              );
            };

            if (changedFiles.length !== pullRequest.changed_files) {
              await noteForOwner(
                'file-list-incomplete',
                `GitHub returned ${changedFiles.length} of ${pullRequest.changed_files} changed files ` +
                `for exact review identity \`${expectedHeadSha}@${expectedBaseSha}\`; ` +
                `Shepherd cannot prove the authority boundary.`
              );
              return;
            }

            const changesShepherdAuthority = changedFiles.some(({filename, previous_filename}) =>
              [filename, previous_filename].includes(shepherdPath)
            );
            if (changesShepherdAuthority) {
              await noteForOwner(
                'shepherd-self-change',
                `Codex Shepherd authority changed on exact review identity ` +
                `\`${expectedHeadSha}@${expectedBaseSha}\`. This control-plane change ` +
                `requires explicit owner merge; existing auto-merge authority remains fail-closed.`
              );
            }

            if (exactDiffReviews.length !== 0) {
              await noteForOwner(
                'review-finding',
                `Codex reported findings on exact review identity ` +
                `\`${expectedHeadSha}@${expectedBaseSha}\`. Owner disposition or a ` +
                `write-capable repair executor is required.`
              );
              return;
            }

            if (!exactDiffReviewRequest) {
              if (
                latestSameHeadReviewRequest &&
                !requestHasCompletion(latestSameHeadReviewRequest)
              ) {
                core.info(
                  `waiting for prior same-head Codex request ` +
                  `${latestSameHeadReviewRequest.head}@${latestSameHeadReviewRequest.base} ` +
                  `before requesting ${expectedHeadSha}@${expectedBaseSha}`,
                );
                return;
              }
              await postComment(
                `@codex review\n\n` +
                `Please review exact head \`${expectedHeadSha}\` against merge base ` +
                `\`${expectedBaseSha}\`. Follow the repository AGENTS.md review rules and ` +
                `report only consequential findings. CI remains the authority for deterministic ` +
                `checks.\n\n` +
                `<!-- aletheia-codex-shepherd head=${expectedHeadSha} base=${expectedBaseSha} kind=review -->`
              );
              return;
            }

            core.info(`Shepherd review state converged from ${sourceEvent}; no further mutation is required`);

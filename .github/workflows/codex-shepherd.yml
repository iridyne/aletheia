name: Codex PR shepherd

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, ready_for_review, synchronize, unlabeled]
  pull_request_review:
    branches: [master]
    types: [submitted]
  issue_comment:
    types: [created]
  workflow_run:
    # Aletheia Change Contract gate is an isolated same-head metadata status
    # boundary (#2167 Phase 1): its failure handoff is posted here without
    # holding/labeling the PR, because a PR-body-only edit on the same head
    # must be able to re-run it and recover normally.
    workflows: [Aletheia CI, Aletheia Change Contract gate]
    types: [completed]

permissions:
  contents: read

jobs:
  metadata-ci-recovery:
    name: Recover same-head CI after metadata repair
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.name == 'Aletheia Change Contract gate' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.status == 'completed' &&
      github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: write
      checks: read
      contents: read
      pull-requests: read
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04, casi]
    timeout-minutes: 5
    # A successful metadata-gate completion is a unique recovery edge. Do not
    # let later review/comment activity cancel the sole retry callback.
    concurrency:
      group: codex-shepherd-metadata-recovery-${{ github.event.workflow_run.id || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: Re-run metadata-blocked deep CI on the exact head
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            const metadataRun = context.payload.workflow_run;
            const prNumbers = [...new Set(
              (metadataRun.pull_requests || []).map(({number}) => number)
            )];
            if (prNumbers.length !== 1) {
              core.info(`expected one pull request, found ${prNumbers.length}`);
              return;
            }

            const {data: pullRequest} = await github.rest.pulls.get({
              ...context.repo,
              pull_number: prNumbers[0],
            });
            if (
              pullRequest.state !== 'open' ||
              pullRequest.base.ref !== 'master' ||
              pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
              pullRequest.head.sha !== metadataRun.head_sha
            ) {
              core.info('metadata callback is not bound to the current same-repository PR head');
              return;
            }

            const {data: checks} = await github.rest.checks.listForRef({
              ...context.repo,
              ref: pullRequest.head.sha,
              check_name: 'Verify Change Contract',
              filter: 'latest',
              per_page: 100,
            });
            const latestMetadataCheck = checks.check_runs
              .filter((check) =>
                check.name === 'Verify Change Contract' &&
                check.app?.slug === 'github-actions'
              )
              .sort((left, right) =>
                Date.parse(right.completed_at || right.started_at || 0) -
                Date.parse(left.completed_at || left.started_at || 0)
              )[0];
            if (latestMetadataCheck?.conclusion !== 'success') {
              core.info('latest exact-head metadata check is not successful');
              return;
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...context.repo,
              event: 'pull_request',
              head_sha: pullRequest.head.sha,
              per_page: 100,
            });
            const mainRun = runs
              .filter((run) => run.name === 'Aletheia CI')
              .sort((left, right) => Date.parse(right.updated_at) - Date.parse(left.updated_at))[0];
            if (mainRun?.status !== 'completed' || mainRun.conclusion !== 'failure') {
              core.info('exact-head main CI is not a completed metadata-blocked failure');
              return;
            }

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...context.repo,
              run_id: mainRun.id,
              filter: 'latest',
              per_page: 100,
            });
            const preflight = jobs.find((job) =>
              job.name === 'Change Contract preflight for deep CI'
            );
            const metadataFailure = preflight?.conclusion === 'failure' &&
              (preflight.steps || []).some((step) =>
                step.conclusion === 'failure' &&
                String(step.name || '').includes('Verify Change Contract')
              );
            if (!metadataFailure) {
              core.info('main CI failure was not the Change Contract preflight');
              return;
            }

            // This is the sole automatic retry: current metadata is green and the
            // exact-head main run was blocked before product code executed. GitHub
            // re-runs the failed prerequisite and its skipped dependants on the same
            // immutable PR event/merge SHA; no blanket test retry is permitted.
            await github.rest.actions.reRunWorkflowFailedJobs({
              ...context.repo,
              run_id: mainRun.id,
            });
            core.info(`re-ran metadata-blocked Aletheia CI run ${mainRun.id}`);

  shepherd:
    name: Codex PR shepherd
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04, casi]
    timeout-minutes: 10
    # Review/state callbacks are reconstructible from current PR state and may
    # converge to the newest event without affecting metadata recovery above.
    concurrency:
      group: codex-shepherd-reconcile-${{ github.event.pull_request.number || github.event.issue.number || github.event.workflow_run.pull_requests[0].number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Drive exact-head Codex review state
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            const connectorLogin = 'chatgpt-codex-connector';
            const shepherdLogin = 'github-actions[bot]';
            const shepherdPath = '.github/workflows/codex-shepherd.yml';
            const normalizeLogin = (login) => String(login || '').replace(/\[bot\]$/, '');
            const isConnectorLogin = (login) => normalizeLogin(login) === connectorLogin;
            const reviewTriggerActions = new Set([
              'opened',
              'reopened',
              'ready_for_review',
              'synchronize',
              'unlabeled',
            ]);
            const reviewMarkerPattern =
              /<!-- aletheia-codex-shepherd head=([0-9a-f]{40}) kind=review -->/g;
            const haltMarkerPattern =
              /<!-- aletheia-codex-shepherd halt head=([0-9a-f]{40}) reason=([a-z-]+) -->/g;
            const reviewedCommitPattern = /Reviewed commit:[^`]*`([0-9a-f]{7,40})`/i;
            const repairableCiConclusions = new Set(['failure', 'timed_out']);
            const primaryCiWorkflow = 'Aletheia CI';
            const metadataGateWorkflow = 'Aletheia Change Contract gate';
            const ciFailureHandoffPolicy = {
              preflight_metadata: {
                retry_without_code_change: true,
                repair_commit_required: false,
                metadata_edit_required: true,
              },
              runner_or_ci_infra: {
                retry_without_code_change: true,
                repair_commit_required: false,
                metadata_edit_required: false,
              },
              lint_static: {
                retry_without_code_change: false,
                repair_commit_required: true,
                metadata_edit_required: false,
              },
              test_contract_drift: {
                retry_without_code_change: false,
                repair_commit_required: true,
                metadata_edit_required: false,
              },
              product_regression: {
                retry_without_code_change: false,
                repair_commit_required: true,
                metadata_edit_required: false,
              },
              external_io_in_unit: {
                retry_without_code_change: false,
                repair_commit_required: true,
                metadata_edit_required: false,
              },
              unknown: {
                retry_without_code_change: false,
                repair_commit_required: false,
                metadata_edit_required: false,
              },
            };
            const ciFailureHandoff = ({run, category, failingJob = 'unknown', failingStep = 'unknown', confidence = 'unknown'}) => {
              const policy = ciFailureHandoffPolicy[category] || ciFailureHandoffPolicy.unknown;
              const normalized = `${category}|${failingJob}|${failingStep}`
                .toLowerCase().replace(/[^a-z0-9|_-]/g, '-').slice(0, 160);
              return JSON.stringify({
                schema_version: 'ci_failure_handoff.v1',
                pr_number: pullRequestNumberForEvent(),
                head_sha: expectedHeadSha,
                workflow_run_id: run.id,
                attempt: Number(run.run_attempt || 1),
                failing_job: failingJob,
                failing_step: failingStep,
                category,
                failure_fingerprint: normalized,
                evidence: run.html_url || `GitHub Actions run ${run.id}`,
                ...policy,
                confidence,
              }, null, 2);
            };
            const failedJobAndStep = async (run) => {
              try {
                const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                  ...context.repo,
                  run_id: run.id,
                  filter: 'latest',
                  per_page: 100,
                });
                const failures = jobs
                  .filter((job) => ['failure', 'timed_out'].includes(job.conclusion))
                  .sort((left, right) =>
                    Date.parse(left.started_at || left.completed_at || 0) -
                    Date.parse(right.started_at || right.completed_at || 0)
                  );
                const job = failures[0];
                if (!job) return {
                  category: 'unknown', failingJob: 'unknown', failingStep: 'unknown', confidence: 'unknown',
                };
                const step = (job.steps || []).find((candidate) =>
                  ['failure', 'timed_out'].includes(candidate.conclusion)
                );
                const failingJob = String(job.name || 'unknown').slice(0, 160);
                const failingStep = String(step?.name || 'unknown').slice(0, 160);
                const surface = `${failingJob} ${failingStep}`.toLowerCase();
                if (surface.includes('verify change contract')) return {
                  category: 'preflight_metadata', failingJob, failingStep, confidence: 'high',
                };
                if (surface.includes('verify architecture and ci invariants')) return {
                  category: 'test_contract_drift', failingJob, failingStep, confidence: 'high',
                };
                if (
                  surface.includes('lint python') ||
                  surface.includes('check documentation governance')
                ) return {
                  category: 'lint_static', failingJob, failingStep, confidence: 'high',
                };
                if (
                  surface.includes('check out source') ||
                  surface.includes('install uv') ||
                  surface.includes('synchronize locked dependencies') ||
                  surface.includes('install node') ||
                  surface.includes('install stable rust')
                ) return {
                  category: 'runner_or_ci_infra', failingJob, failingStep, confidence: 'medium',
                };
                // A failing test lane alone cannot distinguish a product regression,
                // stale test contract, or accidental unit egress without bounded log
                // evidence. Keep it fail-closed as unknown.
                return {category: 'unknown', failingJob, failingStep, confidence: 'unknown'};
              } catch (error) {
                core.info(`could not resolve failing CI job/step for run ${run.id}: ${error}`);
                return {
                  category: 'unknown', failingJob: 'unknown', failingStep: 'unknown', confidence: 'unknown',
                };
              }
            };

            const resolveReviewedCommitSha = async (body) => {
              const match = String(body || '').match(reviewedCommitPattern);
              if (!match) return null;
              try {
                const {data: commit} = await github.rest.repos.getCommit({
                  ...context.repo,
                  ref: match[1],
                });
                return commit.sha;
              } catch (error) {
                core.info(`could not resolve Connector reviewed commit ${match[1]}: ${error}`);
                return null;
              }
            };

            const pullRequestNumberForEvent = () => {
              const payload = context.payload;
              if (context.eventName === 'pull_request_target') {
                return payload.pull_request?.number || null;
              }
              if (context.eventName === 'pull_request_review') {
                if (!isConnectorLogin(payload.review?.user?.login)) return null;
                return payload.pull_request?.number || null;
              }
              if (context.eventName === 'issue_comment') {
                if (!payload.issue?.pull_request || !isConnectorLogin(payload.comment?.user?.login)) {
                  return null;
                }
                return payload.issue.number;
              }
              if (context.eventName === 'workflow_run') {
                const run = payload.workflow_run;
                if (run?.event !== 'pull_request') return null;
                const numbers = [...new Set((run.pull_requests || []).map(({number}) => number))];
                if (numbers.length !== 1) {
                  core.info(`expected one pull request for CI run, found ${numbers.length}`);
                  return null;
                }
                return numbers[0];
              }
              return null;
            };

            const pullRequestNumber = pullRequestNumberForEvent();
            if (!pullRequestNumber) return;

            const {data: pullRequest} = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullRequestNumber,
            });
            const expectedHeadSha = pullRequest.head.sha;
            if (
              pullRequest.state !== 'open' ||
              pullRequest.base.ref !== 'master' ||
              pullRequest.draft ||
              pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
              pullRequest.head.ref.startsWith('release-please--branches--master')
            ) {
              core.info('pull request is outside the autonomous Shepherd boundary');
              return;
            }

            if (
              context.eventName === 'pull_request_review' &&
              context.payload.review.commit_id !== expectedHeadSha
            ) {
              core.info('ignoring Connector review for a superseded head');
              return;
            }
            if (
              context.eventName === 'workflow_run' &&
              context.payload.workflow_run.head_sha !== expectedHeadSha
            ) {
              core.info('ignoring CI completion for a superseded head');
              return;
            }
            if (context.eventName === 'issue_comment') {
              const reviewedCommitSha = await resolveReviewedCommitSha(context.payload.comment.body);
              if (reviewedCommitSha !== expectedHeadSha) {
                core.info('ignoring Connector comment for a superseded or unbound head');
                return;
              }
            }

            const [changedFiles, issueComments, allReviews] = await Promise.all([
              github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: pullRequest.number,
                per_page: 100,
              }),
              github.paginate(github.rest.issues.listComments, {
                ...context.repo,
                issue_number: pullRequest.number,
                per_page: 100,
              }),
              github.paginate(github.rest.pulls.listReviews, {
                ...context.repo,
                pull_number: pullRequest.number,
                per_page: 100,
              }),
            ]);

            const exactHeadReviews = allReviews.filter((review) =>
              isConnectorLogin(review.user?.login) &&
              review.commit_id === expectedHeadSha &&
              review.submitted_at &&
              review.state !== 'DISMISSED'
            );

            // Only GitHub Actions may create Shepherd control markers. PR participants
            // must not be able to suppress a review or forge a terminal hold by prose.
            const shepherdComments = issueComments.filter(
              (comment) => comment.user?.login === shepherdLogin
            );
            const markers = shepherdComments.flatMap((comment) => {
              const body = String(comment.body || '');
              const found = [];
              for (const match of body.matchAll(reviewMarkerPattern)) {
                found.push({type: 'review', head: match[1]});
              }
              for (const match of body.matchAll(haltMarkerPattern)) {
                found.push({type: 'halt', head: match[1], reason: match[2]});
              }
              return found;
            });
            const exactHeadReviewRequest = markers.some(
              ({type, head}) => type === 'review' && head === expectedHeadSha
            );
            const exactHeadHalt = markers.some(
              ({type, head}) => type === 'halt' && head === expectedHeadSha
            );

            const postComment = async (body) => {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pullRequest.number,
                body,
              });
            };

            const holdForOwner = async (reason, message) => {
              const alreadyHeld = pullRequest.labels.some(({name}) => name === 'do-not-auto-merge');
              if (!alreadyHeld) {
                await github.rest.issues.addLabels({
                  ...context.repo,
                  issue_number: pullRequest.number,
                  labels: ['do-not-auto-merge'],
                });
              }
              // A terminal marker suppresses duplicate prose only. It must never
              // suppress restoring the safety label after an `unlabeled` event.
              if (exactHeadHalt) return;
              await postComment(
                `${message}\n\n` +
                `Codex Cloud repair is not authorized to push back to this repository yet, so ` +
                `the Shepherd fails closed instead of claiming an autonomous repair.\n\n` +
                `<!-- aletheia-codex-shepherd halt head=${expectedHeadSha} reason=${reason} -->`
              );
            };

            // A metadata-gate failure is diagnostic only: do NOT label/hold the PR.
            // Its required check is the authority, and a PR-body-only edit on this
            // exact same head must turn it green without a no-op source commit.
            const metadataRun = context.eventName === 'workflow_run'
              ? context.payload.workflow_run
              : null;
            if (
              metadataRun?.name === metadataGateWorkflow &&
              metadataRun.status === 'completed' &&
              repairableCiConclusions.has(metadataRun.conclusion)
            ) {
              const handoffMarker =
                `<!-- aletheia-ci-failure-handoff head=${expectedHeadSha} run=${metadataRun.id} -->`;
              const alreadyPosted = shepherdComments.some((comment) =>
                String(comment.body || '').includes(handoffMarker)
              );
              if (!alreadyPosted) {
                await postComment(
                  `Change Contract metadata gate run ${metadataRun.id} concluded ` +
                  `\`${metadataRun.conclusion}\` on exact head \`${expectedHeadSha}\`. ` +
                  `Edit the PR body on this same head; do not create a no-op/retrigger commit.\n\n` +
                  '```json\n' +
                  ciFailureHandoff({
                    run: metadataRun,
                    category: 'preflight_metadata',
                    failingJob: 'Verify Change Contract',
                    failingStep: 'Verify Change Contract structure',
                    confidence: 'high',
                  }) +
                  '\n```\n\n' +
                  handoffMarker
                );
              }
              return;
            }
            if (
              metadataRun?.name === metadataGateWorkflow &&
              metadataRun.status === 'completed' &&
              metadataRun.conclusion === 'success'
            ) {
              core.info('metadata recovery job owns any required same-head CI rerun');
              return;
            }

            // The files endpoint is capped by GitHub. If it cannot prove that the full
            // PR file set was enumerated, no authority decision is allowed.
            if (changedFiles.length !== pullRequest.changed_files) {
              await holdForOwner(
                'file-list-incomplete',
                `GitHub returned ${changedFiles.length} of ${pullRequest.changed_files} changed files ` +
                `for exact head \`${expectedHeadSha}\`; Shepherd cannot prove the authority boundary.`
              );
              return;
            }

            // This workflow is itself a PR control authority. pull_request_target executes
            // the trusted base/master copy, so a PR cannot remove this self-change guard by
            // editing its own candidate workflow. Re-apply the hold on `unlabeled` events.
            const changesShepherdAuthority = changedFiles.some(({filename, previous_filename}) =>
              [filename, previous_filename].includes(shepherdPath)
            );
            if (changesShepherdAuthority) {
              const alreadyHeld = pullRequest.labels.some(({name}) => name === 'do-not-auto-merge');
              if (!alreadyHeld) {
                await github.rest.issues.addLabels({
                  ...context.repo,
                  issue_number: pullRequest.number,
                  labels: ['do-not-auto-merge'],
                });
              }
              if (!exactHeadHalt) {
                await postComment(
                  `Codex Shepherd authority changed on exact head \`${expectedHeadSha}\`. ` +
                  `This control-plane change requires explicit owner merge and cannot resume ` +
                  `through ordinary auto-merge.\n\n` +
                  `<!-- aletheia-codex-shepherd halt head=${expectedHeadSha} reason=shepherd-self-change -->`
                );
              }
              return;
            }

            if (pullRequest.labels.some(({name}) => name === 'do-not-auto-merge')) {
              core.info('do-not-auto-merge holds this pull request');
              return;
            }

            // Event delivery is not a queue: concurrency can replace a pending callback.
            // Therefore every surviving callback converges from current exact-head reviews.
            if (exactHeadReviews.length !== 0) {
              await holdForOwner(
                'review-finding',
                `Codex reported exact-head review findings on \`${expectedHeadSha}\`. ` +
                `Owner disposition or a write-capable repair executor is required.`
              );
              return;
            }

            let connectorCleanExactHead = false;
            for (const comment of issueComments) {
              if (
                !isConnectorLogin(comment.user?.login) ||
                !/Didn't find any major issues\./i.test(String(comment.body || ''))
              ) {
                continue;
              }
              const reviewedCommitSha = await resolveReviewedCommitSha(comment.body);
              if (reviewedCommitSha === expectedHeadSha) {
                connectorCleanExactHead = true;
                break;
              }
            }

            // GitHub concurrency can replace a pending pull_request_target run. Any
            // surviving trusted callback therefore repairs a missing exact-head review
            // request before doing event-specific work.
            if (
              !exactHeadReviewRequest &&
              !connectorCleanExactHead &&
              (
                context.eventName !== 'pull_request_target' ||
                reviewTriggerActions.has(context.payload.action)
              )
            ) {
              await postComment(
                `@codex review\n\n` +
                `Please review exact head \`${expectedHeadSha}\`. Follow the repository AGENTS.md ` +
                `review rules and report only consequential findings. CI remains the authority for ` +
                `deterministic checks.\n\n` +
                `<!-- aletheia-codex-shepherd head=${expectedHeadSha} kind=review -->`
              );
              return;
            }

            if (context.eventName === 'pull_request_target') return;

            const latestCiRun = async () => {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                ...context.repo,
                event: 'pull_request',
                head_sha: expectedHeadSha,
                per_page: 100,
              });
              return runs
                .filter((run) => run.name === primaryCiWorkflow)
                .sort((a, b) => Date.parse(b.updated_at) - Date.parse(a.updated_at))[0] || null;
            };

            if (context.eventName === 'issue_comment') {
              if (!connectorCleanExactHead) return;
              const run = await latestCiRun();
              if (
                !run ||
                run.status !== 'completed' ||
                !repairableCiConclusions.has(run.conclusion)
              ) {
                return;
              }
              const failure = await failedJobAndStep(run);
              if (failure.category === 'preflight_metadata') {
                core.info('metadata failure is recoverable by a same-head PR body edit');
                return;
              }
              await holdForOwner(
                'ci-failure',
                `Aletheia CI run ${run.id} concluded \`${run.conclusion}\` on exact head ` +
                `\`${expectedHeadSha}\` after a clean Codex review. A write-capable repair executor ` +
                'is required.\n\n```json\n' +
                ciFailureHandoff({run, ...failure}) +
                '\n```'
              );
              return;
            }

            if (context.eventName === 'workflow_run') {
              const payloadRun = context.payload.workflow_run;
              const currentRun = await latestCiRun();
              if (
                !currentRun ||
                currentRun.id !== payloadRun.id ||
                currentRun.status !== 'completed' ||
                !repairableCiConclusions.has(currentRun.conclusion)
              ) {
                core.info('ignoring stale or non-actionable CI completion callback');
                return;
              }
              if (!connectorCleanExactHead) {
                core.info('CI failed before exact-head Codex completion; wait for the Connector callback');
                return;
              }
              const failure = await failedJobAndStep(currentRun);
              if (failure.category === 'preflight_metadata') {
                core.info('metadata failure is recoverable by a same-head PR body edit');
                return;
              }
              await holdForOwner(
                'ci-failure',
                `Aletheia CI run ${currentRun.id} concluded \`${currentRun.conclusion}\` on exact head ` +
                `\`${expectedHeadSha}\` after a clean Codex review. A write-capable repair executor ` +
                'is required.\n\n```json\n' +
                ciFailureHandoff({run: currentRun, ...failure}) +
                '\n```'
              );
            }

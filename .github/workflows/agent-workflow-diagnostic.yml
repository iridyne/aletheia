name: Agent Workflow Diagnostic

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-groups
      - name: Capture strict workflow findings
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p diagnostic
          set +e
          uv run aletheia agent workflow check --strict --changed-since "$CHANGE_BASE" --json > diagnostic/findings.json
          status=$?
          set -e
          cat diagnostic/findings.json
          echo "exit_code=$status" > diagnostic/status.txt
      - uses: actions/upload-artifact@v4
        with:
          name: agent-workflow-diagnostic
          path: diagnostic/
          if-no-files-found: error
          retention-days: 1

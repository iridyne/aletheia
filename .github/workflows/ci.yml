# Manual validation only.
# Ordinary pull requests do not trigger remote tests. Agents are responsible
# for running relevant repository tests during development. This workflow is
# reserved for an explicit current owner request for remote CI; Live, release,
# deployment, merge, or broad-validation intent alone does not authorize it.

name: Aletheia CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-full-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-ci-verdict:
    name: Full CI verdict
    runs-on: [pr-ephemeral]
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Synchronize Python dependencies
        run: uv sync --locked --all-groups

      - name: Lint Python
        run: uv run ruff check aletheia/ tests/

      - name: Run Python regression suite serially
        env:
          ALETHEIA_DATA_DIR: ${{ runner.temp }}/aletheia-manual-full-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mapfile -t test_files < <(
            find tests -type f \( -name 'test_*.py' -o -name 'spec_*.py' \) -print | sort
          )
          batch_size=40
          for ((offset = 0; offset < ${#test_files[@]}; offset += batch_size)); do
            uv run pytest "${test_files[@]:offset:batch_size}" -q --tb=short --timeout=120
          done

      - name: Test and build dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run check:settings-types
          npm run check:api-types
          npm test
          npm run build
      - name: Test and build Operator Shell
        working-directory: operator-shell
        run: |
          npm ci
          npm test
          npm run build

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Test native host
        working-directory: native/aletheia-host
        run: cargo test --locked --all-targets

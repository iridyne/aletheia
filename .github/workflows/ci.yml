name: Aletheia CI

on:
  pull_request:
    branches: [master]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review checks
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Detect affected review surfaces
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != "pull_request" ]; then
            echo 'coverage=true' >> "$GITHUB_OUTPUT"
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
            echo 'operator=true' >> "$GITHUB_OUTPUT"
            echo 'native=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # actions/checkout checks out GitHub's synthetic PR merge commit.
          # Parent 1 is the exact current base snapshot for this CI head; parent
          # 2 must be the exact PR head. Using payload.base.sha is wrong for a
          # long-lived PR because it stays pinned to the base from PR creation
          # and attributes later base-branch changes to the PR.
          base="$(git rev-parse HEAD^1)"
          merge_pr_head="$(git rev-parse HEAD^2)"
          expected_pr_head="${{ github.event.pull_request.head.sha }}"
          if [ "$merge_pr_head" != "$expected_pr_head" ]; then
            echo "pull-request merge ref does not match exact PR head" >&2
            exit 1
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

          # Changes to the CI controller must exercise every conditional path.
          if ! git diff --quiet "$base"...HEAD -- .github/workflows/ci.yml; then
            echo 'coverage=true' >> "$GITHUB_OUTPUT"
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
            echo 'operator=true' >> "$GITHUB_OUTPUT"
            echo 'native=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Coverage is expensive (~60s in a recent Review job), so ordinary
          # PRs pay for it only when a measured trust boundary, its direct test
          # surface, or coverage/pytest tooling and configuration changes.
          if git diff --quiet "$base"...HEAD -- \
            .coveragerc \
            pyproject.toml \
            pytest.toml \
            .pytest.toml \
            pytest.ini \
            .pytest.ini \
            tox.ini \
            setup.cfg \
            conftest.py \
            uv.lock \
            scripts/coverage_floors.py \
            tests/conftest.py \
            aletheia/analytics/profit_gradient.py \
            aletheia/analytics/profit_gradient_estimators.py \
            aletheia/analytics/profit_gradient_evidence.py \
            aletheia/analytics/position_replay.py \
            aletheia/counterfactual/filter_replay.py \
            aletheia/economics/context_artifacts.py \
            aletheia/execution/reconciliation.py \
            aletheia/learning/evidence_epoch.py \
            aletheia/learning/policy_epochs.py \
            tests/test_profit_gradient.py \
            tests/test_profit_gradient_properties.py \
            tests/test_profit_gradient_evidence.py \
            tests/test_p3_evidence_epoch.py \
            tests/test_filter_replay.py \
            tests/test_position_replay.py \
            tests/test_reconciliation.py \
            tests/test_oco_reconcile.py \
            tests/test_cr_ex01_reconcile.py \
            tests/test_position_reconciler.py \
            tests/test_scheduler_reconcile.py \
            tests/test_reconciliation_integrity_incident.py \
            tests/test_reconciliation_properties.py \
            tests/test_context_effectiveness.py \
            tests/test_context_artifacts_properties.py \
            tests/test_filter_replay_properties.py \
            tests/test_policy_epoch_properties.py \
            tests/test_profit_gradient_evidence_properties.py; then
            echo 'coverage=false' >> "$GITHUB_OUTPUT"
          else
            echo 'coverage=true' >> "$GITHUB_OUTPUT"
          fi

          # npm workspaces can make commands launched from a child project
          # inherit the repository-root manifest, lockfile, and npm config.
          if git diff --quiet "$base"...HEAD -- \
            frontend/ \
            package.json \
            package-lock.json \
            npm-shrinkwrap.json \
            .npmrc; then
            echo 'frontend=false' >> "$GITHUB_OUTPUT"
          else
            echo 'frontend=true' >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet "$base"...HEAD -- \
            operator-shell/ \
            package.json \
            package-lock.json \
            npm-shrinkwrap.json \
            .npmrc; then
            echo 'operator=false' >> "$GITHUB_OUTPUT"
          else
            echo 'operator=true' >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet "$base"...HEAD -- \
            native/ \
            .cargo/ \
            Cargo.toml \
            Cargo.lock \
            rust-toolchain \
            rust-toolchain.toml; then
            echo 'native=false' >> "$GITHUB_OUTPUT"
          else
            echo 'native=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Without an explicit version this resolves "latest" and downloads a
          # fresh uv whenever upstream publishes one: six releases landed on the
          # runners in nine days. Pinned, it hits the runner tool cache instead.
          # Bump deliberately alongside the lockfile.
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Lint Python
        run: uv run ruff check aletheia/ tests/

      - name: Verify architecture and CI invariants
        run: uv run pytest tests/test_architecture_fitness.py tests/test_ci_workflow_contract.py tests/test_ci_pr_base_contract.py -q --tb=short

      # Trust-boundary branch coverage. Scoped to files where a wrong answer
      # misleads a decision, corrupts state, or bypasses a check (see
      # .coveragerc). No repo-wide fail-under; floors live in
      # scripts/coverage_floors.py and only ratchet up.
      - name: Trust-boundary coverage floors
        if: steps.changes.outputs.coverage == 'true'
        env:
          ALETHEIA_DATA_DIR: ${{ runner.temp }}/aletheia-ci-${{ github.run_id }}-${{ github.run_attempt }}-cov
        run: |
          set -euo pipefail
          uv run pytest \
            tests/test_profit_gradient.py \
            tests/test_profit_gradient_properties.py \
            tests/test_profit_gradient_evidence.py \
            tests/test_p3_evidence_epoch.py \
            tests/test_filter_replay.py \
            tests/test_position_replay.py \
            tests/test_reconciliation.py \
            tests/test_oco_reconcile.py \
            tests/test_cr_ex01_reconcile.py \
            tests/test_position_reconciler.py \
            tests/test_scheduler_reconcile.py \
            tests/test_reconciliation_integrity_incident.py \
            tests/test_reconciliation_properties.py \
            tests/test_context_effectiveness.py \
            tests/test_context_artifacts_properties.py \
            tests/test_filter_replay_properties.py \
            tests/test_policy_epoch_properties.py \
            tests/test_profit_gradient_evidence_properties.py \
            --cov --cov-report=term-missing:skip-covered \
            -q --tb=short --timeout=120
          uv run python scripts/coverage_floors.py --selftest
          uv run python scripts/coverage_floors.py

      - name: Check documentation governance
        run: uv run python scripts/check_docs.py

      - name: Scan the pull-request commit range for leaked secrets
        shell: bash
        run: |
          set -euo pipefail
          version=8.24.3
          expected=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-$version"
          # Restore from the runner's pre-seeded tool cache first. Fetching this
          # archive on every run means every run can fail on a transient egress
          # fault; the network is the fallback here, not the normal path.
          cached="${CI_TOOL_CACHE:-$RUNNER_TEMP/ci-tools}/gitleaks/gitleaks_${version}_linux_x64.tar.gz"
          if [ -r "$cached" ] && cp "$cached" "$archive" &&
             printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --status -; then
            echo "restored gitleaks $version from $cached"
          else
            curl --fail --location --silent --show-error \
              --retry 3 --retry-delay 2 \
              "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
              --output "$archive"
            # Seed the cache so the next run stays offline. Best-effort: a
            # read-only or absent cache directory must not fail the scan.
            if mkdir -p "$(dirname "$cached")" 2>/dev/null; then
              cp "$archive" "$cached.partial" && mv "$cached.partial" "$cached" ||
                rm -f "$cached.partial"
            fi
          fi
          # Authoritative gate for both paths, so a stale or tampered cache
          # entry fails exactly like a bad download would.
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pr_base="${{ steps.changes.outputs.base }}"
            if [ -z "$pr_base" ]; then
              echo "missing resolved pull-request base" >&2
              exit 1
            fi
            log_opts="$pr_base..HEAD"
          else
            log_opts="HEAD^..HEAD"
          fi
          "$install_dir/gitleaks" git --redact --log-opts="$log_opts"

      - name: Install Node.js
        if: steps.changes.outputs.frontend == 'true' || steps.changes.outputs.operator == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Check dashboard
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npx tsc -b --pretty false

      - name: Check Operator Shell
        if: steps.changes.outputs.operator == 'true'
        working-directory: operator-shell
        run: |
          npm ci
          npm test
          npm run build

      # `rustup toolchain install` always syncs the channel manifest, so the
      # step below reaches static.rust-lang.org even when stable is already
      # present: it exits 1 in 30s when egress is refused, and hangs until the
      # job times out when egress is merely unresponsive. This probe needs no
      # network, so an already-provisioned runner stops depending on one.
      - name: Check for a preinstalled Rust toolchain
        if: steps.changes.outputs.native == 'true'
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          if rustup show active-toolchain 2>/dev/null | grep -q '^stable-'; then
            echo 'preinstalled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'preinstalled=false' >> "$GITHUB_OUTPUT"
          fi

      # Kept as the fallback so a fresh runner still provisions itself.
      - name: Install stable Rust toolchain
        if: steps.changes.outputs.native == 'true' && steps.rust.outputs.preinstalled != 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Ensure the self-contained Linux target is available
        if: steps.changes.outputs.native == 'true'
        shell: bash
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-musl
          if ! rustup target list --installed | grep -qx "$target"; then
            rustup target add "$target"
          fi

      - name: Test the platform-neutral native host
        if: steps.changes.outputs.native == 'true'
        working-directory: native/aletheia-host
        env:
          RUSTFLAGS: -C linker=rust-lld
        run: cargo test --locked --all-targets --target x86_64-unknown-linux-musl

  # Stage 1: with two self-hosted runners, Review and Unit are the only jobs
  # eligible at T0. This makes the first useful failure signal deterministic
  # without relying on matrix creation order or runner queue ordering.
  unit:
    name: Python unit
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Run unit regression tier
        env:
          ALETHEIA_DATA_DIR: ${{ runner.temp }}/aletheia-ci-${{ github.run_id }}-${{ github.run_attempt }}-tier_unit
        run: >-
          uv run pytest tests/
          --ignore=tests/simulation
          --ignore=tests/test_auto_resume.py
          --ignore=tests/test_connectivity.py
          --ignore=tests/test_operator_cli.py
          --ignore=tests/test_pause_ownership.py
          -m "tier_unit"
          -n 6
          --dist loadfile
          -q --tb=short
          --timeout=120

  # Stage 2: deep tiers retain independent reporting, but only become eligible
  # after the exact-head Review and Unit gates have both succeeded.
  tests:
    name: Python ${{ matrix.name }}
    needs: [review, unit]
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 20
    strategy:
      # A deep-tier failure must not hide another deep regression. Stage-1
      # failures stop deep CI before it consumes runner capacity instead.
      fail-fast: false
      matrix:
        include:
          - name: specifications
            marker: tier_spec
          - name: integration
            marker: tier_integration
          - name: end-to-end
            marker: tier_e2e

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Run ${{ matrix.name }} regression tier
        env:
          ALETHEIA_DATA_DIR: ${{ runner.temp }}/aletheia-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.marker }}
        run: >-
          uv run pytest tests/
          --ignore=tests/simulation
          --ignore=tests/test_auto_resume.py
          --ignore=tests/test_connectivity.py
          --ignore=tests/test_operator_cli.py
          --ignore=tests/test_pause_ownership.py
          -m "${{ matrix.marker }}"
          -n 4
          --dist loadfile
          -q --tb=short
          --timeout=120

  runtime-state-tests:
    name: Python runtime state
    needs: [review, unit]
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Ensure archive extraction tool is available
        shell: bash
        run: |
          set -euo pipefail
          if command -v unzip >/dev/null 2>&1; then
            exit 0
          fi
          install_dir="$RUNNER_TEMP/ci-bin"
          mkdir -p "$install_dir"
          cat > "$install_dir/unzip" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${1:-}" = "-q" ]; then
            shift
          fi
          if [ "$#" -ne 3 ] || [ "$2" != "-d" ]; then
            echo "usage: unzip [-q] ARCHIVE -d DESTINATION" >&2
            exit 2
          fi
          exec uv run python -m zipfile -e "$1" "$3"
          SH
          chmod +x "$install_dir/unzip"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run runtime-state regression
        shell: bash
        run: |
          set -euo pipefail
          ALETHEIA_DATA_DIR="$RUNNER_TEMP/aletheia-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-runtime-state" \
            uv run pytest tests/test_auto_resume.py tests/test_operator_cli.py \
              -n 2 --dist loadfile -q --tb=short --timeout=120
          ALETHEIA_DATA_DIR="$RUNNER_TEMP/aletheia-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-pause-ownership" \
            uv run pytest tests/test_pause_ownership.py \
              -n 1 -q --tb=short --timeout=120
          ALETHEIA_DATA_DIR="$RUNNER_TEMP/aletheia-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-connectivity" \
            uv run pytest tests/test_connectivity.py \
              -n 1 -q --tb=short --timeout=120

  release-candidate:
    name: Hand off verified release candidate
    needs: [review, unit, tests, runtime-state-tests]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref_name, 'release-please--branches--master')
    permissions:
      contents: write
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    steps:
      - name: Dispatch verified candidate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            await github.rest.repos.createDispatchEvent({
              ...context.repo,
              event_type: 'release_candidate_verified',
              client_payload: {
                head_branch: context.ref.replace('refs/heads/', ''),
                head_sha: context.sha,
              },
            });

  release-pr-ci:
    name: Hand off verified release pull request
    needs: [review, unit, tests, runtime-state-tests]
    if: >-
      github.event_name == 'pull_request' &&
      startsWith(github.head_ref, 'release-please--branches--master')
    permissions:
      contents: write
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    steps:
      - name: Dispatch verified release pull request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            await github.rest.repos.createDispatchEvent({
              ...context.repo,
              event_type: 'auto_merge_update',
              client_payload: {
                operation: 'enable',
                pull_request_number: context.payload.pull_request.number,
                expected_head_sha: context.payload.pull_request.head.sha,
                release_after_merge: true,
              },
            });

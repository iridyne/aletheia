name: Aletheia CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run the full Python regression audit
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

# Superseded commits on the same PR may cancel their older run. Every master push
# uses its own event-and-SHA-scoped group so a later push cannot erase the only
# completed integrity check for an earlier commit range, and a duplicate push of
# the same SHA cannot replace a pending manual full-regression run.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('ci-{0}-{1}-{2}', github.workflow, github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Secrets ──────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets scan
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Static analysis ───────────────────────────────────────────────────────
  # Covers: ruff lint  +  AST/import-graph architecture invariants.
  # No test execution — pure static, fails fast before any test runner spins up.
  static-checks:
    name: Static analysis
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Lint Python
        run: uv run ruff check aletheia/ tests/

      - name: Verify architecture invariants
        run: uv run pytest tests/test_architecture_fitness.py -q --tb=short

      - name: Verify CI workflow contract
        run: uv run pytest tests/test_ci_workflow_contract.py -q --tb=short

  # ── Executable specifications (SDD contracts) ────────────────────────────
  # Covers: all tier_spec tests — tests/specs/ (101 files, ~1135 tests)
  #         + tests/test_spec_conformance.py (gets tier_spec via conftest).
  # Uses -n auto because specs are independent and purely in-memory.
  specs:
    name: Executable specifications
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Prepare test report directory
        run: mkdir -p test-results

      - name: Run executable specifications
        run: uv run pytest -m tier_spec -n auto -q --tb=short --junitxml=test-results/specs.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specs-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ── Unit tests ────────────────────────────────────────────────────────────
  # Covers: all tier_unit tests — tests/test_*.py + tests/filter_eval/
  #         Explicitly excludes tests/simulation/ (owned by the simulation job).
  #         Includes slow unit tests (test_doctor*, etc.) that were previously
  #         only reachable via full-regression.
  unit:
    name: Unit tests
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Prepare test report directory
        run: mkdir -p test-results

      - name: Run unit tests
        run: >-
          uv run pytest tests/
          -m tier_unit
          --ignore=tests/simulation
          -n auto
          -q --tb=short
          --junitxml=test-results/unit.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ── Integration tests ─────────────────────────────────────────────────────
  # Covers: all tier_integration tests — route/runtime/storage/service layer
  #         boundaries. Includes test_runtime_replay_pack.py (tier_integration
  #         via "runtime" token) which was previously duplicated in backend.
  integration:
    name: Integration tests
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Prepare test report directory
        run: mkdir -p test-results

      - name: Run integration tests
        run: uv run pytest -m integration -n auto -q --tb=short --junitxml=test-results/integration.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ── Deterministic control-loop simulation ────────────────────────────────
  # Covers: ALL tests in tests/simulation/ (8 files — previously only 5 ran).
  # Runs with constrained DCLS settings so hypothesis uses a fixed seed and
  # a small example budget for deterministic, fast CI results.
  # The nightly job (dcls-nightly.yml) re-runs the same suite with full budgets.
  simulation:
    name: Deterministic control-loop simulation
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 15
    env:
      DCLS_MAX_EXAMPLES: 8
      DCLS_STATEFUL_STEPS: 8
      DCLS_SEED: 20260713

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Prepare test report directory
        run: mkdir -p test-results

      - name: Run control-loop simulation
        run: uv run pytest tests/simulation/ -q --tb=short --junitxml=test-results/simulation.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ── End-to-end pipeline ───────────────────────────────────────────────────
  # Covers: ALL tests in tests/e2e/ (15 files — previously only 7 ran).
  # Uses -n auto; each xdist worker gets its own SQLite session with
  # SAVEPOINT-based per-test isolation (see tests/e2e/conftest.py).
  e2e:
    name: End-to-end pipeline
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Prepare test report directory
        run: mkdir -p test-results

      - name: Run end-to-end pipeline tests
        run: uv run pytest tests/e2e/ -n auto -q --tb=short --junitxml=test-results/e2e.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ── Native host (Rust) ────────────────────────────────────────────────────
  # Covers: unit tests in native/aletheia-host (bootstrap, update, host logic).
  # Previously only ran in build-packaged-runtime.yml on path-filtered triggers.
  native:
    name: Native host
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Rust unit tests
        working-directory: native/aletheia-host
        run: cargo test --locked --all-targets

  # ── Frontend ──────────────────────────────────────────────────────────────
  frontend:
    name: Dashboard build
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dashboard dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint dashboard
        working-directory: frontend
        run: npm run lint

      - name: Type-check and build dashboard
        working-directory: frontend
        run: npm run build

  # ── Operator Shell ────────────────────────────────────────────────────────
  operator-shell:
    name: Operator Shell test and build
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: operator-shell/package-lock.json

      - name: Install locked Operator Shell dependencies
        working-directory: operator-shell
        run: npm ci

      - name: Test Operator Shell
        working-directory: operator-shell
        run: npm test

      - name: Type-check Operator Shell
        working-directory: operator-shell
        run: npm run build

  # ── Gate ──────────────────────────────────────────────────────────────────
  ci-gate:
    name: CI gate
    if: ${{ always() && (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}
    needs:
      - secrets-scan
      - static-checks
      - specs
      - unit
      - integration
      - simulation
      - e2e
      - native
      - frontend
      - operator-shell
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 5

    steps:
      - name: Require all CI surfaces
        run: |
          test "${{ needs.secrets-scan.result }}" = "success"
          test "${{ needs.static-checks.result }}" = "success"
          test "${{ needs.specs.result }}" = "success"
          test "${{ needs.unit.result }}" = "success"
          test "${{ needs.integration.result }}" = "success"
          test "${{ needs.simulation.result }}" = "success"
          test "${{ needs.e2e.result }}" = "success"
          test "${{ needs.native.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.operator-shell.result }}" = "success"
          echo "All required CI surfaces passed."

  # ── Manual: full regression ───────────────────────────────────────────────
  # Triggered manually via workflow_dispatch. Runs the complete test suite
  # without marker filtering — catches anything the per-category jobs miss
  # (e.g. simulation tests with default hypothesis settings).
  full-regression:
    name: Full Python regression audit
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_regression }}
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Prepare test report directory
        run: mkdir -p test-results

      - name: Run full regression audit
        run: uv run pytest tests/ -q --tb=line --junitxml=test-results/full.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

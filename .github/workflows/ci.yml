# RUNNER SECURITY CONTRACT (#1356)
# Every job in this PR/merge validation workflow executes on the dedicated
# one-job disposable runner class. Privileged release handoff is intentionally
# absent: the default-branch workflow_run controller revalidates this run.

name: Aletheia CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: http.connectTimeout
  GIT_CONFIG_VALUE_0: "30"
  GIT_HTTP_LOW_SPEED_LIMIT: "1000"
  GIT_HTTP_LOW_SPEED_TIME: "30"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Scheduling gate for code-changing CI events. The separately named
  # `Verify Change Contract` workflow handles pull_request `edited` recovery
  # on the same head; this job never runs on that event and only prevents an
  # invalid first submission from allocating Review/Unit/Stage 2 runners.
  change-contract-preflight:
    name: Change Contract preflight for deep CI
    permissions:
      contents: read
      pull-requests: read
    runs-on: [pr-ephemeral]
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The parser resolves changed files from the synthetic merge's first
          # parent; two commits are sufficient and deep history is not needed
          # until Review core.
          fetch-depth: 2
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false
      - name: Read current exact-head PR body
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          script: |
            const fs = require('fs');
            const {data: pullRequest} = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.pull_request.number,
            });
            if (pullRequest.head.sha !== context.payload.pull_request.head.sha) {
              throw new Error('pull-request head changed before metadata verification');
            }
            fs.writeFileSync(
              `${process.env.RUNNER_TEMP}/current-pr-body.md`,
              pullRequest.body || '',
              'utf8',
            );
      - name: Verify Change Contract before deep CI (no dependency sync)
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          CHANGE_CONTRACT_PR_BODY_FILE: ${{ github.event_name == 'pull_request' && format('{0}/current-pr-body.md', runner.temp) || '' }}
        run: uv run --no-sync python scripts/check_change_contract.py

  plan:
    name: Plan CI lanes
    needs: [change-contract-preflight]
    if: ${{ !cancelled() && needs.change-contract-preflight.result == 'success' }}
    runs-on: [pr-ephemeral]
    timeout-minutes: 5
    outputs:
      schema_version: ${{ steps.plan.outputs.schema_version }}
      policy_version: ${{ steps.plan.outputs.policy_version }}
      base_sha: ${{ steps.plan.outputs.base_sha }}
      head_sha: ${{ steps.plan.outputs.head_sha }}
      mode: ${{ steps.plan.outputs.mode }}
      github_ci: ${{ steps.plan.outputs.github_ci }}
      plan_fingerprint: ${{ steps.plan.outputs.plan_fingerprint }}
      codex_required: ${{ steps.plan.outputs.codex_required }}
      required_quick: ${{ steps.plan.outputs.required_quick }}
      required_python_unit: ${{ steps.plan.outputs.required_python_unit }}
      required_runtime: ${{ steps.plan.outputs.required_runtime }}
      required_integration: ${{ steps.plan.outputs.required_integration }}
      required_specifications: ${{ steps.plan.outputs.required_specifications }}
      required_e2e: ${{ steps.plan.outputs.required_e2e }}
      required_frontend: ${{ steps.plan.outputs.required_frontend }}
      required_operator: ${{ steps.plan.outputs.required_operator }}
      required_native: ${{ steps.plan.outputs.required_native }}
      required_coverage: ${{ steps.plan.outputs.required_coverage }}
      required_full_ci: ${{ steps.plan.outputs.required_full_ci }}
      required_shadow_backstop: ${{ steps.plan.outputs.required_shadow_backstop }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false
      - name: Compute deterministic CI plan
        id: plan
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          label_args=()
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            while IFS= read -r label; do
              label_args+=(--trusted-label "$label")
            done < <(python - <<'PY'
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as handle:
              payload = json.load(handle)
          for label in payload.get("pull_request", {}).get("labels", []):
              name = label.get("name")
              if name:
                  print(name)
          PY
          )
          fi
          uv run --no-sync python scripts/ci_plan.py \
            --event "$GITHUB_EVENT_NAME" \
            "${label_args[@]}" \
            --github-output "$GITHUB_OUTPUT"

  review-core:
    name: Review core
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.required_quick == 'true' }}
    runs-on: [pr-ephemeral]
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Lint Python
        run: uv run ruff check aletheia/ tests/

      - name: Verify architecture and CI invariants
        run: uv run pytest tests/test_architecture_fitness.py tests/test_ci_workflow_contract.py tests/test_ci_pr_base_contract.py tests/test_ci_stage2_status_contract.py tests/test_frontend_ci_build_contract.py -q --tb=short

      - name: Check documentation governance
        run: uv run python scripts/check_docs.py

      # NOTE: the Change Contract metadata check intentionally lives in the
      # dedicated `.github/workflows/ci-change-contract.yml` gate (listens to
      # `pull_request` `edited` too). It is NOT here: a metadata-only failure
      # must not redden the required `Review checks` aggregate for the same
      # head, which would force a no-op/retrigger commit instead of the
      # supported same-head metadata recovery path (#2167 Phase 1 / addendum A).
      - name: Scan the pull-request commit range for leaked secrets
        shell: bash
        run: |
          set -euo pipefail
          version=8.24.3
          expected=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-$version"
          cached="${CI_TOOL_CACHE:-$RUNNER_TEMP/ci-tools}/gitleaks/gitleaks_${version}_linux_x64.tar.gz"
          if [ -r "$cached" ] && cp "$cached" "$archive" &&
             printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --status -; then
            echo "restored gitleaks $version from $cached"
          else
            curl --fail --location --silent --show-error \
              --connect-timeout 15 --max-time 60 \
              --retry 3 --retry-delay 2 --retry-max-time 180 \
              "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
              --output "$archive"
            if mkdir -p "$(dirname "$cached")" 2>/dev/null; then
              cp "$archive" "$cached.partial" && mv "$cached.partial" "$cached" ||
                rm -f "$cached.partial"
            fi
          fi
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            pr_base="${{ needs.plan.outputs.base_sha }}"
            if [ -z "$pr_base" ]; then
              echo "missing resolved pull-request base" >&2
              exit 1
            fi
            log_opts="$pr_base..HEAD"
          else
            log_opts="HEAD^..HEAD"
          fi
          "$install_dir/gitleaks" git --redact --log-opts="$log_opts"

  review-coverage:
    name: Review trust-boundary coverage
    needs: [plan, review-core]
    if: ${{ needs.plan.outputs.required_coverage == 'true' }}
    runs-on: [pr-ephemeral]
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Trust-boundary coverage floors
        env:
          ALETHEIA_DATA_DIR: ${{ runner.temp }}/aletheia-ci-${{ github.run_id }}-${{ github.run_attempt }}-cov
        run: |
          set -euo pipefail
          uv run pytest \
            tests/test_profit_gradient.py \
            tests/test_profit_gradient_properties.py \
            tests/test_profit_gradient_evidence.py \
            tests/test_p3_evidence_epoch.py \
            tests/test_filter_replay.py \
            tests/test_position_replay.py \
            tests/test_reconciliation.py \
            tests/test_oco_reconcile.py \
            tests/test_cr_ex01_reconcile.py \
            tests/test_position_reconciler.py \
            tests/test_scheduler_reconcile.py \
            tests/test_reconciliation_integrity_incident.py \
            tests/test_reconciliation_properties.py \
            tests/test_context_effectiveness.py \
            tests/test_context_artifacts_properties.py \
            tests/test_filter_replay_properties.py \
            tests/test_policy_epoch_properties.py \
            tests/test_profit_gradient_evidence_properties.py \
            --cov --cov-report=term-missing:skip-covered \
            -q --tb=short --timeout=120
          uv run python scripts/coverage_floors.py --selftest
          uv run python scripts/coverage_floors.py

  review-node:
    name: Review Node surfaces
    needs: [plan, review-core]
    if: ${{ needs.plan.outputs.required_frontend == 'true' || needs.plan.outputs.required_operator == 'true' }}
    runs-on: [pr-ephemeral]
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Install uv and Python 3.12 for generated API contracts
        if: ${{ needs.plan.outputs.required_frontend == 'true' }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false

      - name: Synchronize Python dependencies for generated API contracts
        if: ${{ needs.plan.outputs.required_frontend == 'true' }}
        run: uv sync --locked --all-groups

      - name: Check dashboard
        if: ${{ needs.plan.outputs.required_frontend == 'true' }}
        working-directory: frontend
        run: |
          npm ci
          npm run check:settings-types
          while IFS= read -r -d '' target; do
            npx eslint "$target"
          done < <(find src -mindepth 1 -maxdepth 1 -print0 | sort -z)
          npm test
          # Do not add a direct "npx tsc -b" here; npm run build owns the type-check.
          build_dir="${RUNNER_TEMP}/aletheia-dashboard-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          VITE_BUILD_OUT_DIR="$build_dir" npm run build
          test -s "$build_dir/performance.json"

      - name: Check Operator Shell
        if: ${{ always() && needs.plan.outputs.required_operator == 'true' }}
        working-directory: operator-shell
        run: |
          # The package test uses explicit file paths, so this is the single
          # operator-shell regression lane and does not need a Windows duplicate.
          npm ci
          npm test
          npm run build

  review-native:
    name: Review native host
    needs: [plan, review-core]
    if: ${{ needs.plan.outputs.required_native == 'true' }}
    runs-on: [pr-ephemeral]
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for a preinstalled Rust toolchain
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          if rustup show active-toolchain 2>/dev/null | grep -q '^stable-'; then
            echo 'preinstalled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'preinstalled=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Install stable Rust toolchain
        if: steps.rust.outputs.preinstalled != 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Ensure the self-contained Linux target is available
        shell: bash
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-musl
          if ! rustup target list --installed | grep -qx "$target"; then
            rustup target add "$target"
          fi

      - name: Test the platform-neutral native host
        working-directory: native/aletheia-host
        env:
          RUSTFLAGS: -C linker=rust-lld
        run: cargo test --locked --all-targets --target x86_64-unknown-linux-musl

  review:
    name: Review checks
    needs: [plan, review-core, review-coverage, review-node, review-native]
    if: ${{ !cancelled() && needs.plan.outputs.required_quick == 'true' }}
    runs-on: [pr-ephemeral]
    timeout-minutes: 5
    steps:
      - name: Aggregate review results
        env:
          CORE_RESULT: ${{ needs.review-core.result }}
          COVERAGE_RESULT: ${{ needs.review-coverage.result }}
          NODE_RESULT: ${{ needs.review-node.result }}
          NATIVE_RESULT: ${{ needs.review-native.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CORE_RESULT" != "success" ]; then
            echo "review-core result: $CORE_RESULT" >&2
            exit 1
          fi
          for pair in \
            "coverage:$COVERAGE_RESULT" \
            "node:$NODE_RESULT" \
            "native:$NATIVE_RESULT"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            case "$result" in
              success|skipped) ;;
              *)
                echo "$name review result: $result" >&2
                exit 1
                ;;
            esac
          done

  unit:
    name: Python unit
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.required_python_unit == 'true' }}
    runs-on: [pr-ephemeral]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false
      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups
      - name: Run unit regression tier
        env:
          ALETHEIA_DATA_DIR: ${{ runner.temp }}/aletheia-ci-${{ github.run_id }}-${{ github.run_attempt }}-tier_unit-${{ matrix.shard }}
        run: |
          mapfile -t test_files < <(
            find tests -type f -name 'test_*.py' \
              ! -path 'tests/simulation/*' \
              ! -path 'tests/test_auto_resume.py' \
              ! -path 'tests/test_connectivity.py' \
              ! -path 'tests/test_operator_cli.py' \
              ! -path 'tests/test_pause_ownership.py' \
              | sort | awk -v shard="${{ matrix.shard }}" 'NR % 4 == shard'
          )
          uv run pytest "${test_files[@]}" \
            -m "tier_unit" -q --tb=short --timeout=120

  # Lane A head: Runtime State is the short, high-value prerequisite. Specs are
  # intentionally ineligible until this job finishes, so they can never steal a
  # runner ahead of Runtime while still running even when Runtime itself fails.
  runtime-state-tests:
    name: Python runtime state
    needs: [plan, review, unit]
    if: ${{ !cancelled() && needs.plan.outputs.required_runtime == 'true' && needs.review.result == 'success' && needs.unit.result == 'success' }}
    runs-on: [pr-ephemeral]
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false
      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups
      - name: Ensure archive extraction tool is available
        shell: bash
        run: |
          set -euo pipefail
          if command -v unzip >/dev/null 2>&1; then
            exit 0
          fi
          install_dir="$RUNNER_TEMP/ci-bin"
          mkdir -p "$install_dir"
          cat > "$install_dir/unzip" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${1:-}" = "-q" ]; then
            shift
          fi
          if [ "$#" -ne 3 ] || [ "$2" != "-d" ]; then
            echo "usage: unzip [-q] ARCHIVE -d DESTINATION" >&2
            exit 2
          fi
          exec uv run python -m zipfile -e "$1" "$3"
          SH
          chmod +x "$install_dir/unzip"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Run runtime-state regression
        shell: bash
        run: |
          set -euo pipefail
          ALETHEIA_DATA_DIR="$RUNNER_TEMP/aletheia-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-runtime-state" \
            uv run pytest tests/test_auto_resume.py tests/test_operator_cli.py \
              -n 2 --dist loadfile -q --tb=short --timeout=120
          ALETHEIA_DATA_DIR="$RUNNER_TEMP/aletheia-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-pause-ownership" \
            uv run pytest tests/test_pause_ownership.py \
              -n 1 -q --tb=short --timeout=120
          ALETHEIA_DATA_DIR="$RUNNER_TEMP/aletheia-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-connectivity" \
            uv run pytest tests/test_connectivity.py \
              -n 1 -q --tb=short --timeout=120
          ALETHEIA_DATA_DIR="$RUNNER_TEMP/aletheia-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-simulation" \
            uv run pytest tests/simulation \
              -n 1 -q --tb=short --timeout=120

  # Lane B head. Only Runtime State and Integration are eligible when Stage 2
  # opens, giving the two Fedora runners deterministic lane ownership.
  integration:
    name: Python integration
    needs: [plan, review, unit]
    if: ${{ !cancelled() && needs.plan.outputs.required_integration == 'true' && needs.review.result == 'success' && needs.unit.result == 'success' }}
    runs-on: [pr-ephemeral]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false
      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups
      - name: Run integration regression tier
        env:
          ALETHEIA_DATA_DIR: ${{ runner.temp }}/aletheia-ci-${{ github.run_id }}-${{ github.run_attempt }}-tier_integration
        run: >-
          uv run pytest tests/
          --ignore=tests/simulation
          --ignore=tests/test_auto_resume.py
          --ignore=tests/test_connectivity.py
          --ignore=tests/test_operator_cli.py
          --ignore=tests/test_pause_ownership.py
          -m "tier_integration"
          -q --tb=short
          --timeout=120

  specifications:
    name: Python specifications
    needs: [plan, review, unit, runtime-state-tests]
    # The lane predecessor is ordering only. A Runtime failure is itself useful
    # evidence and must not hide the independent Specifications regression.
    if: ${{ !cancelled() && needs.plan.outputs.required_specifications == 'true' && needs.review.result == 'success' && needs.unit.result == 'success' }}
    runs-on: [pr-ephemeral]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false
      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups
      - name: Run specifications regression tier
        env:
          ALETHEIA_DATA_DIR: ${{ runner.temp }}/aletheia-ci-${{ github.run_id }}-${{ github.run_attempt }}-tier_spec
        run: >-
          uv run pytest tests/
          --ignore=tests/simulation
          --ignore=tests/test_auto_resume.py
          --ignore=tests/test_connectivity.py
          --ignore=tests/test_operator_cli.py
          --ignore=tests/test_pause_ownership.py
          -m "tier_spec"
          -n 2
          --dist loadfile
          -q --tb=short
          --timeout=120

  end-to-end:
    name: Python end-to-end
    needs: [plan, review, unit, integration]
    # Integration orders this lane but does not suppress E2E failure evidence.
    if: ${{ !cancelled() && needs.plan.outputs.required_e2e == 'true' && needs.review.result == 'success' && needs.unit.result == 'success' }}
    runs-on: [pr-ephemeral]
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false
      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups
      - name: Run end-to-end regression tier
        env:
          ALETHEIA_DATA_DIR: ${{ runner.temp }}/aletheia-ci-${{ github.run_id }}-${{ github.run_attempt }}-tier_e2e
        run: >-
          uv run pytest tests/
          --ignore=tests/simulation
          --ignore=tests/test_auto_resume.py
          --ignore=tests/test_connectivity.py
          --ignore=tests/test_operator_cli.py
          --ignore=tests/test_pause_ownership.py
          -m "tier_e2e"
          -n 2
          --dist loadfile
          -q --tb=short
          --timeout=120

  trusted-ci-verdict:
    name: Trusted CI verdict
    needs:
      - plan
      - review
      - unit
      - runtime-state-tests
      - integration
      - specifications
      - end-to-end
      - review-coverage
      - review-node
      - review-native
    if: ${{ always() }}
    runs-on: [pr-ephemeral]
    timeout-minutes: 5
    steps:
      - name: Enforce planned lanes
        env:
          POLICY_VERSION: ${{ needs.plan.outputs.policy_version }}
          PLAN_MODE: ${{ needs.plan.outputs.mode }}
          PLAN_FINGERPRINT: ${{ needs.plan.outputs.plan_fingerprint }}
          PLAN_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          PLAN_HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
          PLAN_RESULT: ${{ needs.plan.result }}
          QUICK_REQUIRED: ${{ needs.plan.outputs.required_quick }}
          QUICK_RESULT: ${{ needs.review.result }}
          UNIT_REQUIRED: ${{ needs.plan.outputs.required_python_unit }}
          UNIT_RESULT: ${{ needs.unit.result }}
          RUNTIME_REQUIRED: ${{ needs.plan.outputs.required_runtime }}
          RUNTIME_RESULT: ${{ needs.runtime-state-tests.result }}
          INTEGRATION_REQUIRED: ${{ needs.plan.outputs.required_integration }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          SPEC_REQUIRED: ${{ needs.plan.outputs.required_specifications }}
          SPEC_RESULT: ${{ needs.specifications.result }}
          E2E_REQUIRED: ${{ needs.plan.outputs.required_e2e }}
          E2E_RESULT: ${{ needs.end-to-end.result }}
          COVERAGE_REQUIRED: ${{ needs.plan.outputs.required_coverage }}
          COVERAGE_RESULT: ${{ needs.review-coverage.result }}
          FRONTEND_REQUIRED: ${{ needs.plan.outputs.required_frontend }}
          OPERATOR_REQUIRED: ${{ needs.plan.outputs.required_operator }}
          NODE_RESULT: ${{ needs.review-node.result }}
          NATIVE_REQUIRED: ${{ needs.plan.outputs.required_native }}
          NATIVE_RESULT: ${{ needs.review-native.result }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "CI planner result: $PLAN_RESULT" >&2
            exit 1
          fi
          require_lane() {
            local name="$1" required="$2" result="$3"
            if [ "$required" = "true" ] && [ "$result" != "success" ]; then
              echo "required lane $name result: $result" >&2
              exit 1
            fi
            if [ "$required" != "true" ]; then
              case "$result" in
                success|skipped) ;;
                *)
                  echo "unplanned lane $name result: $result" >&2
                  exit 1
                  ;;
              esac
            fi
          }
          require_lane quick "$QUICK_REQUIRED" "$QUICK_RESULT"
          require_lane python_unit "$UNIT_REQUIRED" "$UNIT_RESULT"
          require_lane runtime "$RUNTIME_REQUIRED" "$RUNTIME_RESULT"
          require_lane integration "$INTEGRATION_REQUIRED" "$INTEGRATION_RESULT"
          require_lane specifications "$SPEC_REQUIRED" "$SPEC_RESULT"
          require_lane e2e "$E2E_REQUIRED" "$E2E_RESULT"
          require_lane coverage "$COVERAGE_REQUIRED" "$COVERAGE_RESULT"
          if [ "$FRONTEND_REQUIRED" = "true" ] || [ "$OPERATOR_REQUIRED" = "true" ]; then
            require_lane node true "$NODE_RESULT"
          else
            require_lane node false "$NODE_RESULT"
          fi
          require_lane native "$NATIVE_REQUIRED" "$NATIVE_RESULT"
          {
            echo "policy_version=$POLICY_VERSION"
            echo "mode=$PLAN_MODE"
            echo "fingerprint=$PLAN_FINGERPRINT"
            echo "base_sha=$PLAN_BASE_SHA"
            echo "head_sha=$PLAN_HEAD_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

  full-ci-verdict:
    name: Full CI verdict
    needs:
      - plan
      - trusted-ci-verdict
      - review-coverage
      - review-node
      - review-native
    if: ${{ always() && needs.plan.outputs.required_full_ci == 'true' }}
    runs-on: [pr-ephemeral]
    timeout-minutes: 5
    steps:
      - name: Enforce full qualification lanes
        env:
          TRUSTED_RESULT: ${{ needs.trusted-ci-verdict.result }}
          COVERAGE_RESULT: ${{ needs.review-coverage.result }}
          NODE_RESULT: ${{ needs.review-node.result }}
          NATIVE_RESULT: ${{ needs.review-native.result }}
          PLAN_FINGERPRINT: ${{ needs.plan.outputs.plan_fingerprint }}
          PLAN_BASE_SHA: ${{ needs.plan.outputs.base_sha }}
          PLAN_HEAD_SHA: ${{ needs.plan.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          for pair in \
            "trusted:$TRUSTED_RESULT" \
            "coverage:$COVERAGE_RESULT" \
            "node:$NODE_RESULT" \
            "native:$NATIVE_RESULT"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" != "success" ]; then
              echo "required full lane $name result: $result" >&2
              exit 1
            fi
          done
          {
            echo "fingerprint=$PLAN_FINGERPRINT"
            echo "base_sha=$PLAN_BASE_SHA"
            echo "head_sha=$PLAN_HEAD_SHA"
          } >> "$GITHUB_STEP_SUMMARY"

name: Aletheia CI

on:
  pull_request:
    branches: [master]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review checks
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Without an explicit version this resolves "latest" and downloads a
          # fresh uv whenever upstream publishes one: six releases landed on the
          # runners in nine days. Pinned, it hits the runner tool cache instead.
          # Bump deliberately alongside the lockfile.
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Lint Python
        run: uv run ruff check aletheia/ tests/

      - name: Verify architecture and CI invariants
        run: uv run pytest tests/test_architecture_fitness.py tests/test_ci_workflow_contract.py -q --tb=short

      - name: Check documentation governance
        run: uv run python scripts/check_docs.py

      - name: Scan the pull-request commit range for leaked secrets
        shell: bash
        run: |
          set -euo pipefail
          version=8.24.3
          expected=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          install_dir="$RUNNER_TEMP/gitleaks-$version"
          # Restore from the runner's pre-seeded tool cache first. Fetching this
          # archive on every run means every run can fail on a transient egress
          # fault; the network is the fallback here, not the normal path.
          cached="${CI_TOOL_CACHE:-$RUNNER_TEMP/ci-tools}/gitleaks/gitleaks_${version}_linux_x64.tar.gz"
          if [ -r "$cached" ] && cp "$cached" "$archive" &&
             printf '%s  %s\n' "$expected" "$archive" | sha256sum --check --status -; then
            echo "restored gitleaks $version from $cached"
          else
            curl --fail --location --silent --show-error \
              "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz" \
              --output "$archive"
            # Seed the cache so the next run stays offline. Best-effort: a
            # read-only or absent cache directory must not fail the scan.
            if mkdir -p "$(dirname "$cached")" 2>/dev/null; then
              cp "$archive" "$cached.partial" && mv "$cached.partial" "$cached" ||
                rm -f "$cached.partial"
            fi
          fi
          # Authoritative gate for both paths, so a stale or tampered cache
          # entry fails exactly like a bad download would.
          printf '%s  %s\n' "$expected" "$archive" | sha256sum --check -
          mkdir -p "$install_dir"
          tar -xzf "$archive" -C "$install_dir" gitleaks
          "$install_dir/gitleaks" git --redact --log-opts="${{ github.event.pull_request.base.sha || 'HEAD^' }}..HEAD"

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            operator-shell/package-lock.json

      - name: Check dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npx tsc -b --pretty false

      - name: Check Operator Shell
        working-directory: operator-shell
        run: |
          npm ci
          npm test
          npm run build

      # `rustup toolchain install` always syncs the channel manifest, so the
      # step below reaches static.rust-lang.org even when stable is already
      # present: it exits 1 in 30s when egress is refused, and hangs until the
      # job times out when egress is merely unresponsive. This probe needs no
      # network, so an already-provisioned runner stops depending on one.
      - name: Check for a preinstalled Rust toolchain
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          if rustup show active-toolchain 2>/dev/null | grep -q '^stable-'; then
            echo 'preinstalled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'preinstalled=false' >> "$GITHUB_OUTPUT"
          fi

      # Kept as the fallback so a fresh runner still provisions itself.
      - name: Install stable Rust toolchain
        if: steps.rust.outputs.preinstalled != 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Ensure the self-contained Linux target is available
        shell: bash
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-musl
          if ! rustup target list --installed | grep -qx "$target"; then
            rustup target add "$target"
          fi

      - name: Test the platform-neutral native host
        working-directory: native/aletheia-host
        env:
          RUSTFLAGS: -C linker=rust-lld
        run: cargo test --locked --all-targets --target x86_64-unknown-linux-musl

  tests:
    name: Python regression
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 25

    steps:
      - name: Isolate Aletheia runtime state
        run: echo "ALETHEIA_DATA_DIR=$RUNNER_TEMP/aletheia-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-tests" >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          # Without an explicit version this resolves "latest" and downloads a
          # fresh uv whenever upstream publishes one: six releases landed on the
          # runners in nine days. Pinned, it hits the runner tool cache instead.
          # Bump deliberately alongside the lockfile.
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Ensure archive extraction tool is available
        shell: bash
        run: |
          set -euo pipefail
          if command -v unzip >/dev/null 2>&1; then
            exit 0
          fi
          install_dir="$RUNNER_TEMP/ci-bin"
          mkdir -p "$install_dir"
          cat > "$install_dir/unzip" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${1:-}" = "-q" ]; then
            shift
          fi
          if [ "$#" -ne 3 ] || [ "$2" != "-d" ]; then
            echo "usage: unzip [-q] ARCHIVE -d DESTINATION" >&2
            exit 2
          fi
          exec uv run python -m zipfile -e "$1" "$3"
          SH
          chmod +x "$install_dir/unzip"
          echo "$install_dir" >> "$GITHUB_PATH"

      - name: Run isolated review regression tiers
        shell: bash
        run: |
          set -euo pipefail
          for tier in tier_spec tier_unit tier_integration tier_e2e; do
            ALETHEIA_DATA_DIR="$RUNNER_TEMP/aletheia-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${tier}" \
              uv run pytest tests/ \
                --ignore=tests/simulation \
                --ignore=tests/test_auto_resume.py \
                --ignore=tests/test_operator_cli.py \
                --ignore=tests/test_pause_ownership.py \
                -m "$tier" \
                -n auto \
                --dist loadfile \
                -q --tb=short \
                --timeout=120
          done
          ALETHEIA_DATA_DIR="$RUNNER_TEMP/aletheia-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-runtime-state" \
            uv run pytest tests/test_auto_resume.py tests/test_operator_cli.py \
              -n 2 --dist loadfile -q --tb=short --timeout=120
          ALETHEIA_DATA_DIR="$RUNNER_TEMP/aletheia-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-pause-ownership" \
            uv run pytest tests/test_pause_ownership.py \
              -n 1 -q --tb=short --timeout=120

  release-candidate:
    name: Hand off verified release candidate
    needs: [review, tests]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      startsWith(github.ref_name, 'release-please--branches--master')
    permissions:
      contents: write
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    steps:
      - name: Dispatch verified candidate
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            await github.rest.repos.createDispatchEvent({
              ...context.repo,
              event_type: 'release_candidate_verified',
              client_payload: {
                head_branch: context.ref.replace('refs/heads/', ''),
                head_sha: context.sha,
              },
            });

name: Aletheia CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run the full Python regression audit
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python safety and contract gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Prepare test report directory
        run: mkdir -p test-results

      - name: Verify architecture and safety defaults
        run: uv run pytest tests/test_architecture_fitness.py -q --junitxml=test-results/architecture.xml

      - name: Verify executable contracts
        run: uv run pytest tests/specs/ -q --junitxml=test-results/specs.xml

      - name: Run full regression audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_regression }}
        run: uv run pytest tests/ -q --tb=line --junitxml=test-results/full.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Dashboard build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dashboard dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check and build dashboard
        working-directory: frontend
        run: npm run build

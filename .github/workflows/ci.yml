name: Aletheia CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      full_regression:
        description: Run the full Python regression audit
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Python safety and contract gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        # Agent workflow validation verifies task base/evidence commits; a
        # depth-1 PR checkout cannot contain those reachable history objects.
        with:
          fetch-depth: 0

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Prepare test report directory
        run: mkdir -p test-results

      - name: Lint Python
        run: uv run ruff check aletheia/ tests/

      - name: Verify architecture and safety defaults
        run: uv run pytest tests/test_architecture_fitness.py -q --junitxml=test-results/architecture.xml

      - name: Verify executable contracts
        run: uv run pytest tests/specs/ -q --junitxml=test-results/specs.xml

      - name: Verify deterministic control loop
        env:
          DCLS_MAX_EXAMPLES: 8
          DCLS_STATEFUL_STEPS: 8
          DCLS_SEED: 20260713
        run: >-
          uv run pytest
          tests/simulation/control_loop/test_confidence_deadlock.py
          tests/simulation/control_loop/test_sizing_ratchet.py
          tests/simulation/control_loop/test_stateful_control_loop.py
          tests/simulation/control_loop/test_mutation_canaries.py
          tests/simulation/control_loop/test_failure_artifacts.py
          tests/test_runtime_replay_pack.py
          tests/e2e/test_active_mainline_golden_path.py
          -q --tb=short --junitxml=test-results/dcls.xml

      - name: Verify agent workflow behavior
        run: uv run pytest tests/test_agent_workflow.py -q --junitxml=test-results/agent-workflow.xml

      - name: Verify agent workflow integrity
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$CHANGE_BASE" ] && git cat-file -e "${CHANGE_BASE}^{commit}" 2>/dev/null; then
            uv run aletheia agent workflow check --strict --changed-since "$CHANGE_BASE"
          else
            uv run aletheia agent workflow check --strict
          fi

      - name: Run full regression audit
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_regression }}
        run: uv run pytest tests/ -q --tb=line --junitxml=test-results/full.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  fast-tests:
    name: Fast regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Prepare test report directory
        run: mkdir -p test-results

      - name: Run fast regression tests
        run: uv run pytest -m fast -q --tb=short --junitxml=test-results/fast.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  integration-tests:
    name: Integration test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Prepare test report directory
        run: mkdir -p test-results

      - name: Run integration tests
        run: uv run pytest -m integration -q --tb=short --junitxml=test-results/integration.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Dashboard build
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dashboard dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint dashboard
        working-directory: frontend
        run: npm run lint

      - name: Type-check and build dashboard
        working-directory: frontend
        run: npm run build

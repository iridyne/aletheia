name: Nightly stability

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stability:
    name: Paper loop stability drive
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Run stability drive (20 cycles)
        run: uv run python scripts/stability_drive.py 20

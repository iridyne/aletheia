name: Build Dogfood Release Bundle

on:
  pull_request:
    branches: [master]
    paths:
      - "aletheia/**"
      - "frontend/**"
      - "scripts/release/**"
      - "scripts/runtime/**"
      - "tests/test_release_bundle.py"
      - "tests/test_release_data_dir.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-dogfood-release.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to package
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: dogfood-bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-home-contract:
    name: Runtime home
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Verify per-user runtime-home contract
        run: uv run pytest tests/test_release_data_dir.py tests/test_runtime_home_migration.py tests/test_dev_preview.py -q --tb=short

  build-bundle:
    name: Portable modular-monolith bundle
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 25
    outputs:
      artifact_name: ${{ steps.source.outputs.artifact_name }}
      archive_name: ${{ steps.source.outputs.archive_name }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Resolve checked-out source SHA
        id: source
        run: |
          sha=$(git rev-parse HEAD)
          short_sha="${sha:0:12}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"
          echo "artifact_name=aletheia-dogfood-$short_sha" >> "$GITHUB_OUTPUT"
          echo "archive_name=aletheia-dogfood-$short_sha.zip" >> "$GITHUB_OUTPUT"

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked development dependencies
        run: uv sync --locked --all-groups

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dashboard dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint dashboard
        working-directory: frontend
        run: npm run lint

      - name: Build dashboard into Python static package
        working-directory: frontend
        run: npm run build

      - name: Verify release data and bundle contracts
        run: uv run pytest tests/test_release_data_dir.py tests/test_release_bundle.py -q --tb=short

      - name: Build deterministic release ZIP
        run: >-
          uv run python scripts/release/build_bundle.py
          --output-dir dist
          --git-sha "${{ steps.source.outputs.sha }}"
          --warn-mib 60
          --max-mib 100

      - name: Prepare standalone macOS installer
        run: cp scripts/runtime/install-release.sh dist/install-release.sh

      - name: Verify bundle from a clean Linux directory
        run: |
          set -euo pipefail
          archive="$(pwd)/dist/${{ steps.source.outputs.archive_name }}"
          test -f "$archive" || (echo "Dogfood bundle was not produced." && exit 1)
          extract_root="$RUNNER_TEMP/aletheia-release-clean"
          user_root="$RUNNER_TEMP/aletheia-release-user"
          default_data_root="$user_root/.aletheia"
          override_data_root="$RUNNER_TEMP/aletheia-release-override"
          rm -rf "$extract_root" "$user_root" "$override_data_root"
          mkdir -p "$extract_root" "$user_root" "$override_data_root"
          unzip -q "$archive" -d "$extract_root"
          unset ALETHEIA_DATA_DIR || true
          export HOME="$user_root"
          (
            cd "$extract_root"
            uv sync --locked --no-dev
            uv run --no-sync python -c "
          from aletheia.config.loader import bootstrap, get_data_dir
          bootstrap()
          actual = str(get_data_dir())
          assert actual == '$default_data_root', f'Expected $default_data_root but got {actual}'
          print(actual)
          "
            ALETHEIA_DATA_DIR="$override_data_root" uv run --no-sync python -c "
          from aletheia.config.loader import bootstrap, get_data_dir
          bootstrap()
          actual = str(get_data_dir())
          assert actual == '$override_data_root', f'Expected $override_data_root but got {actual}'
          print(actual)
          "
            uv run --no-sync aletheia version
          )

      - name: Publish bundle size summary
        if: always()
        run: |
          if [ -f dist/bundle-size.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          d = json.loads(pathlib.Path("dist/bundle-size.json").read_text())
          print("### Portable dogfood release bundle")
          print(f"- Archive: `{d['archive']}`")
          print(f"- Target: `{d['target']}`")
          print(f"- Compressed: **{d['compressed_size_mib']} MiB**")
          print(f"- Uncompressed: {d['uncompressed_size_mib']} MiB")
          print(f"- Files: {d['file_count']}")
          print(f"- Soft / hard limits: {d['warn_mib']} / {d['max_mib']} MiB")
          PY
          fi

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: |
            dist/aletheia-dogfood-*.zip
            dist/aletheia-dogfood-*.zip.sha256
            dist/bundle-size.json
            dist/install-release.sh
          if-no-files-found: error
          compression-level: 0
          retention-days: 14


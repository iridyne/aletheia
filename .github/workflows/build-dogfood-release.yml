name: Build Dogfood Release Bundle

on:
  pull_request:
    branches: [master]
    paths:
      - "aletheia/**"
      - "frontend/**"
      - "scripts/release/**"
      - "scripts/runtime/**"
      - "tests/test_release_bundle.py"
      - "tests/test_release_data_dir.py"
      - "tests/test_macos_release_runtime.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/build-dogfood-release.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to package
        required: true
        default: master
        type: string

permissions:
  contents: read

concurrency:
  group: dogfood-bundle-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-home-contract:
    name: Runtime home (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, runner: '["ubuntu-latest"]' }
          - { os: macos-latest,  runner: '["macos-latest"]' }
          - { os: windows,       runner: '["self-hosted","Windows","X64"]' }
    runs-on: ${{ fromJSON(matrix.runner) }}
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Verify per-user runtime-home contract
        run: uv run pytest tests/test_release_data_dir.py tests/test_runtime_home_migration.py tests/test_dev_preview.py -q --tb=short

  build-bundle:
    name: Portable modular-monolith bundle
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    outputs:
      artifact_name: ${{ steps.source.outputs.artifact_name }}
      archive_name: ${{ steps.source.outputs.archive_name }}

    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}
          fetch-depth: 0

      - name: Resolve checked-out source SHA
        id: source
        shell: pwsh
        run: |
          $sha = (git rev-parse HEAD).Trim()
          $shortSha = $sha.Substring(0, 12)
          "sha=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "short_sha=$shortSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "artifact_name=aletheia-dogfood-$shortSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "archive_name=aletheia-dogfood-$shortSha.zip" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked development dependencies
        run: uv sync --locked --all-groups

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dashboard dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint dashboard
        working-directory: frontend
        run: npm run lint

      - name: Build dashboard into Python static package
        working-directory: frontend
        run: npm run build

      - name: Verify release data and bundle contracts
        run: uv run pytest tests/test_release_data_dir.py tests/test_release_bundle.py tests/test_macos_release_runtime.py -q --tb=short

      - name: Build deterministic release ZIP
        shell: pwsh
        run: >-
          uv run python scripts/release/build_bundle.py
          --output-dir dist
          --git-sha "${{ steps.source.outputs.sha }}"
          --warn-mib 60
          --max-mib 100

      - name: Prepare standalone macOS installer
        shell: pwsh
        run: Copy-Item scripts/runtime/install-release.sh dist/install-release.sh

      - name: Verify bundle from a clean Windows directory
        shell: pwsh
        run: |
          $archive = Join-Path (Resolve-Path dist) "${{ steps.source.outputs.archive_name }}"
          if (-not (Test-Path $archive)) { throw "Dogfood bundle was not produced." }
          $extractRoot = Join-Path $env:RUNNER_TEMP "aletheia-release-clean"
          $userRoot = Join-Path $env:RUNNER_TEMP "aletheia-release-user"
          $defaultDataRoot = Join-Path $userRoot ".aletheia"
          $overrideDataRoot = Join-Path $env:RUNNER_TEMP "aletheia-release-override"
          Remove-Item -Recurse -Force $extractRoot -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $userRoot -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force $overrideDataRoot -ErrorAction SilentlyContinue
          Expand-Archive -LiteralPath $archive -DestinationPath $extractRoot
          New-Item -ItemType Directory -Force -Path $userRoot | Out-Null
          New-Item -ItemType Directory -Force -Path $overrideDataRoot | Out-Null
          $env:HOME = $userRoot
          $env:USERPROFILE = $userRoot
          Remove-Item Env:ALETHEIA_DATA_DIR -ErrorAction SilentlyContinue
          Push-Location $extractRoot
          try {
            uv sync --locked --no-dev
            uv run --no-sync python -c "from aletheia.config.loader import bootstrap, get_data_dir; bootstrap(); assert str(get_data_dir()) == r'$defaultDataRoot'; print(get_data_dir())"
            $env:ALETHEIA_DATA_DIR = $overrideDataRoot
            uv run --no-sync python -c "from aletheia.config.loader import bootstrap, get_data_dir; bootstrap(); assert str(get_data_dir()) == r'$overrideDataRoot'; print(get_data_dir())"
            uv run --no-sync aletheia version
          }
          finally {
            Pop-Location
          }

      - name: Publish bundle size summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path dist/bundle-size.json) {
            $summary = Get-Content dist/bundle-size.json | ConvertFrom-Json
            "### Portable dogfood release bundle" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "- Archive: ``$($summary.archive)``" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "- Target: ``$($summary.target)``" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "- Compressed: **$($summary.compressed_size_mib) MiB**" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "- Uncompressed: $($summary.uncompressed_size_mib) MiB" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "- Files: $($summary.file_count)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
            "- Soft / hard limits: $($summary.warn_mib) / $($summary.max_mib) MiB" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Upload immutable release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.source.outputs.artifact_name }}
          path: |
            dist/aletheia-dogfood-*.zip
            dist/aletheia-dogfood-*.zip.sha256
            dist/bundle-size.json
            dist/install-release.sh
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  macos-release-runtime:
    name: macOS clean stable runtime
    needs: build-bundle
    runs-on: macos-latest
    timeout-minutes: 25

    steps:
      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Download exact portable artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-bundle.outputs.artifact_name }}
          path: ${{ runner.temp }}/aletheia-artifact

      - name: Install, start, probe and stop isolated macOS release
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="$RUNNER_TEMP/aletheia-artifact"
          archive="$artifact_root/${{ needs.build-bundle.outputs.archive_name }}"
          checksum="${archive}.sha256"
          user_root="$RUNNER_TEMP/aletheia-macos-user"
          app_root="$RUNNER_TEMP/Aletheia"
          releases_root="$app_root/releases"
          current="$app_root/current"
          plist="$user_root/Library/LaunchAgents/com.aletheia.trading-os.gateway.plist"

          rm -rf "$user_root" "$app_root"
          mkdir -p "$user_root"
          export HOME="$user_root"
          export USERPROFILE="$user_root"
          unset ALETHEIA_DATA_DIR || true

          bash "$artifact_root/install-release.sh" \
            --archive "$archive" \
            --checksum "$checksum" \
            --releases-root "$releases_root"

          test -L "$current"
          test -f "$current/release-manifest.json"
          test ! -d "$current/.git"
          test ! -e "$current/app.db"

          cleanup() {
            if [[ -L "$current" ]]; then
              (
                cd "$current"
                uv run --no-sync aletheia gateway stop || true
              )
            fi
          }
          trap cleanup EXIT

          (
            cd "$current"
            uv run --no-sync python - <<'PY'
          from pathlib import Path
          from aletheia.config.loader import bootstrap, get_data_dir, save_config

          cfg = bootstrap()
          cfg.runtime.autostart_on_start = False
          save_config(cfg)
          assert get_data_dir() == (Path.home() / ".aletheia").resolve()
          PY
          )

          bash "$current/scripts/runtime/start-release.sh" \
            --release-root "$current" \
            --skip-sync
          bash "$current/scripts/runtime/health-check.sh" --timeout-seconds 60

          (
            cd "$current"
            uv run --no-sync aletheia gateway status
            uv run --no-sync aletheia gateway stop
          )
          trap - EXIT

          test ! -e "$plist"
          test -f "$user_root/.aletheia/config.yaml"
          test ! -e "$current/data"

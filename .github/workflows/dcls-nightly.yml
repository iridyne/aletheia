name: DCLS Nightly

on:
  schedule:
    - cron: '0 19 * * *'  # 03:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  simulation:
    name: Control-loop simulation
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 30
    env:
      DCLS_MAX_EXAMPLES: 100
      DCLS_STATEFUL_STEPS: 30
      DCLS_SEED: 20260713
      ALETHEIA_DASHBOARD_AUTH_SECRET_PATH: /tmp/dashboard_auth_secret

    steps:
      - name: Isolate Aletheia runtime state
        run: echo "ALETHEIA_DATA_DIR=$RUNNER_TEMP/aletheia-dcls-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Run control-loop simulation suite
        run: uv run pytest tests/simulation/control_loop/ tests/simulation/ -q --tb=short

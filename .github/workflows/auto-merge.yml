name: Queue pull requests for auto-merge

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, ready_for_review, edited, synchronize, labeled, unlabeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: Enable auto-merge
    if: >-
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-auto-merge')
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    env:
      PR_NODE_ID: ${{ github.event.pull_request.node_id }}
    steps:
      - name: Queue pull request
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            await github.graphql(
              `mutation($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {pullRequestId: $pullRequestId, mergeMethod: MERGE}) {
                  pullRequest { number }
                }
              }`,
              { pullRequestId: process.env.PR_NODE_ID },
            );

  disable:
    name: Disable auto-merge
    if: contains(github.event.pull_request.labels.*.name, 'do-not-auto-merge')
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    env:
      PR_NODE_ID: ${{ github.event.pull_request.node_id }}
    steps:
      - name: Remove pull request from auto-merge
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            await github.graphql(
              `mutation($pullRequestId: ID!) {
                disablePullRequestAutoMerge(input: {pullRequestId: $pullRequestId}) {
                  pullRequest { number }
                }
              }`,
              { pullRequestId: process.env.PR_NODE_ID },
            );

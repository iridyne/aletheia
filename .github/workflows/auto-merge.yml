name: Queue pull requests for auto-merge

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, ready_for_review, edited, synchronize, labeled, unlabeled, closed]
  repository_dispatch:
    types: [auto_merge_update, release_candidate_verified]

permissions:
  contents: read

jobs:
  # A pull_request_target run still reports a check on the PR head. Keep that
  # run dispatch-only so its own in-progress check cannot make the mutation
  # fail with "Pull request is in unstable status".
  schedule:
    name: Schedule auto-merge update
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action != 'closed' &&
      github.event.pull_request.draft == false
    permissions:
      contents: write
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    env:
      OPERATION: ${{ contains(github.event.pull_request.labels.*.name, 'do-not-auto-merge') && 'disable' || 'enable' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Dispatch trusted auto-merge update
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            const operation = process.env.OPERATION;
            const pullRequestNumber = Number.parseInt(process.env.PR_NUMBER, 10);
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA;
            if (!['enable', 'disable'].includes(operation)) {
              throw new Error(`unsupported auto-merge operation: ${operation}`);
            }
            if (!Number.isInteger(pullRequestNumber) || pullRequestNumber <= 0) {
              throw new Error('pull request number must be a positive integer');
            }
            if (!/^[0-9a-f]{40}$/.test(expectedHeadSha)) {
              throw new Error('expected head SHA must be a 40-character lowercase Git object ID');
            }
            await github.rest.repos.createDispatchEvent({
              ...context.repo,
              event_type: 'auto_merge_update',
              client_payload: {
                operation,
                pull_request_number: pullRequestNumber,
                expected_head_sha: expectedHeadSha,
              },
            });

  release-candidate:
    name: Approve a verified release candidate
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'release_candidate_verified' &&
      startsWith(github.event.client_payload.head_branch, 'release-please--branches--master')
    permissions:
      contents: write
      issues: write
      pull-requests: read
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    steps:
      - name: Release the verified candidate hold
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            const run = context.payload.client_payload;
            const {data: pullRequests} = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              base: 'master',
              head: `${context.repo.owner}:${run.head_branch}`,
            });
            const candidates = pullRequests.filter((pullRequest) =>
              pullRequest.head.repo?.full_name === context.repo.owner + '/' + context.repo.repo &&
              pullRequest.head.sha === run.head_sha &&
              pullRequest.labels.some(({name}) => name === 'autorelease: pending') &&
              pullRequest.labels.some(({name}) => name === 'do-not-auto-merge'),
            );
            if (candidates.length === 0) {
              core.info('no held release candidate matches the successful CI run');
              return;
            }
            if (candidates.length !== 1) {
              throw new Error(`expected one release candidate, found ${candidates.length}`);
            }
            const [pullRequest] = candidates;
            await github.rest.issues.removeLabel({
              ...context.repo,
              issue_number: pullRequest.number,
              name: 'do-not-auto-merge',
            });
            await github.rest.repos.createDispatchEvent({
              ...context.repo,
              event_type: 'auto_merge_update',
              client_payload: {
                operation: 'enable',
                pull_request_number: pullRequest.number,
                expected_head_sha: run.head_sha,
              },
            });

  update:
    name: Apply auto-merge update
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.action == 'auto_merge_update'
    permissions:
      contents: write
      pull-requests: write
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 15
    env:
      OPERATION: ${{ github.event.client_payload.operation }}
      PR_NUMBER: ${{ github.event.client_payload.pull_request_number }}
      EXPECTED_HEAD_SHA: ${{ github.event.client_payload.expected_head_sha }}
    steps:
      - name: Apply pull request auto-merge state
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            const operation = process.env.OPERATION;
            const pullRequestNumber = Number.parseInt(process.env.PR_NUMBER, 10);
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA;
            if (!['enable', 'disable'].includes(operation)) {
              throw new Error(`unsupported auto-merge operation: ${operation}`);
            }
            if (!Number.isInteger(pullRequestNumber) || pullRequestNumber <= 0) {
              throw new Error('pull request number must be a positive integer');
            }
            if (!/^[0-9a-f]{40}$/.test(expectedHeadSha)) {
              throw new Error('expected head SHA must be a 40-character lowercase Git object ID');
            }

            const pullRequestQuery = `query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  id
                  number
                  state
                  isDraft
                  headRefOid
                  mergeCommit { oid }
                  mergeStateStatus
                  autoMergeRequest { enabledAt }
                }
              }
            }`;
            const fetchPullRequest = async () => {
              const result = await github.graphql(pullRequestQuery, {
                ...context.repo,
                number: pullRequestNumber,
              });
              return result.repository.pullRequest;
            };
            const dispatchRelease = async (mergeCommitSha) => {
              if (!/^[0-9a-f]{40}$/.test(mergeCommitSha || '')) {
                throw new Error('merged pull request did not expose a 40-character merge commit SHA');
              }
              await github.rest.repos.createDispatchEvent({
                ...context.repo,
                event_type: 'release_please',
                client_payload: {
                  merged_pull_request: pullRequestNumber,
                  merge_commit_sha: mergeCommitSha,
                },
              });
            };

            if (operation === 'disable') {
              const pullRequest = await fetchPullRequest();
              if (!pullRequest || pullRequest.state !== 'OPEN') {
                core.info('pull request is no longer open; no auto-merge update needed');
                return;
              }
              if (!pullRequest.autoMergeRequest) {
                core.info('auto-merge is already disabled');
                return;
              }
              await github.graphql(
                `mutation($pullRequestId: ID!) {
                  disablePullRequestAutoMerge(input: {pullRequestId: $pullRequestId}) {
                    pullRequest { number }
                  }
                }`,
                { pullRequestId: pullRequest.id },
              );
              return;
            }

            const autoMergeStates = new Set(['BEHIND', 'BLOCKED', 'HAS_HOOKS']);
            const maxAttempts = 150;
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const pullRequest = await fetchPullRequest();
              if (!pullRequest) {
                core.info('pull request is no longer open; no auto-merge update needed');
                return;
              }
              if (pullRequest.state === 'MERGED') {
                if (pullRequest.headRefOid !== expectedHeadSha) {
                  core.info('merged pull request head differs from the authorized head; no release dispatch');
                  return;
                }
                core.info('pull request was merged externally; the closed event owns release dispatch');
                return;
              }
              if (pullRequest.state !== 'OPEN') {
                core.info('pull request is no longer open; no auto-merge update needed');
                return;
              }
              if (pullRequest.isDraft) {
                core.info('pull request returned to Draft; auto-merge remains disabled');
                return;
              }
              if (pullRequest.headRefOid !== expectedHeadSha) {
                core.info(
                  `pull request head changed from ${expectedHeadSha} to ${pullRequest.headRefOid}; ` +
                  'a newer pull request event must authorize the merge',
                );
                return;
              }
              if (pullRequest.autoMergeRequest) {
                if (attempt === maxAttempts) {
                  throw new Error(`auto-merge did not complete after ${maxAttempts} checks`);
                }
                core.info('auto-merge is enabled; waiting for the merged commit');
                await new Promise((resolve) => setTimeout(resolve, 5000));
                continue;
              }
              if (['UNKNOWN', 'UNSTABLE'].includes(pullRequest.mergeStateStatus)) {
                if (attempt === maxAttempts) {
                  throw new Error(
                    `pull request remained ${pullRequest.mergeStateStatus} after ${maxAttempts} checks`,
                  );
                }
                core.info(
                  `waiting for pull request status ${pullRequest.mergeStateStatus} ` +
                  `(attempt ${attempt}/${maxAttempts})`,
                );
                await new Promise((resolve) => setTimeout(resolve, 5000));
                continue;
              }
              if (pullRequest.mergeStateStatus === 'CLEAN') {
                const mergeResult = await github.rest.pulls.merge({
                  ...context.repo,
                  pull_number: pullRequestNumber,
                  merge_method: 'squash',
                  sha: expectedHeadSha,
                });
                if (!mergeResult.data.merged) {
                  throw new Error(
                    `GitHub declined protected merge: ${mergeResult.data.message || 'unknown reason'}`,
                  );
                }
                await dispatchRelease(mergeResult.data.sha);
                return;
              }
              if (!autoMergeStates.has(pullRequest.mergeStateStatus)) {
                throw new Error(
                  `pull request cannot enter auto-merge from ${pullRequest.mergeStateStatus}`,
                );
              }
              try {
                await github.graphql(
                  `mutation($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(input: {
                      pullRequestId: $pullRequestId,
                      mergeMethod: SQUASH
                    }) {
                      pullRequest { number }
                    }
                  }`,
                  { pullRequestId: pullRequest.id },
                );
                core.info('auto-merge enabled; waiting for the merged commit');
                await new Promise((resolve) => setTimeout(resolve, 5000));
                continue;
              } catch (error) {
                if (
                  attempt < maxAttempts &&
                  (
                    String(error).includes('unstable status') ||
                    String(error).includes('clean status')
                  )
                ) {
                  await new Promise((resolve) => setTimeout(resolve, 5000));
                  continue;
                }
                throw error;
              }
            }

  release:
    name: Dispatch release management after merge
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true
    permissions:
      contents: write
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    steps:
      - name: Dispatch Release Please
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            await github.rest.repos.createDispatchEvent({
              ...context.repo,
              event_type: 'release_please',
              client_payload: {
                merged_pull_request: context.payload.pull_request.number,
                merge_commit_sha: context.payload.pull_request.merge_commit_sha,
              },
            });

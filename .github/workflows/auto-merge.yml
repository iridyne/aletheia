name: Queue pull requests for auto-merge

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, ready_for_review, edited, synchronize, labeled, unlabeled, closed]
  pull_request_review:
    branches: [master]
    types: [submitted, dismissed]
  issue_comment:
    types: [created, edited]
  workflow_run:
    workflows: [Aletheia CI]
    types: [completed]
  repository_dispatch:
    types: [auto_merge_update, release_candidate_verified]

permissions:
  contents: read

jobs:
  # A pull_request_target run still reports a check on the PR head. Keep that
  # run dispatch-only so its own in-progress check cannot make the mutation
  # fail with "Pull request is in unstable status".
  schedule:
    name: Schedule auto-merge update
    if: >-
      (
        github.event_name == 'pull_request_target' &&
        github.event.action != 'closed'
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        (
          github.event.action == 'dismissed' ||
          github.event.review.user.login == 'chatgpt-codex-connector' ||
          github.event.review.user.login == 'chatgpt-codex-connector[bot]'
        )
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (
          startsWith(github.event.comment.body, '/codex-triage ') ||
          github.event.comment.user.login == 'chatgpt-codex-connector' ||
          github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
        )
      ) ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.conclusion == 'success'
      )
    permissions:
      contents: write
      pull-requests: read
    # Metadata-only control plane; do not contend with scarce self-hosted test runners.
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch trusted auto-merge update
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            const connectorLogin = 'chatgpt-codex-connector';
            const normalizeLogin = (login) => String(login || '').replace(/\[bot\]$/, '');
            const isConnectorLogin = (login) => normalizeLogin(login) === connectorLogin;
            const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
            const triagePattern = /^\/codex-triage ([0-9a-f]{40}) (clean|complete)$/;
            const reviewedCommitPattern = /Reviewed commit:[^`]*`([0-9a-f]{7,40})`/i;
            const resolveReviewedCommitSha = async (body) => {
              const match = String(body || '').match(reviewedCommitPattern);
              if (!match) return null;
              try {
                const {data: commit} = await github.rest.repos.getCommit({
                  ...context.repo,
                  ref: match[1],
                });
                return commit.sha;
              } catch (error) {
                core.info(`could not resolve Connector reviewed commit ${match[1]}: ${error}`);
                return null;
              }
            };
            const eventName = context.eventName;
            const payload = context.payload;
            let pullRequestNumbers = [];

            if (eventName === 'pull_request_target') {
              pullRequestNumbers = [payload.pull_request.number];
            } else if (eventName === 'pull_request_review') {
              if (payload.action !== 'dismissed' && !isConnectorLogin(payload.review.user?.login)) return;
              pullRequestNumbers = [payload.pull_request.number];
            } else if (eventName === 'issue_comment') {
              if (isConnectorLogin(payload.comment.user?.login)) {
                pullRequestNumbers = [payload.issue.number];
              } else {
                if (!trustedAssociations.has(payload.comment.author_association)) {
                  core.info('ignoring Codex triage acknowledgement from an untrusted author');
                  return;
                }
                const {data: commenterPermission} = await github.rest.repos.getCollaboratorPermissionLevel({
                  ...context.repo,
                  username: payload.comment.user?.login,
                });
                if (!new Set(['admin', 'maintain', 'write']).has(commenterPermission.permission)) {
                  core.info('ignoring Codex triage acknowledgement without write permission');
                  return;
                }
                const [command] = String(payload.comment.body || '').replace(/\r/g, '').split('\n');
                if (!triagePattern.test(command.trim())) return;
                pullRequestNumbers = [payload.issue.number];
              }
            } else if (eventName === 'workflow_run') {
              pullRequestNumbers = payload.workflow_run.pull_requests.map(({number}) => number);
            }

            for (const pullRequestNumber of [...new Set(pullRequestNumbers)]) {
              const {data: pullRequest} = await github.rest.pulls.get({
                ...context.repo,
                pull_number: pullRequestNumber,
              });
              if (
                pullRequest.state !== 'open' ||
                pullRequest.base.ref !== 'master' ||
                pullRequest.draft ||
                pullRequest.head.ref.startsWith('release-please--branches--master')
              ) {
                continue;
              }
              if (
                eventName === 'pull_request_review' &&
                payload.review.commit_id !== pullRequest.head.sha
              ) {
                core.info('ignoring Connector review for a superseded head');
                continue;
              }
              if (
                eventName === 'workflow_run' &&
                payload.workflow_run.head_sha !== pullRequest.head.sha
              ) {
                core.info('ignoring CI completion for a superseded head');
                continue;
              }
              if (eventName === 'issue_comment') {
                if (isConnectorLogin(payload.comment.user?.login)) {
                  const reviewedCommitSha = await resolveReviewedCommitSha(payload.comment.body);
                  if (reviewedCommitSha !== pullRequest.head.sha) {
                    core.info('ignoring Connector completion for a superseded or unbound head');
                    continue;
                  }
                } else {
                  const [command] = String(payload.comment.body || '').replace(/\r/g, '').split('\n');
                  const acknowledgement = command.trim().match(triagePattern);
                  if (!acknowledgement || acknowledgement[1] !== pullRequest.head.sha) {
                    core.info('ignoring Codex triage acknowledgement for a superseded head');
                    continue;
                  }
                }
              }
              const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${pullRequest.base.sha}...${pullRequest.head.sha}`,
              });
              const expectedBaseSha = comparison.merge_base_commit.sha;
              if (!/^[0-9a-f]{40}$/.test(expectedBaseSha || '')) {
                throw new Error('pull request merge-base SHA is unavailable');
              }
              const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: pullRequest.number,
                per_page: 100,
              });
              const changedFilesComplete = changedFiles.length === pullRequest.changed_files;
              if (!changedFilesComplete) {
                core.info(
                  `changed-file listing is incomplete (${changedFiles.length}/${pullRequest.changed_files}); ` +
                  'auto-merge remains disabled',
                );
              }
              const changesMergeAuthority = changedFilesComplete && changedFiles.some(
                ({filename, previous_filename}) =>
                  [filename, previous_filename].includes('.github/workflows/auto-merge.yml') ||
                  [filename, previous_filename].includes('.github/workflows/codex-shepherd.yml'),
              );
              const operation = (
                !changedFilesComplete ||
                changesMergeAuthority ||
                pullRequest.labels.some(({name}) => name === 'do-not-auto-merge')
              ) ? 'disable' : 'enable';
              await github.rest.repos.createDispatchEvent({
                ...context.repo,
                event_type: 'auto_merge_update',
                client_payload: {
                  operation,
                  pull_request_number: pullRequest.number,
                  expected_head_sha: pullRequest.head.sha,
                  expected_base_sha: expectedBaseSha,
                },
              });
            }

  release-candidate:
    name: Approve a verified release candidate
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.sender.login == 'github-actions[bot]' &&
      github.event.action == 'release_candidate_verified' &&
      startsWith(github.event.client_payload.head_branch, 'release-please--branches--master')
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    # Metadata-only control plane; do not contend with scarce self-hosted test runners.
    runs-on: ubuntu-24.04
    steps:
      - name: Release the verified candidate hold
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            const run = context.payload.client_payload;
            const {data: pullRequests} = await github.rest.pulls.list({
              ...context.repo,
              state: 'open',
              base: 'master',
              head: `${context.repo.owner}:${run.head_branch}`,
            });
            const candidates = pullRequests.filter((pullRequest) =>
              pullRequest.head.repo?.full_name === context.repo.owner + '/' + context.repo.repo &&
              pullRequest.head.sha === run.head_sha &&
              pullRequest.labels.some(({name}) => name === 'autorelease: pending') &&
              pullRequest.labels.some(({name}) => name === 'do-not-auto-merge'),
            );
            if (candidates.length === 0) {
              core.info('no held release candidate matches the successful CI run');
              return;
            }
            if (candidates.length !== 1) {
              throw new Error(`expected one release candidate, found ${candidates.length}`);
            }
            const [pullRequestSummary] = candidates;
            const {data: pullRequest} = await github.rest.pulls.get({
              ...context.repo,
              pull_number: pullRequestSummary.number,
            });
            if (
              pullRequest.state !== 'open' ||
              pullRequest.base.ref !== 'master' ||
              pullRequest.head.repo?.full_name !== context.repo.owner + '/' + context.repo.repo ||
              pullRequest.head.ref !== run.head_branch ||
              pullRequest.head.sha !== run.head_sha ||
              !pullRequest.labels.some(({name}) => name === 'autorelease: pending') ||
              !pullRequest.labels.some(({name}) => name === 'do-not-auto-merge')
            ) {
              core.info('release candidate changed after discovery; owner hold remains');
              return;
            }
            const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo,
              basehead: `${pullRequest.base.sha}...${pullRequest.head.sha}`,
            });
            const expectedBaseSha = comparison.merge_base_commit.sha;
            if (!/^[0-9a-f]{40}$/.test(expectedBaseSha || '')) {
              throw new Error('release candidate base SHA is unavailable');
            }
            if (pullRequest.base.sha !== expectedBaseSha) {
              core.info('release candidate is behind master; rerun the manual release workflow');
              return;
            }
            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: pullRequest.number,
              per_page: 100,
            });
            if (changedFiles.length !== pullRequest.changed_files) {
              core.info(
                `release candidate changed-file listing is incomplete ` +
                `(${changedFiles.length}/${pullRequest.changed_files}); owner hold remains`,
              );
              return;
            }
            if (changedFiles.some(({filename, previous_filename}) =>
              [filename, previous_filename].some((path) =>
                [
                  '.github/workflows/auto-merge.yml',
                  '.github/workflows/codex-shepherd.yml',
                ].includes(path)
              )
            )) {
              core.info('merge-authority workflow changes require an explicit manual merge');
              return;
            }
            const requiredChecks = [
              'Review checks',
              'Python specifications',
              'Python unit',
              'Python integration',
              'Python end-to-end',
              'Python runtime state',
            ];
            for (const check of requiredChecks) {
              await github.rest.repos.createCommitStatus({
                ...context.repo,
                sha: run.head_sha,
                state: 'success',
                context: check,
                description: 'Verified by exact release candidate CI',
              });
            }
            await github.rest.issues.removeLabel({
              ...context.repo,
              issue_number: pullRequest.number,
              name: 'do-not-auto-merge',
            });
            await github.rest.repos.createDispatchEvent({
              ...context.repo,
              event_type: 'auto_merge_update',
              client_payload: {
                operation: 'enable',
                pull_request_number: pullRequest.number,
                expected_head_sha: run.head_sha,
                expected_base_sha: expectedBaseSha,
                release_after_merge: true,
              },
            });

  update:
    name: Apply auto-merge update
    if: >-
      github.event_name == 'repository_dispatch' &&
      github.event.sender.login == 'github-actions[bot]' &&
      github.event.action == 'auto_merge_update'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    # Metadata-only control plane; do not contend with scarce self-hosted test runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: auto-merge-update-${{ github.event.client_payload.pull_request_number }}
      cancel-in-progress: true
    env:
      OPERATION: ${{ github.event.client_payload.operation }}
      PR_NUMBER: ${{ github.event.client_payload.pull_request_number }}
      EXPECTED_HEAD_SHA: ${{ github.event.client_payload.expected_head_sha }}
      EXPECTED_BASE_SHA: ${{ github.event.client_payload.expected_base_sha || '' }}
      RELEASE_AFTER_MERGE: ${{ github.event.client_payload.release_after_merge || 'false' }}
    steps:
      - name: Apply pull request auto-merge state
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            const operation = process.env.OPERATION;
            const pullRequestNumber = Number.parseInt(process.env.PR_NUMBER, 10);
            const expectedHeadSha = process.env.EXPECTED_HEAD_SHA;
            const expectedBaseSha = process.env.EXPECTED_BASE_SHA;
            const releaseAfterMerge = process.env.RELEASE_AFTER_MERGE === 'true';
            if (!['enable', 'disable'].includes(operation)) {
              throw new Error(`unsupported auto-merge operation: ${operation}`);
            }
            if (!Number.isInteger(pullRequestNumber) || pullRequestNumber <= 0) {
              throw new Error('pull request number must be a positive integer');
            }
            if (!/^[0-9a-f]{40}$/.test(expectedHeadSha)) {
              throw new Error('expected head SHA must be a 40-character lowercase Git object ID');
            }
            if (operation === 'enable' && !/^[0-9a-f]{40}$/.test(expectedBaseSha)) {
              throw new Error('expected merge-base SHA must be a 40-character lowercase Git object ID');
            }

            const pullRequestQuery = `query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  id
                  number
                  state
                  isDraft
                  headRefOid
                  baseRefOid
                  mergeStateStatus
                  autoMergeRequest { enabledAt }
                  labels(first: 20) { nodes { name } }
                  comments(last: 100) {
                    nodes {
                      author { login }
                      authorAssociation
                      body
                      createdAt
                    }
                  }
                  mergeCommit { oid }
                  mergedBy { login }
                }
              }
            }`;
            const fetchPullRequest = async () => {
              const result = await github.graphql(pullRequestQuery, {
                ...context.repo,
                number: pullRequestNumber,
              });
              return result.repository.pullRequest;
            };
            const dispatchRelease = async (pullRequest, mergeCommitSha) => {
              if (!releaseAfterMerge) return;
              await github.rest.repos.createDispatchEvent({
                ...context.repo,
                event_type: 'release_candidate_merged',
                client_payload: {
                  merged_pull_request: pullRequest.number,
                  merge_commit_sha: mergeCommitSha,
                  expected_base_sha: expectedBaseSha,
                },
              });
            };
            const disableAutoMerge = async (pullRequest) => {
              if (!pullRequest.autoMergeRequest) return;
              await github.graphql(
                `mutation($pullRequestId: ID!) {
                  disablePullRequestAutoMerge(input: {pullRequestId: $pullRequestId}) {
                    pullRequest { number }
                  }
                }`,
                { pullRequestId: pullRequest.id },
              );
            };
            const dispatchCurrentUpdate = async () => {
              const {data: currentMetadata} = await github.rest.pulls.get({
                ...context.repo,
                pull_number: pullRequestNumber,
              });
              if (
                currentMetadata.state !== 'open' ||
                currentMetadata.base.ref !== 'master' ||
                currentMetadata.draft ||
                currentMetadata.head.ref.startsWith('release-please--branches--master')
              ) {
                return;
              }
              const {data: currentComparison} = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${currentMetadata.base.sha}...${currentMetadata.head.sha}`,
              });
              const currentMergeBaseSha = currentComparison.merge_base_commit.sha;
              if (!/^[0-9a-f]{40}$/.test(currentMergeBaseSha || '')) {
                throw new Error('current pull request merge-base SHA is unavailable');
              }
              await github.rest.repos.createDispatchEvent({
                ...context.repo,
                event_type: 'auto_merge_update',
                client_payload: {
                  operation: 'enable',
                  pull_request_number: pullRequestNumber,
                  expected_head_sha: currentMetadata.head.sha,
                  expected_base_sha: currentMergeBaseSha,
                },
              });
            };
            if (operation === 'disable') {
              const pullRequest = await fetchPullRequest();
              if (!pullRequest || pullRequest.state !== 'OPEN') {
                core.info('pull request is no longer open; no auto-merge update needed');
                return;
              }
              if (!pullRequest.autoMergeRequest) {
                core.info('auto-merge is already disabled');
                return;
              }
              await disableAutoMerge(pullRequest);
              return;
            }

            if (!releaseAfterMerge) {
              const pullRequest = await fetchPullRequest();
              if (!pullRequest || pullRequest.state !== 'OPEN') {
                core.info('pull request is no longer open; no auto-merge update needed');
                return;
              }
              if (pullRequest.isDraft) {
                core.info('pull request returned to Draft; auto-merge remains disabled');
                return;
              }
              if (pullRequest.headRefOid !== expectedHeadSha) {
                core.info(
                  `pull request head changed from ${expectedHeadSha} to ${pullRequest.headRefOid}; ` +
                  'dispatching current exact-diff authorization',
                );
                await dispatchCurrentUpdate();
                return;
              }
              const {data: pullRequestMetadata} = await github.rest.pulls.get({
                ...context.repo,
                pull_number: pullRequest.number,
              });
              if (
                pullRequestMetadata.state !== 'open' ||
                pullRequestMetadata.head.sha !== expectedHeadSha
              ) {
                core.info('pull request metadata changed while checking merge authority');
                return;
              }
              const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo,
                basehead: `${pullRequestMetadata.base.sha}...${pullRequestMetadata.head.sha}`,
              });
              const currentBaseSha = comparison.merge_base_commit.sha;
              if (currentBaseSha !== expectedBaseSha) {
                core.info(
                  `pull request merge base changed from ${expectedBaseSha} to ${currentBaseSha}; ` +
                  'dispatching current exact-diff authorization',
                );
                await dispatchCurrentUpdate();
                return;
              }
              const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
                ...context.repo,
                pull_number: pullRequest.number,
                per_page: 100,
              });
              if (changedFiles.length !== pullRequestMetadata.changed_files) {
                core.info(
                  `changed-file listing is incomplete ` +
                  `(${changedFiles.length}/${pullRequestMetadata.changed_files}); ` +
                  'exact-diff merge remains disabled',
                );
                return;
              }
              if (changedFiles.some(({filename, previous_filename}) =>
                [filename, previous_filename].some((path) =>
                  [
                    '.github/workflows/auto-merge.yml',
                    '.github/workflows/codex-shepherd.yml',
                  ].includes(path)
                )
              )) {
                core.info('merge-authority workflow changes require an explicit manual merge');
                return;
              }

              // Native auto-merge survives synchronize events and could merge a new
              // head before the Connector responds. Ordinary pull requests therefore
              // use only this exact-diff, event-driven merge path.
              await disableAutoMerge(pullRequest);
              if (pullRequest.labels.nodes.some(({name}) => name === 'do-not-auto-merge')) {
                core.info('do-not-auto-merge holds this pull request');
                return;
              }

              const connectorLogin = 'chatgpt-codex-connector';
              const shepherdLogin = 'github-actions[bot]';
              const normalizeLogin = (login) => String(login || '').replace(/\[bot\]$/, '');
              const isConnectorLogin = (login) => normalizeLogin(login) === connectorLogin;
              const trustedAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);
              const triagePattern = /^\/codex-triage ([0-9a-f]{40}) (clean|complete)$/;
              const reviewedCommitPattern = /Reviewed commit:[^`]*`([0-9a-f]{7,40})`/i;
              const shepherdReviewMarkerPattern =
                /<!-- aletheia-codex-shepherd head=([0-9a-f]{40}) base=([0-9a-f]{40}) kind=review -->/;
              const resolveReviewedCommitSha = async (body) => {
                const match = String(body || '').match(reviewedCommitPattern);
                if (!match) return null;
                try {
                  const {data: commit} = await github.rest.repos.getCommit({
                    ...context.repo,
                    ref: match[1],
                  });
                  return commit.sha;
                } catch (error) {
                  core.info(`could not resolve Connector reviewed commit ${match[1]}: ${error}`);
                  return null;
                }
              };
              const [allReviews, allComments] = await Promise.all([
                github.paginate(github.rest.pulls.listReviews, {
                  ...context.repo,
                  pull_number: pullRequest.number,
                  per_page: 100,
                }),
                github.paginate(github.rest.issues.listComments, {
                  ...context.repo,
                  issue_number: pullRequest.number,
                  per_page: 100,
                }),
              ]);
              const currentReviewRequests = allComments.flatMap((comment) => {
                if (comment.user?.login !== shepherdLogin || !comment.created_at) return [];
                const marker = String(comment.body || '').match(shepherdReviewMarkerPattern);
                if (
                  !marker ||
                  marker[1] !== expectedHeadSha ||
                  marker[2] !== expectedBaseSha
                ) {
                  return [];
                }
                return [{createdAt: comment.created_at}];
              });
              const latestReviewRequestAt = currentReviewRequests
                .map(({createdAt}) => createdAt)
                .sort()
                .at(-1);
              if (!latestReviewRequestAt) {
                core.info(
                  `waiting for current Shepherd review request on ` +
                  `${expectedHeadSha}@${expectedBaseSha}`,
                );
                return;
              }
              const exactHeadReviews = allReviews
                .filter((review) =>
                  isConnectorLogin(review.user?.login) &&
                  review.commit_id === expectedHeadSha &&
                  review.submitted_at &&
                  review.submitted_at >= latestReviewRequestAt &&
                  review.state !== 'DISMISSED'
                )
                .map((review) => ({submittedAt: review.submitted_at}));
              const acknowledgements = allComments.flatMap((comment) => {
                if (
                  !trustedAssociations.has(comment.author_association) ||
                  !comment.created_at ||
                  comment.created_at < latestReviewRequestAt
                ) {
                  return [];
                }
                const [command, ...detailLines] = String(comment.body || '')
                  .replace(/\r/g, '')
                  .split('\n');
                const match = command.trim().match(triagePattern);
                const details = detailLines.join('\n').trim();
                if (!match || match[1] !== expectedHeadSha || !details) return [];
                return [{
                  disposition: match[2],
                  createdAt: comment.created_at,
                }];
              });
              const connectorCleanCandidates = allComments.filter((comment) =>
                isConnectorLogin(comment.user?.login) &&
                comment.created_at &&
                comment.created_at >= latestReviewRequestAt &&
                /Didn't find any major issues\./i.test(String(comment.body || ''))
              );
              let connectorCleanExactHead = false;
              for (const comment of connectorCleanCandidates) {
                const reviewedCommitSha = await resolveReviewedCommitSha(comment.body);
                if (reviewedCommitSha === expectedHeadSha) {
                  connectorCleanExactHead = true;
                  break;
                }
              }

              if (exactHeadReviews.length === 0) {
                if (
                  !connectorCleanExactHead &&
                  !acknowledgements.some(({disposition}) => disposition === 'clean')
                ) {
                  core.info(
                    `waiting for exact-diff Connector completion on ` +
                    `${expectedHeadSha}@${expectedBaseSha}; a clean Connector result will ` +
                    'resume this PR automatically',
                  );
                  return;
                }
              } else {
                const latestReviewAt = exactHeadReviews
                  .map(({submittedAt}) => submittedAt)
                  .sort()
                  .at(-1);
                const triageComplete = acknowledgements.some((acknowledgement) =>
                  acknowledgement.disposition === 'complete' &&
                  acknowledgement.createdAt >= latestReviewAt
                );
                if (!triageComplete) {
                  core.info(
                    `waiting for P1/P2 triage on ${expectedHeadSha}@${expectedBaseSha}; ` +
                    `an authorized maintainer must comment "/codex-triage ${expectedHeadSha} ` +
                    `complete" after the current exact-diff review and document every ` +
                    `confirmed, false-positive, or deferred finding`,
                  );
                  return;
                }
              }

              if (pullRequest.mergeStateStatus !== 'CLEAN') {
                core.info(
                  `exact-diff Connector gate passed; waiting for an event after pull request ` +
                  `status ${pullRequest.mergeStateStatus}`,
                );
                return;
              }
              const mergeResult = await github.rest.pulls.merge({
                ...context.repo,
                pull_number: pullRequestNumber,
                merge_method: 'squash',
                sha: expectedHeadSha,
              });
              if (!mergeResult.data.merged) {
                throw new Error(
                  `GitHub declined protected merge: ${mergeResult.data.message || 'unknown reason'}`,
                );
              }
              return;
            }

            const autoMergeStates = new Set(['BEHIND', 'BLOCKED', 'HAS_HOOKS']);
            const maxAttempts = 150;
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const pullRequest = await fetchPullRequest();
              if (!pullRequest) {
                core.info('pull request is no longer open; no auto-merge update needed');
                return;
              }
              if (pullRequest.state === 'MERGED') {
                await dispatchRelease(pullRequest, pullRequest.mergeCommit?.oid);
                return;
              }
              if (pullRequest.state !== 'OPEN') {
                core.info('pull request is no longer open; no auto-merge update needed');
                return;
              }
              if (pullRequest.isDraft) {
                core.info('pull request returned to Draft; auto-merge remains disabled');
                return;
              }
              if (pullRequest.headRefOid !== expectedHeadSha) {
                core.info(
                  `pull request head changed from ${expectedHeadSha} to ${pullRequest.headRefOid}; ` +
                  'a newer pull request event must authorize the merge',
                );
                return;
              }
              if (releaseAfterMerge && pullRequest.baseRefOid !== expectedBaseSha) {
                await github.rest.issues.addLabels({
                  ...context.repo,
                  issue_number: pullRequest.number,
                  labels: ['do-not-auto-merge'],
                });
                core.info('release candidate base changed; rerun the manual release workflow');
                return;
              }
              if (
                releaseAfterMerge &&
                pullRequest.labels.nodes.some(({name}) => name === 'do-not-auto-merge')
              ) {
                core.info('exact release candidate verification still holds this pull request');
                return;
              }
              if (
                pullRequest.mergeStateStatus === 'UNKNOWN' ||
                (pullRequest.mergeStateStatus === 'UNSTABLE' && !releaseAfterMerge)
              ) {
                if (attempt === maxAttempts) {
                  throw new Error(
                    `pull request remained ${pullRequest.mergeStateStatus} after ${maxAttempts} checks`,
                  );
                }
                core.info(
                  `waiting for pull request status ${pullRequest.mergeStateStatus} ` +
                  `(attempt ${attempt}/${maxAttempts})`,
                );
                await new Promise((resolve) => setTimeout(resolve, 5000));
                continue;
              }
              if (releaseAfterMerge && autoMergeStates.has(pullRequest.mergeStateStatus)) {
                if (attempt === maxAttempts) {
                  throw new Error(
                    `release candidate remained ${pullRequest.mergeStateStatus} after ${maxAttempts} checks`,
                  );
                }
                await new Promise((resolve) => setTimeout(resolve, 5000));
                continue;
              }
              if (
                pullRequest.mergeStateStatus === 'CLEAN' ||
                (releaseAfterMerge && pullRequest.mergeStateStatus === 'UNSTABLE')
              ) {
                const mergeResult = await github.rest.pulls.merge({
                  ...context.repo,
                  pull_number: pullRequestNumber,
                  merge_method: 'squash',
                  sha: expectedHeadSha,
                });
                if (!mergeResult.data.merged) {
                  throw new Error(
                    `GitHub declined protected merge: ${mergeResult.data.message || 'unknown reason'}`,
                  );
                }
                await dispatchRelease(
                  {...pullRequest, mergedBy: {login: 'github-actions[bot]'}},
                  mergeResult.data.sha,
                );
                return;
              }
              if (pullRequest.autoMergeRequest) {
                core.info('auto-merge is enabled; GitHub will merge when required checks pass');
                return;
              }
              if (!autoMergeStates.has(pullRequest.mergeStateStatus)) {
                throw new Error(
                  `pull request cannot enter auto-merge from ${pullRequest.mergeStateStatus}`,
                );
              }
              try {
                await github.graphql(
                  `mutation($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(input: {
                      pullRequestId: $pullRequestId,
                      mergeMethod: SQUASH
                    }) {
                      pullRequest { number }
                    }
                  }`,
                  { pullRequestId: pullRequest.id },
                );
                core.info('auto-merge enabled; GitHub will merge when required checks pass');
                return;
              } catch (error) {
                if (
                  attempt < maxAttempts &&
                  (
                    String(error).includes('unstable status') ||
                    String(error).includes('clean status')
                  )
                ) {
                  await new Promise((resolve) => setTimeout(resolve, 5000));
                  continue;
                }
                throw error;
              }
            }

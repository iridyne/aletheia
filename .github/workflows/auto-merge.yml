name: Queue pull requests for auto-merge

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, ready_for_review, edited, synchronize, labeled, unlabeled]
  repository_dispatch:
    types: [auto_merge_update]

permissions:
  contents: read

jobs:
  # A pull_request_target run still reports a check on the PR head. Keep that
  # run dispatch-only so its own in-progress check cannot make the mutation
  # fail with "Pull request is in unstable status".
  schedule:
    name: Schedule auto-merge update
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.draft == false
    permissions:
      contents: write
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    env:
      OPERATION: ${{ contains(github.event.pull_request.labels.*.name, 'do-not-auto-merge') && 'disable' || 'enable' }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Dispatch trusted auto-merge update
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            const operation = process.env.OPERATION;
            const pullRequestNumber = Number.parseInt(process.env.PR_NUMBER, 10);
            if (!['enable', 'disable'].includes(operation)) {
              throw new Error(`unsupported auto-merge operation: ${operation}`);
            }
            if (!Number.isInteger(pullRequestNumber) || pullRequestNumber <= 0) {
              throw new Error('pull request number must be a positive integer');
            }
            await github.rest.repos.createDispatchEvent({
              ...context.repo,
              event_type: 'auto_merge_update',
              client_payload: {
                operation,
                pull_request_number: pullRequestNumber,
              },
            });

  update:
    name: Apply auto-merge update
    if: github.event_name == 'repository_dispatch'
    permissions:
      contents: write
      pull-requests: write
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 15
    env:
      OPERATION: ${{ github.event.client_payload.operation }}
      PR_NUMBER: ${{ github.event.client_payload.pull_request_number }}
    steps:
      - name: Apply pull request auto-merge state
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        with:
          retries: 3
          script: |
            const operation = process.env.OPERATION;
            const pullRequestNumber = Number.parseInt(process.env.PR_NUMBER, 10);
            if (!['enable', 'disable'].includes(operation)) {
              throw new Error(`unsupported auto-merge operation: ${operation}`);
            }
            if (!Number.isInteger(pullRequestNumber) || pullRequestNumber <= 0) {
              throw new Error('pull request number must be a positive integer');
            }

            const pullRequestQuery = `query($owner: String!, $repo: String!, $number: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $number) {
                  id
                  number
                  state
                  isDraft
                  mergeStateStatus
                  autoMergeRequest { enabledAt }
                }
              }
            }`;
            const fetchPullRequest = async () => {
              const result = await github.graphql(pullRequestQuery, {
                ...context.repo,
                number: pullRequestNumber,
              });
              return result.repository.pullRequest;
            };

            if (operation === 'disable') {
              const pullRequest = await fetchPullRequest();
              if (!pullRequest || pullRequest.state !== 'OPEN') {
                core.info('pull request is no longer open; no auto-merge update needed');
                return;
              }
              if (!pullRequest.autoMergeRequest) {
                core.info('auto-merge is already disabled');
                return;
              }
              await github.graphql(
                `mutation($pullRequestId: ID!) {
                  disablePullRequestAutoMerge(input: {pullRequestId: $pullRequestId}) {
                    pullRequest { number }
                  }
                }`,
                { pullRequestId: pullRequest.id },
              );
              return;
            }

            const acceptableStates = new Set(['BEHIND', 'BLOCKED', 'CLEAN', 'HAS_HOOKS']);
            const maxAttempts = 150;
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              const pullRequest = await fetchPullRequest();
              if (!pullRequest || pullRequest.state !== 'OPEN') {
                core.info('pull request is no longer open; no auto-merge update needed');
                return;
              }
              if (pullRequest.isDraft) {
                core.info('pull request returned to Draft; auto-merge remains disabled');
                return;
              }
              if (pullRequest.autoMergeRequest) {
                core.info('auto-merge is already enabled');
                return;
              }
              if (['UNKNOWN', 'UNSTABLE'].includes(pullRequest.mergeStateStatus)) {
                if (attempt === maxAttempts) {
                  throw new Error(
                    `pull request remained ${pullRequest.mergeStateStatus} after ${maxAttempts} checks`,
                  );
                }
                core.info(
                  `waiting for pull request status ${pullRequest.mergeStateStatus} ` +
                  `(attempt ${attempt}/${maxAttempts})`,
                );
                await new Promise((resolve) => setTimeout(resolve, 5000));
                continue;
              }
              if (!acceptableStates.has(pullRequest.mergeStateStatus)) {
                throw new Error(
                  `pull request cannot enter auto-merge from ${pullRequest.mergeStateStatus}`,
                );
              }
              try {
                await github.graphql(
                  `mutation($pullRequestId: ID!) {
                    enablePullRequestAutoMerge(input: {
                      pullRequestId: $pullRequestId,
                      mergeMethod: MERGE
                    }) {
                      pullRequest { number }
                    }
                  }`,
                  { pullRequestId: pullRequest.id },
                );
                return;
              } catch (error) {
                if (
                  attempt < maxAttempts &&
                  String(error).includes('unstable status')
                ) {
                  await new Promise((resolve) => setTimeout(resolve, 5000));
                  continue;
                }
                throw error;
              }
            }

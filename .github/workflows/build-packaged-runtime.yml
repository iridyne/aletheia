name: Build Packaged Tray CLI Runtime

on:
  pull_request:
    branches: [master]
    paths:
      - "aletheia/**"
      - "frontend/**"
      - "native/aletheia-host/**"
      - "packaging/pyinstaller/**"
      - "scripts/release/build_packaged_runtime.py"
      - "scripts/release/build_macos_app.py"
      - "scripts/release/local_release_session.py"
      - "scripts/release/pyinstaller_entry.py"
      - "scripts/release/sign_update_feed.py"
      - "tests/test_packaged_*.py"
      - "tests/test_macos_packaged_app.py"
      - "tests/test_local_release_session.py"
      - "docs/plans/packaged_tray_cli_runtime.md"
      - "docs/operations/PACKAGED_RUNTIME.md"
      - ".github/workflows/build-packaged-runtime.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the signed runtime feed and installer to GitHub Pages
        type: boolean
        required: true
        default: false

env:
  ALETHEIA_UPDATE_SITE_BASE_URL: https://iridite.github.io/aletheia
  ALETHEIA_UPDATE_FEED_URL: https://iridite.github.io/aletheia/update-feed.json

permissions:
  contents: read

concurrency:
  group: packaged-runtime-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contracts:
    name: Packaged runtime contracts
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && fromJSON('["self-hosted","macOS","ARM64","aletheia-release"]') || 'ubuntu-24.04' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish }}
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-groups
      - name: Run focused package, bootstrap, update, and app-layout contracts
        run: |
          uv run pytest \
            tests/test_packaged_runtime_contract.py \
            tests/test_packaged_bootstrap.py \
            tests/test_packaged_update.py \
            tests/test_packaged_update_activation.py \
            tests/test_packaged_update_recovery.py \
            tests/test_packaged_update_routes.py \
            tests/test_packaged_release_workflow.py \
            tests/test_macos_packaged_app.py \
            tests/test_local_release_session.py \
            -q --tb=short

  macos-package:
    name: macOS arm64 self-contained CLI and tray app
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && fromJSON('["self-hosted","macOS","ARM64","aletheia-release"]') || 'macos-15' }}
    timeout-minutes: 60
    steps:
      - name: Check out exact source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assert Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish }}
          cache-dependency-glob: uv.lock

      - name: Synchronize locked development dependencies
        run: uv sync --locked --all-groups

      - name: Install pinned PyInstaller build tool
        run: uv pip install --python .venv/bin/python "pyinstaller==6.16.0"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build browser dashboard
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Run focused packaging contracts
        run: |
          uv run pytest \
            tests/test_packaged_runtime_contract.py \
            tests/test_packaged_bootstrap.py \
            tests/test_packaged_update.py \
            tests/test_packaged_update_activation.py \
            tests/test_packaged_update_recovery.py \
            tests/test_packaged_update_routes.py \
            tests/test_packaged_release_workflow.py \
            tests/test_macos_packaged_app.py \
            tests/test_local_release_session.py \
            tests/test_release_data_dir.py \
            -q --tb=short

      - name: Build PyInstaller one-folder payload
        run: uv run python scripts/release/build_packaged_runtime.py --output-dir dist/packaged-runtime --max-mib 350

      - name: Resolve packaged runtime paths
        id: payload
        shell: bash
        run: |
          set -euo pipefail
          core="$PWD/build/pyinstaller/dist/aletheia-core/aletheia-core"
          test -x "$core"
          archive="$(find "$PWD/dist/packaged-runtime" -maxdepth 1 -name 'aletheia-runtime-*.tar.gz' -print -quit)"
          test -f "$archive"
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "payload_dir=$PWD/build/pyinstaller/dist/aletheia-core" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Prepare signed release feed and installed trust root
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        shell: bash
        env:
          UPDATE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.ALETHEIA_UPDATE_SIGNING_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/master" ]]; then
            echo "Signed releases may only be published from master." >&2
            exit 1
          fi
          if [[ -z "$UPDATE_SIGNING_PRIVATE_KEY_PEM" ]]; then
            echo "Repository secret ALETHEIA_UPDATE_SIGNING_PRIVATE_KEY_PEM is required." >&2
            exit 1
          fi
          umask 077
          private_key="$RUNNER_TEMP/update-signing-private-key.pem"
          public_key="$RUNNER_TEMP/update-public-key.pem"
          feed_url_file="$RUNNER_TEMP/update-feed-url.txt"
          feed="$RUNNER_TEMP/update-feed.json"
          printf '%s' "$UPDATE_SIGNING_PRIVATE_KEY_PEM" > "$private_key"
          printf '%s\n' "$ALETHEIA_UPDATE_FEED_URL" > "$feed_url_file"
          archive="${{ steps.payload.outputs.archive }}"
          artifact_url="$ALETHEIA_UPDATE_SITE_BASE_URL/$(basename "$archive")"
          uv run python scripts/release/sign_update_feed.py \
            --archive "$archive" \
            --artifact-url "$artifact_url" \
            --private-key "$private_key" \
            --public-key-output "$public_key" \
            --output "$feed"
          test -s "$public_key"
          test -s "$feed"
          chmod 600 "$private_key"
          chmod 644 "$public_key" "$feed_url_file" "$feed"

      - name: Prove core CLI works without uv or system Python in command path
        shell: bash
        env:
          ALETHEIA_PACKAGED: "1"
          ALETHEIA_DATA_DIR: ${{ runner.temp }}/aletheia-packaged-home
        run: |
          set -euo pipefail
          core="${{ steps.payload.outputs.core }}"
          mkdir -p "$ALETHEIA_DATA_DIR"
          env -i HOME="$HOME" PATH="/usr/bin:/bin" ALETHEIA_PACKAGED=1 ALETHEIA_DATA_DIR="$ALETHEIA_DATA_DIR" "$core" version
          env -i HOME="$HOME" PATH="/usr/bin:/bin" ALETHEIA_PACKAGED=1 ALETHEIA_DATA_DIR="$ALETHEIA_DATA_DIR" "$core" --help >/dev/null
          env -i HOME="$HOME" PATH="/usr/bin:/bin" ALETHEIA_PACKAGED=1 ALETHEIA_DATA_DIR="$ALETHEIA_DATA_DIR" "$core" doctor --help >/dev/null
          env -i HOME="$HOME" PATH="/usr/bin:/bin" ALETHEIA_PACKAGED=1 ALETHEIA_DATA_DIR="$ALETHEIA_DATA_DIR" "$core" gateway --help >/dev/null
          env -i HOME="$HOME" PATH="/usr/bin:/bin" ALETHEIA_PACKAGED=1 ALETHEIA_DATA_DIR="$ALETHEIA_DATA_DIR" "$core" update --help >/dev/null

      - name: Prove packaged gateway readiness and health
        id: gateway_smoke
        continue-on-error: true
        shell: bash
        env:
          ALETHEIA_PACKAGED: "1"
          ALETHEIA_DATA_DIR: ${{ runner.temp }}/aletheia-packaged-home
          ALETHEIA_PACKAGED_SMOKE: "1"
          ALETHEIA_SMOKE_DASHBOARD_PORT: "18787"
        run: |
          set -euo pipefail
          core="${{ steps.payload.outputs.core }}"
          cleanup() { "$core" gateway stop || true; }
          trap cleanup EXIT
          mkdir -p "$ALETHEIA_DATA_DIR"
          cat > "$ALETHEIA_DATA_DIR/config.yaml" <<YAML
          app:
            dashboard_port: $ALETHEIA_SMOKE_DASHBOARD_PORT
            auto_open_browser: false
          runtime:
            scheduler_enabled: false
            autostart_on_start: false
            auto_reload: false
          YAML
          "$core" gateway start --no-browser
          for _ in $(seq 1 180); do
            if curl --noproxy '*' --fail --silent "http://127.0.0.1:$ALETHEIA_SMOKE_DASHBOARD_PORT/_infra/readyz" >/dev/null; then break; fi
            sleep 0.25
          done
          curl --noproxy '*' --fail --silent "http://127.0.0.1:$ALETHEIA_SMOKE_DASHBOARD_PORT/_infra/readyz"
          curl --noproxy '*' --fail --silent "http://127.0.0.1:$ALETHEIA_SMOKE_DASHBOARD_PORT/api/health" >/dev/null
          "$core" gateway stop
          trap - EXIT

      - name: Capture packaged gateway diagnostics
        if: always()
        shell: bash
        run: |
          diagnostic="$RUNNER_TEMP/packaged-gateway-diagnostics"
          mkdir -p "$diagnostic"
          cp -R "$RUNNER_TEMP/aletheia-packaged-home/logs" "$diagnostic/logs" 2>/dev/null || true
          cp "$RUNNER_TEMP/aletheia-packaged-home/gateway.pid" "$diagnostic/" 2>/dev/null || true
          cp build/pyinstaller/work/aletheia-core/warn-aletheia-core.txt "$diagnostic/" 2>/dev/null || true
          find "$diagnostic" -type f -maxdepth 3 -print || true

      - name: Upload packaged gateway diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: packaged-gateway-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/packaged-gateway-diagnostics
          if-no-files-found: ignore
          retention-days: 3

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Test locked host release/update core
        working-directory: native/aletheia-host
        run: cargo test --locked --all-targets

      - name: Build stable CLI and tray binaries
        working-directory: native/aletheia-host
        run: cargo build --locked --release --bins

      - name: Exercise stable CLI selection and direct tray smoke
        id: host_smoke
        continue-on-error: true
        shell: bash
        env:
          ALETHEIA_DATA_DIR: ${{ runner.temp }}/aletheia-host-data
        run: |
          set -euo pipefail
          host_root="$RUNNER_TEMP/aletheia-host-root"
          release_id="0.5.0-${GITHUB_SHA:0:12}"
          release_root="$host_root/releases/$release_id"
          mkdir -p "$release_root" "$ALETHEIA_DATA_DIR"
          cp -R "${{ steps.payload.outputs.payload_dir }}/." "$release_root/"
          cat > "$host_root/current.json" <<JSON
          {
            "schema_version": 1,
            "current": "$release_id"
          }
          JSON
          export ALETHEIA_HOST_ROOT="$host_root"
          cli="$PWD/native/aletheia-host/target/release/aletheia"
          tray="$PWD/native/aletheia-host/target/release/aletheia-tray"
          "$cli" version
          "$cli" doctor --help >/dev/null
          "$cli" gateway --help >/dev/null
          "$cli" __host status | tee "$RUNNER_TEMP/host-status.json"
          "$tray" --smoke-test
          "$cli" gateway stop || true

      - name: Build installable browser-first macOS app
        if: steps.host_smoke.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --payload-dir "${{ steps.payload.outputs.payload_dir }}"
            --host-bin-dir "$PWD/native/aletheia-host/target/release"
            --output-dir "$PWD/dist/macos-app"
          )
          if [[ -s "$RUNNER_TEMP/update-public-key.pem" && -s "$RUNNER_TEMP/update-feed-url.txt" ]]; then
            args+=(
              --public-key "$RUNNER_TEMP/update-public-key.pem"
              --feed-url-file "$RUNNER_TEMP/update-feed-url.txt"
            )
          fi
          uv run python scripts/release/build_macos_app.py "${args[@]}"
          test -x "$PWD/dist/macos-app/Aletheia.app/Contents/MacOS/aletheia-tray"
          test -x "$PWD/dist/macos-app/Aletheia.app/Contents/MacOS/aletheia"

      - name: Prove first-launch bootstrap, stable CLI, and app tray smoke
        id: app_smoke
        if: steps.host_smoke.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          ALETHEIA_DATA_DIR: ${{ runner.temp }}/aletheia-app-data
          ALETHEIA_HOST_ROOT: ${{ runner.temp }}/aletheia-app-host
          ALETHEIA_PACKAGED_SMOKE: "1"
          ALETHEIA_SMOKE_DASHBOARD_PORT: "19787"
        run: |
          set -euo pipefail
          app="$PWD/dist/macos-app/Aletheia.app"
          rm -rf "$ALETHEIA_HOST_ROOT" "$ALETHEIA_DATA_DIR"
          mkdir -p "$ALETHEIA_DATA_DIR"
          cat > "$ALETHEIA_DATA_DIR/config.yaml" <<YAML
          app:
            dashboard_port: $ALETHEIA_SMOKE_DASHBOARD_PORT
            auto_open_browser: false
          runtime:
            scheduler_enabled: false
            autostart_on_start: false
            auto_reload: false
          YAML
          "$app/Contents/MacOS/aletheia" __host status | tee "$RUNNER_TEMP/app-host-status.json"
          test -f "$ALETHEIA_HOST_ROOT/current.json"
          if [[ -s "$RUNNER_TEMP/update-public-key.pem" ]]; then
            cmp "$RUNNER_TEMP/update-public-key.pem" "$ALETHEIA_HOST_ROOT/update-public-key.pem"
            cmp "$RUNNER_TEMP/update-feed-url.txt" "$ALETHEIA_HOST_ROOT/update-feed-url.txt"
          fi
          "$app/Contents/MacOS/aletheia" version
          "$app/Contents/MacOS/ato" doctor --help >/dev/null
          "$app/Contents/MacOS/aletheia-tray" --smoke-test
          curl --noproxy '*' --fail --silent "http://127.0.0.1:$ALETHEIA_SMOKE_DASHBOARD_PORT/_infra/readyz" >/dev/null
          curl --noproxy '*' --fail --silent "http://127.0.0.1:$ALETHEIA_SMOKE_DASHBOARD_PORT/api/health" >/dev/null
          "$app/Contents/MacOS/aletheia" gateway stop

      - name: Stage portable host artifact
        if: steps.host_smoke.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          stage="$PWD/dist/host-macos"
          mkdir -p "$stage/bin" "$stage/runtime"
          cp native/aletheia-host/target/release/aletheia "$stage/bin/aletheia"
          cp native/aletheia-host/target/release/aletheia "$stage/bin/ato"
          cp native/aletheia-host/target/release/aletheia-tray "$stage/bin/aletheia-tray"
          cp "${{ steps.payload.outputs.archive }}" "$stage/runtime/"
          cp "${{ steps.payload.outputs.archive }}.sha256" "$stage/runtime/"
          cp dist/packaged-runtime/packaged-runtime-size.json "$stage/runtime/"
          cp native/aletheia-host/Cargo.lock "$stage/Cargo.lock"
          tar -C "$PWD/dist" -czf "$PWD/dist/aletheia-packaged-host-macos.tar.gz" host-macos

      - name: Upload packaged app, host, and runtime
        if: steps.host_smoke.outcome == 'success' && steps.app_smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: aletheia-packaged-host-${{ github.sha }}
          path: |
            dist/macos-app/Aletheia-*-darwin-arm64.zip
            dist/macos-app/Aletheia-*-darwin-arm64.zip.sha256
            dist/macos-app/macos-app-report.json
            dist/aletheia-packaged-host-macos.tar.gz
            dist/packaged-runtime/*.tar.gz
            dist/packaged-runtime/*.sha256
            dist/packaged-runtime/packaged-runtime-size.json
            native/aletheia-host/Cargo.lock
          if-no-files-found: error
          retention-days: 14

      - name: Stage signed GitHub Pages release site
        if: github.event_name == 'workflow_dispatch' && inputs.publish && steps.app_smoke.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          site="$PWD/dist/update-site"
          rm -rf "$site"
          mkdir -p "$site"
          archive="${{ steps.payload.outputs.archive }}"
          app_archive="$(find "$PWD/dist/macos-app" -maxdepth 1 -name 'Aletheia-*-darwin-arm64.zip' -print -quit)"
          test -f "$archive"
          test -f "$archive.sha256"
          test -f "$app_archive"
          test -f "$app_archive.sha256"
          cp "$RUNNER_TEMP/update-feed.json" "$site/update-feed.json"
          cp "$RUNNER_TEMP/update-public-key.pem" "$site/update-public-key.pem"
          cp "$archive" "$archive.sha256" "$site/"
          cp "$app_archive" "$app_archive.sha256" "$site/"
          cp "$PWD/dist/macos-app/macos-app-report.json" "$site/"
          touch "$site/.nojekyll"
          uv run python -c 'import json, pathlib; envelope=json.loads(pathlib.Path("dist/update-site/update-feed.json").read_text()); assert envelope["schema_version"] == 1 and envelope["signed_payload"] and envelope["signature"]'
          find "$site" -maxdepth 1 -type f -print

      - name: Archive signed release site for GitHub Pages
        if: github.event_name == 'workflow_dispatch' && inputs.publish && steps.app_smoke.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/artifact.tar"
          tar -C "$PWD/dist/update-site" -cvf "$RUNNER_TEMP/artifact.tar" .
          test -s "$RUNNER_TEMP/artifact.tar"

      - name: Upload signed release site for GitHub Pages
        if: github.event_name == 'workflow_dispatch' && inputs.publish && steps.app_smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

      - name: Require packaged gateway, host, and app smoke
        if: always()
        shell: bash
        run: |
          test "${{ steps.gateway_smoke.outcome }}" = "success"
          test "${{ steps.host_smoke.outcome }}" = "success"
          test "${{ steps.app_smoke.outcome }}" = "success"

  publish-pages:
    name: Publish signed runtime feed
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [contracts, macos-package]
    runs-on: [self-hosted, macOS, ARM64, aletheia-release]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages release endpoint
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish immutable runtime and signed feed
        id: deployment
        uses: actions/deploy-pages@v4

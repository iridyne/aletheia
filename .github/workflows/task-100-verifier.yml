name: Complete TASK-2026-100

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify-and-complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-groups
      - name: Run registered verifier and complete task
        run: uv run aletheia agent workflow task complete TASK-2026-100 --command-key macos_release
      - name: Upload verifier-produced task metadata
        uses: actions/upload-artifact@v4
        with:
          name: task-100-completed-metadata
          path: .agent/tasks/TASK-2026-100.yaml
          if-no-files-found: error
          retention-days: 1

name: Revalidate TASK-2026-099

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  revalidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --locked --all-groups
      - name: Revalidate completed historical task
        run: uv run aletheia agent workflow task revalidate TASK-2026-099 --command-key runtime_home_ci_repair
      - name: Upload verifier-produced task metadata
        uses: actions/upload-artifact@v4
        with:
          name: task-99-revalidated-metadata
          path: .agent/tasks/TASK-2026-099.yaml
          if-no-files-found: error
          retention-days: 1

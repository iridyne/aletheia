# RUNNER SECURITY CONTRACT (#1356)
# This metadata gate runs on the shared self-hosted Fedora pool like every other
# CI job today, and consumes no secrets. When #1356 provisions a dedicated
# lightweight trusted control substrate, this control-plane-adjacent metadata job
# must move there rather than contend with deep-test runner slots.
#
# PHASE 1 SAME-HEAD METADATA RECOVERY CONTRACT (#2167, addendum A)
# ci.yml deliberately does NOT listen to pull_request `edited`, so a PR-body-only
# change must be able to re-run the Change Contract check on the SAME head SHA
# without a source commit and without replacing the deep-regression evidence for
# that exact head. This workflow is that isolated metadata status boundary:
# it listens to `edited` (plus code-changing events) and runs only the cheap,
# stdlib-only Change Contract verification. It never runs deep jobs, so a
# skipped/pass-through deep-run cannot satisfy or overwrite the required deep
# checks for the same head, and editing the body cannot invalidate them.
#
# Add the job name "Verify Change Contract" to the master branch required
# status checks / ruleset when the GitHub plan permits it. Independently,
# `.github/workflows/auto-merge.yml` reads this exact GitHub Actions check on
# the exact head and fails closed, so auto-merge is eligible only when BOTH this
# metadata check and the deep checks are valid even where ruleset configuration
# is unavailable (see docs/archive/legacy/plans/engineering/CI_RELIABILITY_IMPLEMENTATION_PLAN.md#CI-07).

name: Aletheia Change Contract gate

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: change-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify-change-contract:
    name: Verify Change Contract
    runs-on: [self-hosted, Linux, X64, ubuntu-24.04]
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The synthetic PR merge ref is needed so the Change Contract check
          # resolves the exact current base (HEAD^1) and exact PR head for the
          # same head SHA, exactly as scripts/check_change_contract.py requires.
          fetch-depth: 0

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: false

      - name: Verify Change Contract structure (no dependency sync)
        id: verify-change-contract
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        shell: bash
        run: |
          set -euo pipefail
          # --no-sync: a pure metadata failure must never pay to synchronize the
          # full dependency graph, and check_change_contract.py is stdlib-only.
          set +e
          uv run --no-sync python scripts/check_change_contract.py
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "metadata-ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Emit the canonical machine-readable repair handoff (ci_failure_handoff.v1)
          # for a preflight_metadata failure so an AI repair executor can consume it.
          if uv run --no-sync python scripts/ci_failure_handoff.py \
            --category preflight_metadata \
            --failing-job "Verify Change Contract" \
            --failing-step "Verify Change Contract structure" \
            --output "$RUNNER_TEMP/ci-failure-handoff.json" \
            >/dev/null 2>&1; then
            echo "::group::ci_failure_handoff.v1"
            cat "$RUNNER_TEMP/ci-failure-handoff.json"
            echo "::endgroup::"
            echo "handoff-produced=true" >> "$GITHUB_OUTPUT"
          else
            echo "handoff-produced=false" >> "$GITHUB_OUTPUT"
          fi
          exit 1

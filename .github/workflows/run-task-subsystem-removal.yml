name: Run task subsystem removal

on:
  pull_request:
    branches: [master]
    paths:
      - .github/workflows/run-task-subsystem-removal.yml
      - .github/workflows/remove-repository-task-subsystem.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Execute or capture the one-time removal script
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import textwrap
          import traceback

          workflow = Path('.github/workflows/remove-repository-task-subsystem.yml')
          try:
              text = workflow.read_text(encoding='utf-8')
              match = re.search(r"python - <<'PY'\n(.*?)\n          PY", text, re.S)
              if not match:
                  raise RuntimeError('embedded removal script not found')
              source = textwrap.dedent(match.group(1))
              exec(compile(source, str(workflow), 'exec'), {'__name__': '__main__'})
          except BaseException:
              error = traceback.format_exc()
              subprocess.run(['git', 'reset', '--hard', 'HEAD'], check=True)
              Path('task-subsystem-migration-error.txt').write_text(error, encoding='utf-8')
          else:
              Path('task-subsystem-migration-error.txt').unlink(missing_ok=True)
              Path('.task-subsystem-migration-succeeded').write_text('ok\n', encoding='utf-8')
              Path('.github/workflows/run-task-subsystem-removal.yml').unlink(missing_ok=True)
          PY

          if [ -f .task-subsystem-migration-succeeded ]; then
            rm .task-subsystem-migration-succeeded
            banned='aletheia\.agent_workflow|agent_tasks_db|aletheia agent workflow|Task Lite|\.agent/tasks|\.agent/handoffs|scripts/agent_bootstrap\.py|scripts/agent_task\.py|agent_workflow_contract|agent_session_independent_workflow|workflow_tasks_db|workflow_claims_db|test_agent_workflow'
            git grep -nE "$banned" -- ':!docs/_ai/DECISIONS.md' > task-subsystem-leftovers.txt || true
            git diff --check
          fi

      - name: Commit and push result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor: remove repository task subsystem"
          git push origin HEAD:${{ github.head_ref }}

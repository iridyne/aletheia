<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
<title>登录 · ALETHEIA</title>
<style>
  :root{
    --bg:#080b12;
    --bg2:#0d111b;
    --panel:#141a28;
    --panel2:#1a2133;
    --line:#283047;
    --line2:#36415d;
    --text:#f3f6fc;
    --muted:#aab4c6;
    --faint:#7e8aa0;
    --soft:#c4ccdb;
    --accent:#5b8cff;
    --accent2:#9a78ff;
    --accent2-soft:#bda7ff;
    --accent-glow:rgba(91,140,255,.40);
    --success:#3ecf8e;
    --success-soft:#6ee7b0;
    --danger:#ff6b6b;
    --radius:18px;
    --radius-sm:12px;
    --shadow:0 24px 60px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.45);
    font-synthesis:none;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
    overflow:hidden;
  }

  /* ===== Background layers ===== */
  .stage{
    position:fixed;inset:0;
    background:
      radial-gradient(900px 520px at 82% 112%, rgba(154,120,255,.20), transparent 60%),
      radial-gradient(680px 420px at 8% -8%, rgba(91,140,255,.20), transparent 60%),
      var(--bg);
  }
  .grid-bg{
    position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(91,140,255,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(91,140,255,.055) 1px, transparent 1px);
    background-size:46px 46px;
    mask-image: radial-gradient(ellipse at 50% 45%, black 32%, transparent 78%);
    -webkit-mask-image: radial-gradient(ellipse at 50% 45%, black 32%, transparent 78%);
    pointer-events:none;
  }
  .orbs{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .orb{position:absolute;border-radius:50%;filter:blur(64px);opacity:.5;animation:float 16s ease-in-out infinite}
  .orb.a{width:300px;height:300px;background:radial-gradient(circle,#5b8cff,transparent 70%);top:-90px;left:-90px}
  .orb.b{width:400px;height:400px;background:radial-gradient(circle,#9a78ff,transparent 70%);bottom:-130px;right:-110px;animation-delay:-8s}
  .bleed{
    position:fixed;right:0;bottom:0;width:46vw;height:46vh;pointer-events:none;
    background:radial-gradient(ellipse at 100% 100%, rgba(176,110,255,.22), transparent 62%);
    mix-blend-mode:screen;
  }
  @keyframes float{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(22px,-30px) scale(1.05)}
  }

  /* ===== Layout ===== */
  .shell{
    position:relative;z-index:2;
    height:100%;
    display:grid;
    grid-template-columns: 1.08fr 1fr;
  }
  @media (max-width: 900px){
    .shell{grid-template-columns:1fr}
    .hero{display:none}
  }

  /* ===== Hero (left) ===== */
  .hero{
    display:flex;flex-direction:column;
    padding:46px 56px;
    position:relative;
    min-height:0;
  }
  .topbar{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .brand{display:flex;align-items:center;gap:12px}
  .mark{
    width:42px;height:42px;border-radius:11px;display:grid;place-items:center;
    background:linear-gradient(135deg,#5b8cff,#9a78ff);
    color:#fff;font-weight:800;font-size:20px;
    box-shadow:0 8px 24px rgba(91,140,255,.45);
    position:relative;
  }
  .mark::after{
    content:"";position:absolute;inset:-2px;border-radius:13px;
    background:linear-gradient(135deg,rgba(91,140,255,.6),rgba(154,120,255,.6));
    filter:blur(8px);opacity:.6;z-index:-1;
  }
  .name{font-weight:700;letter-spacing:1.2px;font-size:15px}
  .sub{color:var(--faint);font-size:12px;letter-spacing:.5px;margin-top:2px}

  /* Language switch */
  .lang-switch{
    display:inline-flex;align-items:center;gap:2px;
    background:rgba(13,17,27,.7);
    border:1px solid var(--line);
    border-radius:20px;padding:3px;
    backdrop-filter:blur(8px);
  }
  .lang-switch button{
    border:none;background:transparent;cursor:pointer;
    color:var(--faint);font-size:12px;font-weight:600;letter-spacing:.4px;
    padding:5px 11px;border-radius:16px;transition:.18s;font-family:inherit;
  }
  .lang-switch button.active{
    color:#fff;
    background:linear-gradient(135deg,rgba(91,140,255,.9),rgba(154,120,255,.9));
    box-shadow:0 4px 12px rgba(91,140,255,.35);
  }
  .lang-switch button:not(.active):hover{color:var(--muted)}

  .pitch{margin-top:auto;margin-bottom:auto;max-width:540px;width:100%}
  .hero h1{
    font-size:42px;font-weight:800;line-height:1.18;letter-spacing:-.5px;
    background:linear-gradient(180deg,#ffffff,#d7deec);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero h1 .grad{
    background:linear-gradient(135deg,#7ea2ff,#b79bff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero .lead{margin-top:18px;color:var(--muted);font-size:16px;line-height:1.75;max-width:500px}

  /* Live visualization */
  .viz-wrap{
    margin-top:26px;
    position:relative;
    border:1px solid var(--line);
    border-radius:14px;
    background:linear-gradient(180deg, rgba(20,26,40,.55), rgba(11,15,24,.55));
    padding:10px 12px 6px;
    overflow:hidden;
  }
  .viz-label{
    display:flex;align-items:center;gap:8px;
    font-size:11px;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--accent2-soft);margin-bottom:4px;font-weight:600;
  }
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--success);box-shadow:0 0 10px var(--success);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
  #viz{display:block;width:100%;height:140px}

  /* Performance dashboard */
  .stats{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:14px;margin-top:24px;
    border-top:1px solid var(--line);
    padding-top:22px;
  }
  .stat{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
  .ico-stat{
    width:40px;height:40px;border-radius:11px;display:grid;place-items:center;
    background:rgba(91,140,255,.10);
    border:1px solid rgba(91,140,255,.28);
    color:var(--accent);
  }
  .stat .n{font-size:24px;font-weight:800;letter-spacing:-.4px;color:var(--text)}
  .stat .l{font-size:12.5px;color:var(--muted);letter-spacing:.4px;margin-top:2px}

  .foot{margin-top:30px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .status-link{
    display:inline-flex;align-items:center;gap:8px;
    color:var(--success-soft);font-size:13px;font-weight:600;
    text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(110,231,176,.5);
    transition:.18s;
  }
  .status-link:hover{color:#9ff0c8;text-decoration-color:rgba(159,240,200,.9)}
  .status-link .dot{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 10px var(--success);animation:pulse 2s ease-in-out infinite}
  .status-extra{color:var(--faint);font-size:12.5px}

  /* ===== Form side (right) ===== */
  .form-side{
    display:flex;align-items:center;justify-content:center;
    padding:46px 40px;
    position:relative;
  }
  .card{
    width:100%;max-width:410px;
    background:linear-gradient(180deg, rgba(20,26,40,.88), rgba(13,17,27,.9));
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:34px 32px 26px;
    box-shadow:var(--shadow);
    position:relative;
  }
  .card::before{
    content:"";position:absolute;inset:0;border-radius:var(--radius);
    padding:1px;
    background:linear-gradient(135deg, rgba(91,140,255,.45), transparent 42%, rgba(154,120,255,.35));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;
    pointer-events:none;
  }

  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}
  .card-head h2{font-size:21px;font-weight:800;letter-spacing:-.3px}
  .secure-badge{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;font-weight:700;letter-spacing:1.2px;color:#dff0ff;
    background:linear-gradient(135deg, rgba(91,140,255,.18), rgba(154,120,255,.18));
    border:1px solid rgba(120,160,255,.5);
    padding:7px 13px;border-radius:20px;white-space:nowrap;
    box-shadow:0 0 0 1px rgba(120,160,255,.08) inset, 0 4px 14px rgba(91,140,255,.18);
  }
  .card .sub-hint{color:var(--muted);font-size:13.5px;margin:6px 0 20px;line-height:1.6}

  /* Fields */
  .field{margin-bottom:14px;position:relative}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:8px;font-weight:600;letter-spacing:.2px}
  .input-wrap{position:relative}
  .input-wrap .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none;transition:color .2s}
  .field input{
    width:100%;padding:13px 46px 13px 42px;border-radius:var(--radius-sm);
    background:rgba(8,11,18,.65);
    border:1px solid var(--line2);
    color:var(--text);font-size:14.5px;outline:none;
    transition:border-color .15s, box-shadow .15s, background .15s;
    font-family:inherit;
  }
  .field input::placeholder{color:var(--faint);font-size:13.5px}
  .field input:hover{border-color:#465270}
  .field input:focus{border-color:var(--accent);background:rgba(8,11,18,.9);box-shadow:0 0 0 4px var(--accent-glow), 0 0 18px rgba(91,140,255,.25)}
  .field input:focus + .ico-end{color:var(--accent)}
  .ico-end{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--muted);cursor:pointer;padding:7px;border-radius:7px;transition:color .2s, background .2s}
  .ico-end:hover{color:var(--text);background:rgba(255,255,255,.07)}

  .row-between{display:flex;align-items:center;justify-content:space-between;margin:4px 0 20px}
  .remember{display:flex;align-items:center;gap:9px;font-size:13.5px;color:var(--muted);cursor:pointer;user-select:none}
  .remember input{appearance:none;-webkit-appearance:none;width:17px;height:17px;border:1.5px solid var(--line2);border-radius:5px;background:transparent;cursor:pointer;position:relative;transition:.15s;flex:none}
  .remember input:checked{background:var(--accent);border-color:var(--accent)}
  .remember input:checked::after{content:"";position:absolute;left:5px;top:2px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
  .forgot{font-size:13.5px;color:var(--accent2-soft);text-decoration:none;font-weight:600;transition:color .2s}
  .forgot:hover{color:#d6c6ff;text-decoration:underline;text-underline-offset:3px}

  .btn-primary{
    width:100%;padding:13px;border:none;border-radius:var(--radius-sm);
    font-size:14.5px;font-weight:700;letter-spacing:.6px;cursor:pointer;color:#fff;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 6px 18px rgba(91,140,255,.35);
    transition:transform .12s, box-shadow .15s, filter .15s;
    position:relative;overflow:hidden;font-family:inherit;
  }
  .btn-primary:hover{filter:brightness(1.08);box-shadow:0 8px 24px rgba(91,140,255,.5)}
  .btn-primary:active{transform:translateY(1px)}
  .btn-primary[disabled]{opacity:.7;cursor:wait}
  .btn-primary .spinner{display:none;width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:0 auto}
  .btn-primary.loading .label{display:none}
  .btn-primary.loading .spinner{display:block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn-primary::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.18), transparent);
    transform:translateX(-100%);transition:transform .5s;
  }
  .btn-primary:hover::before{transform:translateX(100%)}

  .key-hint{
    text-align:center;
    font-size:12.5px;color:var(--muted);
    display:flex;align-items:center;justify-content:center;gap:7px;
    margin-top:14px;
  }
  .key-hint kbd{
    font-family:inherit;background:rgba(28,35,52,.9);
    border:1px solid var(--line2);
    padding:2px 7px;border-radius:6px;font-size:11px;color:var(--soft);
  }

  .trial-sub{text-align:center;color:var(--faint);font-size:12.5px;margin-top:18px}
  .btn-ghost{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;margin-top:8px;padding:11px;border-radius:var(--radius-sm);
    font-size:13.5px;font-weight:600;letter-spacing:.3px;cursor:pointer;
    color:var(--muted);text-decoration:none;
    background:rgba(255,255,255,.03);
    border:1px solid var(--line2);
    transition:.18s;font-family:inherit;
  }
  .btn-ghost:hover{color:var(--text);border-color:var(--accent);background:rgba(91,140,255,.08)}

  /* Error */
  .err{
    display:none;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.35);
    color:#ff9b9b;font-size:13px;padding:10px 13px;border-radius:var(--radius-sm);
    margin-bottom:14px;align-items:center;gap:8px;
  }
  .err.show{display:flex;animation:shake .35s ease-in-out}
  .err svg{flex:none}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

  /* Trust & compliance footer */
  .trust{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}
  .trust-badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .tbadge{
    display:inline-flex;align-items:center;gap:6px;
    font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--soft);
    background:rgba(28,35,52,.6);
    border:1px solid var(--line2);
    padding:6px 11px;border-radius:9px;
  }
  .tbadge svg{flex:none;color:var(--accent)}
  .foot-note{text-align:center;color:var(--soft);font-size:12.5px;margin-top:16px;line-height:1.7}
  .foot-note a{color:var(--muted);text-decoration:none;border-bottom:1px dashed var(--line2)}
  .foot-note a:hover{color:var(--accent)}
  .foot-note .ver{color:var(--muted);font-size:12px;letter-spacing:.3px}
</style>
</head>
<body>
  <div class="stage"></div>
  <div class="grid-bg"></div>
  <div class="orbs">
    <div class="orb a"></div>
    <div class="orb b"></div>
  </div>
  <div class="bleed"></div>

  <div class="shell">
    <!-- LEFT: Brand & atmosphere -->
    <section class="hero">
      <header class="topbar">
        <div class="brand">
          <div class="mark">◆</div>
          <div>
            <div class="name">ALETHEIA</div>
            <div class="sub">trading os · v2.0</div>
          </div>
        </div>
        <div class="lang-switch" role="group" aria-label="language">
          <button type="button" data-lang="zh" class="active">中文</button>
          <button type="button" data-lang="en">EN</button>
        </div>
      </header>

      <div class="pitch">
        <h1 data-i18n-h="h1">让每一笔交易<br/>都有<span class="grad">据可循</span></h1>
        <p class="lead" data-i18n="lead">统一管理策略、订单、风控与日志。一个指挥台，连接所有环节，让你的量化机器人始终在你掌控之内。</p>

        <div class="viz-wrap">
          <div class="viz-label"><span class="live-dot"></span><span data-i18n="vizLabel">实时策略运行中</span></div>
          <canvas id="viz"></canvas>
        </div>

        <div class="stats">
          <div class="stat">
            <div class="ico-stat">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </div>
            <div class="n" data-i18n="stat1n">24/7</div>
            <div class="l" data-i18n="stat1l">自动运行</div>
          </div>
          <div class="stat">
            <div class="ico-stat">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
            </div>
            <div class="n" data-i18n="stat2n">&lt; 50ms</div>
            <div class="l" data-i18n="stat2l">响应延迟</div>
          </div>
          <div class="stat">
            <div class="ico-stat">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 3a9 9 0 019 9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12 7a5 5 0 015 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="12" cy="12" r="2.2" fill="currentColor"/></svg>
            </div>
            <div class="n" data-i18n="stat3n">3</div>
            <div class="l" data-i18n="stat3l">监控市场</div>
          </div>
        </div>
      </div>

      <div class="foot">
        <a class="status-link" href="#" onclick="event.preventDefault()"><span class="dot"></span><span data-i18n="statusText">所有系统运行正常</span></a>
        <span class="status-extra" data-i18n="statusExtra">· 已加密连接</span>
      </div>
    </section>

    <!-- RIGHT: Login form -->
    <section class="form-side">
      <div class="card">
        <div class="card-head">
          <h2 data-i18n="cardTitle">欢迎回来</h2>
          <span class="secure-badge">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="3.3" y="7" width="9.4" height="7" rx="1.6" stroke="currentColor" stroke-width="1.5"/><path d="M5.3 7V5a2.7 2.7 0 015.4 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            SECURE
          </span>
        </div>
        <div class="sub-hint" data-i18n="cardSub">登录以访问你的指挥台与交易工作区</div>

        <div class="err" id="errBox">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 5v4M8 11h.01M2.667 13.333L8 2.667l5.333 10.666H2.667z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span id="errText">访问口令不正确</span>
        </div>

        <form id="loginForm" autocomplete="on">
          <div class="field">
            <label for="pass" data-i18n="passLabel">访问口令</label>
            <div class="input-wrap">
              <input id="pass" name="password" type="password" placeholder="输入团队共享口令" autocomplete="current-password" />
              <svg class="ico" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3.333 7.333h9.334v7.334H3.333V7.333zM5.333 7.333V5.333a2.667 2.667 0 015.334 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span class="ico-end" id="eyeToggle" title="显示口令" role="button" aria-label="显示或隐藏口令">
                <svg id="eyeOn" width="18" height="18" viewBox="0 0 16 16" fill="none"><path d="M1.333 8s2-4.667 6.667-4.667S14.667 8 14.667 8s-2 4.667-6.667 4.667S1.333 8 1.333 8z" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.5"/></svg>
                <svg id="eyeOff" width="18" height="18" viewBox="0 0 16 16" fill="none" style="display:none"><path d="M2 2l12 12M5.667 5.667C3.5 7 1.333 10 1.333 10s2 4.667 6.667 4.667c1.5 0 2.8-.4 3.867-1M6.667 6.667A2 2 0 008 11a2 2 0 001.667-.667M9.667 5.333A2 2 0 008 5a2 2 0 00-1 .267" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              </span>
            </div>
          </div>

          <div class="row-between">
            <label class="remember"><input id="remember" type="checkbox" checked /> <span data-i18n="remember">30 天内免登录</span></label>
            <a class="forgot" href="#" onclick="event.preventDefault();alert('请联系管理员重置团队口令')" data-i18n="forgot">忘记口令？</a>
          </div>

          <button class="btn-primary" id="loginBtn" type="submit">
            <span class="label" data-i18n="loginBtn">登 录</span>
            <div class="spinner"></div>
          </button>

          <div class="key-hint" data-i18n="keyHint">按 <kbd>Enter</kbd> 登录</div>

          <div class="trial-sub" data-i18n="trialSub">还没有访问权限？</div>
          <a class="btn-ghost" href="#" onclick="event.preventDefault()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span data-i18n="trialBtn">新用户注册 / 申请试用</span>
          </a>
        </form>

        <div class="trust">
          <div class="trust-badges">
            <span class="tbadge">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="3.3" y="7" width="9.4" height="7" rx="1.6" stroke="currentColor" stroke-width="1.5"/><path d="M5.3 7V5a2.7 2.7 0 015.4 0v2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
              SSL
            </span>
            <span class="tbadge">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M8 1.5l5 2v4c0 3.2-2.1 5.4-5 6.5-2.9-1.1-5-3.3-5-6.5v-4l5-2z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
              BANK-GRADE
            </span>
            <span class="tbadge">
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              SOC2
            </span>
          </div>
          <div class="foot-note">
            <span data-i18n="footerTerms">登录即代表你同意 <a href="#" onclick="event.preventDefault()">服务条款</a> 与 <a href="#" onclick="event.preventDefault()">隐私政策</a></span><br/>
            <span class="ver" data-i18n="version">v2.0.0 · 服务器 124.220.28.165</span>
          </div>
        </div>
      </div>
    </section>
  </div>

<script>
  /* ===== i18n (ZH / EN) ===== */
  const I18N = {
    zh:{
      h1:'让每一笔交易<br/>都有<span class="grad">据可循</span>',
      lead:'统一管理策略、订单、风控与日志。一个指挥台，连接所有环节，让你的量化机器人始终在你掌控之内。',
      vizLabel:'实时策略运行中',
      stat1n:'24/7', stat1l:'自动运行',
      stat2n:'< 50ms', stat2l:'响应延迟',
      stat3n:'3', stat3l:'监控市场',
      statusText:'所有系统运行正常', statusExtra:'· 已加密连接',
      cardTitle:'欢迎回来', cardSub:'登录以访问你的指挥台与交易工作区',
      passLabel:'访问口令', passPlaceholder:'输入团队共享口令',
      remember:'30 天内免登录', forgot:'忘记口令？',
      loginBtn:'登 录', keyHint:'按 <kbd>Enter</kbd> 登录',
      trialSub:'还没有访问权限？', trialBtn:'新用户注册 / 申请试用',
      footerTerms:'登录即代表你同意 <a href="#" onclick="event.preventDefault()">服务条款</a> 与 <a href="#" onclick="event.preventDefault()">隐私政策</a>',
      version:'v2.0.0 · 服务器 124.220.28.165'
    },
    en:{
      h1:'Every trade,<br/><span class="grad">accountable</span>',
      lead:'Unified strategy, orders, risk and logs. One command center connecting every piece — your quant bots, always under control.',
      vizLabel:'LIVE STRATEGY',
      stat1n:'24/7', stat1l:'Always-on',
      stat2n:'< 50ms', stat2l:'Latency',
      stat3n:'3', stat3l:'Markets',
      statusText:'All systems operational', statusExtra:'· Encrypted',
      cardTitle:'Welcome back', cardSub:'Sign in to your command center & trading workspace',
      passLabel:'Access pass', passPlaceholder:'Enter team shared pass',
      remember:'Stay signed in for 30 days', forgot:'Forgot pass?',
      loginBtn:'Sign in', keyHint:'Press <kbd>Enter</kbd> to sign in',
      trialSub:'No access yet?', trialBtn:'Sign up / Request a trial',
      footerTerms:'By signing in you agree to <a href="#" onclick="event.preventDefault()">Terms</a> & <a href="#" onclick="event.preventDefault()">Privacy</a>',
      version:'v2.0.0 · server 124.220.28.165'
    }
  };
  function setLang(lang){
    const d = I18N[lang] || I18N.zh;
    document.documentElement.lang = (lang === 'zh') ? 'zh-CN' : 'en';
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const k = el.getAttribute('data-i18n');
      if (d[k] !== undefined) el.innerHTML = d[k];
    });
    document.querySelectorAll('[data-i18n-h]').forEach(el=>{
      const k = el.getAttribute('data-i18n-h');
      if (d[k] !== undefined) el.innerHTML = d[k];
    });
    const ph = document.getElementById('pass');
    if (ph && d.passPlaceholder) ph.placeholder = d.passPlaceholder;
    document.querySelectorAll('.lang-switch button').forEach(b=>{
      b.classList.toggle('active', b.getAttribute('data-lang') === lang);
    });
    try { localStorage.setItem('aletheia_lang', lang); } catch(e){}
  }
  document.querySelectorAll('.lang-switch button').forEach(b=>{
    b.addEventListener('click', ()=> setLang(b.getAttribute('data-lang')));
  });
  (function(){
    let saved = 'zh';
    try { saved = localStorage.getItem('aletheia_lang') || 'zh'; } catch(e){}
    setLang(saved);
  })();

  /* ===== Live data visualization ===== */
  (function(){
    const canvas = document.getElementById('viz');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    let W=0, H=0, dpr=1;
    const N = 64;
    let data = [];
    for (let i=0;i<N;i++) data.push(0.5);
    let phase = Math.random()*10;
    const markers = []; // {x, y, type:'buy'|'sell', life}

    function resize(){
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      const r = canvas.getBoundingClientRect();
      W = Math.max(1, r.width); H = Math.max(1, r.height);
      canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
      ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    function step(){
      phase += 0.07;
      const last = data[data.length-1];
      const target = 0.5 + Math.sin(phase)*0.16 + Math.sin(phase*0.37)*0.09 + (Math.random()-0.5)*0.05;
      const nv = last + (target-last)*0.18;
      data.push(nv);
      if (data.length > N) data.shift();
    }
    function spawnMarkers(){
      // mark local extrema as buy/sell triangles
      const n = data.length;
      if (n < 4) return;
      const a = data[n-3], b = data[n-2], c = data[n-1];
      if (b < a && b < c && Math.random() < 0.5){
        markers.push({idx:n-2, type:'buy', life:1});
      } else if (b > a && b > c && Math.random() < 0.5){
        markers.push({idx:n-2, type:'sell', life:1});
      }
      if (markers.length > 8) markers.shift();
    }
    function draw(){
      ctx.clearRect(0,0,W,H);
      const pad = 6;
      const usableH = H - pad*2;
      const pts = data.map((v,i)=>({
        x: (i/(N-1))*W,
        y: pad + usableH*0.5 - (v-0.5)*usableH*0.78
      }));

      // faint grid
      ctx.strokeStyle = 'rgba(91,140,255,0.06)';
      ctx.lineWidth = 1;
      for (let gx=0; gx<=W; gx+=W/6){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,H); ctx.stroke(); }
      ctx.beginPath(); ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); ctx.stroke();

      // data streams (faint moving vertical ticks)
      const t = performance.now()/1000;
      ctx.strokeStyle = 'rgba(154,120,255,0.10)';
      for (let i=0;i<7;i++){
        const sx = ((t*30 + i*60) % (W+40)) - 20;
        ctx.beginPath(); ctx.moveTo(sx, 0); ctx.lineTo(sx, H); ctx.stroke();
      }

      // moving average line with glow
      const grad = ctx.createLinearGradient(0,0,W,0);
      grad.addColorStop(0, 'rgba(91,140,255,0.9)');
      grad.addColorStop(1, 'rgba(154,120,255,0.95)');
      ctx.save();
      ctx.shadowColor = 'rgba(120,150,255,0.55)';
      ctx.shadowBlur = 12;
      ctx.strokeStyle = grad;
      ctx.lineWidth = 2;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      pts.forEach((p,i)=>{ i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y); });
      ctx.stroke();
      ctx.restore();

      // area fill under line
      ctx.save();
      const fill = ctx.createLinearGradient(0,0,0,H);
      fill.addColorStop(0,'rgba(91,140,255,0.16)');
      fill.addColorStop(1,'rgba(91,140,255,0)');
      ctx.beginPath();
      pts.forEach((p,i)=>{ i ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y); });
      ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath();
      ctx.fillStyle = fill; ctx.fill();
      ctx.restore();

      // buy/sell glowing triangles at extrema
      markers.forEach(m=>{
        const p = pts[m.idx];
        if (!p) return;
        const size = 5.5;
        ctx.save();
        ctx.globalAlpha = Math.max(0, m.life);
        ctx.shadowBlur = 10;
        if (m.type === 'buy'){
          ctx.shadowColor = 'rgba(62,207,142,0.9)';
          ctx.fillStyle = '#3ecf8e';
          ctx.beginPath();
          ctx.moveTo(p.x, p.y - size - 3);
          ctx.lineTo(p.x - size, p.y - 3);
          ctx.lineTo(p.x + size, p.y - 3);
          ctx.closePath(); ctx.fill();
        } else {
          ctx.shadowColor = 'rgba(255,107,107,0.9)';
          ctx.fillStyle = '#ff6b6b';
          ctx.beginPath();
          ctx.moveTo(p.x, p.y + size + 3);
          ctx.lineTo(p.x - size, p.y + 3);
          ctx.lineTo(p.x + size, p.y + 3);
          ctx.closePath(); ctx.fill();
        }
        ctx.restore();
        m.life -= 0.006;
      });
      for (let i=markers.length-1;i>=0;i--){ if (markers[i].life <= 0) markers.splice(i,1); }
    }

    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    resize();
    window.addEventListener('resize', resize);
    if (reduce){
      for (let i=0;i<8;i++) step();
      draw();
    } else {
      function loop(){ step(); if (Math.random()<0.5) spawnMarkers(); draw(); requestAnimationFrame(loop); }
      requestAnimationFrame(loop);
    }
  })();

  /* ===== Login form ===== */
  const errBox = document.getElementById('errBox');
  const errText = document.getElementById('errText');
  function showErr(msg){ errText.textContent = msg; errBox.classList.remove('show'); void errBox.offsetWidth; errBox.classList.add('show'); }
  function hideErr(){ errBox.classList.remove('show'); }

  const eye = document.getElementById('eyeToggle');
  eye.addEventListener('click', () => {
    const p = document.getElementById('pass');
    const on = document.getElementById('eyeOn');
    const off = document.getElementById('eyeOff');
    if (p.type === 'password') { p.type = 'text'; on.style.display='none'; off.style.display='block'; }
    else { p.type = 'password'; on.style.display='block'; off.style.display='none'; }
  });

  setTimeout(() => { try { document.getElementById('pass').focus(); } catch(e){} }, 100);

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('loginBtn');
    btn.classList.add('loading'); btn.disabled = true;
    hideErr();
    const password = document.getElementById('pass').value;
    const remember = document.getElementById('remember').checked;
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password, remember }),
      });
      if (res.ok) {
        const params = new URLSearchParams(location.search);
        location.href = params.get('next') || '/';
        return;
      }
      showErr('访问口令不正确');
    } catch (err) {
      showErr('网络错误，请稍后重试');
    } finally {
      btn.classList.remove('loading'); btn.disabled = false;
    }
  });
</script>
</body>
</html>

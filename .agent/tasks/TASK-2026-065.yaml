id: TASK-2026-065
title: Startup Behavior Gate
status: done
packet_type: standard
scope:
  boundary: declare before implementation
  excluded: runtime facts and credentials
intent: Hold AI decisions and new trading paused at Gateway startup until ground-truth
  checks pass; on failure keep essential data jobs running under a layered pause,
  record a durable blocker, gate pi_daemon, surface the reason in Health/Doctor, and
  periodically recheck to resume.
acceptance:
- Gateway boots API/Dashboard/essential data jobs while AI decisions + new trading
  stay paused until checks pass (migrations, SQLite integrity/FK, config vs active
  runtime scope, exchange sync or paper_internal, no unexplained pending orders/closes,
  no active reconciliation incident, learning influence/lifecycle/allowlist consistent,
  no user pause/kill switch).
- 'On failure: layered pause keeps essential jobs running; durable blocker persisted
  and survives restart; audited; pi_daemon does not start; periodic recheck resumes
  when clear.'
- A human pause / kill switch is never auto-resumed (paused_by_gate marker).
- Blocker reason surfaced in /api/health and doctor; config flag default off.
- Focused gate tests, layered-pause tests, specs, and architecture remain green.

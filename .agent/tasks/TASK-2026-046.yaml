id: TASK-2026-046
title: Prove outcome integrity across the full lifecycle
status: done
packet_type: standard
scope:
  boundary: deterministic isolated-DB E2E tests spanning paper/local reconciliation,
    durable disappearance restart/idempotency, verified and administrative close routing,
    paper cash, Risk account-loss availability, Learning eligibility/refreeze, raw/genuine
    reporting, history-remediation repeatability, three-broker protocol coverage inventory,
    OI-C06 final claim and completion audit docs
  excluded: production behavior changes unless a focused failure proves one in this
    exact lifecycle, real network/exchange calls, live unlock or order placement,
    risk limits, credentials, owner runtime database mutation, applying history remediation
    or cash compensation, gateway restart, frontend changes, and paper soak claims
    not actually run
intent: Add deterministic cross-layer end-to-end coverage for reconciliation, verified/admin
  close routing, cash, Risk, Learning, reporting, restart/idempotency and historical
  remediation without placing orders, enabling live mode, mutating owner runtime data,
  or changing production behavior unless a focused test proves an in-scope defect.
acceptance:
- One cross-layer verified-close scenario proves exact fill economics flow once into
  position, paper cash, authoritative account loss, verified reporting and Learning
  while raw/genuine counts agree and repeat close is idempotent.
- One cross-layer administrative-close scenario proves no fees/PnL/cash/outcome hooks,
  exclusion from judgement/Learning/genuine curve, explicit raw exclusion, and Risk
  unavailability without fabricated threshold breach or kill-switch trip.
- Reconciliation coverage proves paper_internal ignores external emptiness, one complete
  miss only records durable evidence, restart preserves it, wrong-account/incomplete/regressed
  views do not advance it, live remains alert-only, and adopted/native reopen share
  the incident/refreeze path.
- Verified-exit protocol coverage remains present for Bitget, OKX and Binance; incomplete
  or absent evidence cannot become a genuine close.
- Repeated history remediation creates no duplicate classification/supersession and
  never applies compensation; OI-C06, architecture, controlled Risk/execution specs
  and the full suite pass.
- Final docs distinguish automated E2E proof from any unrun real paper soak; no live/risk/credential/
  runtime behavior or original history changes.

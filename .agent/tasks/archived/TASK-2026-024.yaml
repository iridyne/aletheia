id: TASK-2026-024
title: Fix Learning producer continuity and enable gate
status: done
packet_type: standard
scope:
  boundary: declare before implementation
  excluded: runtime facts and credentials
intent: Make the human Learning enable switch govern all autonomous Learning mutation
  jobs, add durable job-health recording and single-window catch-up semantics, and
  prevent producer/reviewer backlog drift without changing trading behavior.
acceptance:
- All autonomous Learning mutation jobs share the backend autonomous_learning gate.
- Measurement-only outcome and shadow settlement continue while Learning is disabled.
- Missed daily Learning windows catch up once per durable date key and retry after
  failure.
- Producer/reviewer success, failure, watermark, and backlog health persist durably.
- Stalled or stale reviewer health refreezes new automatic guard promotion without
  changing existing guards.

id: TASK-2026-050
title: Explain every trade entry and exit decision
status: done
packet_type: standard
scope:
  boundary: declare before implementation
  excluded: runtime facts and credentials
intent: Extend the opportunity causal chain into trade entry and close decisions.
  Record and display evidence-backed reasons for entry price, take-profit, stop-loss,
  account risk/notional, leverage, and close action without changing risk limits,
  execution semantics, credentials, or live-trading controls.
acceptance:
- For every System Operator entry, persist five labelled explanations (entry, stop,
  target, notional, leverage) with final values and value source; preserve ordinary
  proposal/risk/execution semantics.
- For every closure path, persist an honest exit explanation that differentiates AI,
  automatic protective, manual, and reconciliation causes; never invent an AI rationale.
- Render the persisted entry and exit explanations in the existing trade causal-chain
  drawer; historical/missing evidence must be visibly labelled as not recorded.
- Add focused behavior and spec tests, build the frontend, run applicable specs/architecture
  checks, verify task evidence, then merge the dedicated branch to master.

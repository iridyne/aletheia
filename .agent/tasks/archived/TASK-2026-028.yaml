id: TASK-2026-028
title: Enforce exchange order constraints before submission
status: done
packet_type: standard
scope:
  boundary: execution gateway order-size preparation only
  excluded: credentials, signer logic, live unlock, and risk-limit changes
intent: Prevent real exchange orders below the executable venue minimum quantity,
  amount, or increment, and reject when executable rules are unavailable or stale.
acceptance:
- Real exchange modes obtain constraints from their own executable venue, not the
  market-data venue.
- Before risk evaluation, quantity is rounded up to the venue increment and meets
  minimum quantity and minimum notional; the adjusted value is what risk evaluates
  and submits.
- Unknown, unavailable, stale, or unsupported venue constraints reject exchange execution
  without placing an order; paper_internal behavior remains unchanged.
- Focused tests cover venue mapping, quantities below minimum, increment rounding,
  minimum notional, unavailable rules, risk receiving the adjusted quantity, and no
  exchange call on rejection.

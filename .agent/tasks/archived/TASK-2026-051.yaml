id: TASK-2026-051
title: Make the active trading mainline executable and replayable
status: done
packet_type: standard
scope:
  boundary: declare before implementation
  excluded: runtime facts and credentials
intent: 'Implement the five requested runtime assurance layers in order: a machine-checkable
  active runtime scope, a deterministic real-SQLite golden path, production reachability
  tests, a sanitized replay fixture with explicit baselines, and a behavior-authority
  registry enforced at consumers; preserve existing risk, execution, credential, and
  live-trading semantics.'
acceptance:
- A machine-readable active runtime scope fixes crypto paper_internal as the admitted
  mainline and architecture checks prevent scanner, Learning, Guard, Operator, UI,
  Risk, execution, and causal-link bypasses.
- A deterministic System Operator fixture drives one BTC/USDT opportunity through
  real migrations, SQLite, repositories, Risk, paper execution, verified close, genuine
  outcome, and review without mocking intermediate business modules.
- Production reachability tests prove scheduler outcome settlement and a registered
  Learning consumer create real downstream rows linked to exact net outcomes.
- A sanitized fixed runtime replay SQLite pack and explicit baseline compare candidate,
  decision, proposal, approval, position, genuine-outcome, and Learning-authority
  metrics.
- A small behavior-authority registry declares allowed and forbidden paper-candidate
  blockers, and executable checks require every behavior consumer to use it.

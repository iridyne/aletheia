scope:
  boundary: outcome cohort reporting summary, inspect status/pnl, analytics trade-stats/strategy/equity/trade-insights/cost
    responses, existing Overview and Trades analytics components, nullable/unavailable
    formatting, dual raw/genuine curve labels, frontend API types, focused API/CLI/UI

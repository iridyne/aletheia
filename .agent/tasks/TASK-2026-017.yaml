id: TASK-2026-017
title: Tolerate squash-merged evidence commits in strict check
status: in_progress
packet_type: standard
scope:
  boundary: declare before implementation
  excluded: runtime facts and credentials
intent: Completed-task verification evidence recorded on a feature branch becomes
  unreachable from master after a squash-merge, so workflow check --strict hard-fails
  for every previously-merged task. Downgrade the still-exists-but-unreachable case
  to a warning (the work was genuinely verified when recorded); keep a hard error
  only when the evidence commit does not exist at all. Mirrors the AW-S08 base_commit
  rebase-resilience precedent.
acceptance:
- validate(strict=True) emits a WARNING (not error) when a completed task's best evidence
  commit exists in the repo but is not a HEAD ancestor (squash-merge orphan)
- validate(strict=True) still emits an ERROR when a completed task's evidence commit
  does not exist in the repo at all (fabricated/typo)
- validate(strict=True) still emits an ERROR when a completed task has no successful
  evidence at all
- check --strict on current master (TASK-012..015 orphaned) exits 0 with warnings,
  not errors
- 'New unit tests cover: reachable=ok, exists-but-unreachable=warning, nonexistent=error;
  plus a spec claim documents the tolerance'

title: Refreeze Learning on reconciliation integrity incidents
status: in_progress
packet_type: standard
scope:
  boundary: reconciliation incident detector and persistence, demo reconcile circuit
    breaker, behavior-changing Learning gates, doctor, focused tests and matching SDD
  excluded: orphan classification, close accounting, exchange queries/clients, PnL/cash,
    Risk behavior or limits, orders, live authority, credentials, gateway restart and
    runtime database mutation
intent: Generalize reconciliation thrash detection from adopted-only reopen rows to
  any scoped native or adopted reopen after an administrative close, persist and deduplicate
  integrity incidents, block destructive reconciliation cycles, globally refreeze
  Learning across restart, and expose honest doctor diagnostics without changing close
  classification or execution behavior.
acceptance:
- The detector matches administrative-close to any reopen using broker/account environment/instrument/direction
  identity; native and adopted sources are explanatory dimensions, not trigger restrictions.
- Integrity incidents are durable, idempotent, survive restart, and are checked before
  destructive reconciliation actions; clean history and isolated one-off events do
  not falsely trip the systemic breaker.
- An active reconciliation-integrity incident globally refreezes every behavior-changing
  Learning path to its baseline while read-only measurement remains available.
- Recovery requires explicit incident resolution plus a clean observation gate; a
  single normal poll or process restart cannot silently unfreeze Learning.
- Doctor reports central administrative categories, incident identity, reopen sources,
  Learning freeze reason, and recovery state honestly.
- OI-B04 and OI-C01 become GREEN with focused unit/integration/spec/doctor tests;
  no orphan classification, close accounting, exchange, Risk, order, live or credential
  behavior changes.

id: TASK-2026-043
title: Separate authoritative Risk account loss
status: in_progress
packet_type: standard
scope:
  boundary: dedicated authoritative account-loss snapshot, local paper-ledger
    reconciliation, verified external close economics, Risk daily-loss adapter,
    unavailable-source fail-closed violation, kill-switch behavior, focused risk
    regressions, OI-C03 and matching risk/execution contracts
  excluded: risk thresholds and capital bases, check ordering beyond replacing the
    daily-loss source, proposal sizing, exchange clients or network requests, order
    execution, live authority, credentials, strategy-performance metrics, API/UI,
    historical mutation/backfill, gateway restart, and runtime database mutation
intent: Replace Risk daily-loss use of ambiguous position performance PnL with an
  authoritative account-loss source that fails closed when account truth is unavailable,
  without changing any risk limit, approval ordering, execution behavior, live authority,
  API/UI, or credentials.
acceptance:
- Risk daily loss calls a dedicated authoritative account-loss source and never imports
  or falls back to today_realized_pnl, eligible strategy PnL, or unverified raw closes.
- Verified economically complete closes contribute their exact signed account result;
  paper_internal results must match the append-only cash ledger before they are usable.
- Administrative, maintenance, legacy, incomplete, mismatched-ledger, or otherwise
  unverified rows make the account-loss snapshot unavailable; they never fabricate a
  max_daily_loss breach or auto-trip the kill switch.
- An unavailable account-loss source adds an explicit blocking Risk violation and is
  never represented as zero/healthy. A genuine loss still triggers the unchanged
  threshold and kill-switch behavior.
- OI-C03 and focused Risk/kill-condition tests are GREEN with no risk-limit, sizing,
  exchange, execution, live-authority, credential, strategy-performance, API/UI, or
  historical-data changes.

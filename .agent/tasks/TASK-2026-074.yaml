id: TASK-2026-074
title: Use one authoritative equity curve on Overview
status: in_progress
packet_type: standard
scope:
  boundary: Portfolio account-equity read model, snapshot API, Overview chart, and their documentation/tests.
  excluded: Risk policy, order execution semantics, exchange integration, credentials, and runtime facts.
intent: Make the Overview account chart read one durable account-equity snapshot source
  in local paper mode, preserving raw-versus-verified analytics outside the main view.
acceptance:
  - Local-paper Overview account value uses ledger cash plus current marked PnL, never position notional.
  - Account-equity snapshots carry explicit account-equity semantics; legacy notional snapshots cannot enter the Overview curve.
  - Overview renders one account-equity series from the account snapshot endpoint; raw and verified PnL remain outside that view.
  - API and data-model documentation plus focused regression tests describe and prove the boundary.

id: TASK-2026-045
title: Remediate polluted outcome history without deletion
status: in_progress
packet_type: standard
scope:
  boundary: dry-run-first maintenance module and CLI, additive classification of unstamped
    closed positions, archival/supersession metadata for polluted derived knowledge,
    versioned clean-window anchor and incident exclusions, paper-cash compensation candidate
    report, outcome-integrity doctor summary, existing API response metadata type,
    focused OI-B05/OI-C05 tests and matching docs
  excluded: deleting or rewriting original close/cash/audit events, applying cash compensation,
    guessing ambiguous legacy exits, rebuilding through LLM/network calls, Risk, execution,
    exchanges, trading decisions, live authority, credentials, config schema, frontend,
    frontend UI/pages, gateway restart, and applying maintenance to the owner runtime database
intent: Add a dry-run-first idempotent history remediation tool, versioned clean-window
  exclusions, derived-artifact supersession, and paper-cash compensation candidates
  without deleting or rewriting original trading, cash, knowledge, or audit records
  and without applying compensation.
acceptance:
- Dry-run and apply produce the same planned classification/archive/candidate counts on one
  immutable snapshot; apply is transactional, additive and idempotent, with no DELETE and no
  mutation of original economic values, close timestamps, cash events or audit events.
- Only deterministic administrative/maintenance reasons are backfilled; ambiguous legacy
  closes remain explicitly ineligible/unverified and are never promoted to strategy outcomes.
- Polluted active derived knowledge is archived, remains queryable for audit, and records a
  durable batch id, reason, prior identity and superseded_by identity/version without deletion.
- Paper cash discrepancies are emitted as owner_approval_required compensation candidates;
  the tool has no path that inserts/applies a compensating capital event.
- A versioned clean-window anchor excludes pre-anchor, incident-window and unknown-version
  rows; post-anchor evidence still uses central outcome eligibility and stays insufficient
  when samples are absent.
- OI-B05/OI-C05 and focused maintenance/doctor tests are GREEN; docs and issue ledger are
  synchronized, with no runtime maintenance apply, Risk/execution/exchange/live/credential
  or original-history mutation.

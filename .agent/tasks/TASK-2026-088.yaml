title: Preserve task verification continuity after rebase
status: done
packet_type: standard
scope:
  boundary: Git-tracked agent-workflow packet validation and task CLI only.
  excluded: trading runtime, Risk, Execution, exchange adapters, Live authority, credentials,
    gateway lifecycle, and any runtime-state mutation.
intent: Allow completed task packets to retain verifiable evidence after a feature
  branch is rebased, without weakening fabricated-evidence detection.
acceptance:
- A completed task that was rebased can record a fresh registered-command proof without
  reopening or rewriting its terminal status.
- The revalidation resets base_commit to the verified implementation HEAD and preserves
  the requirement that the command actually succeeds.
- CI still rejects a changed completed task whose evidence is absent and has not been
  explicitly revalidated.
- Focused workflow tests, executable specification, and strict range validation pass
  in a shallow-clone reproduction of the P0 failure.

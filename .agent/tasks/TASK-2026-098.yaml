id: TASK-2026-098
title: Move all runtime state into per-user .aletheia home
status: done
packet_type: standard
scope:
  boundary: Cross-platform runtime-home resolution, legacy-state migration, development
    preview isolation, local workflow claim storage, release packaging contracts,
    and focused path/integrity tests.
  excluded: Trading decisions, Risk, Execution, exchange adapters, Live authority,
    credential values or signer semantics, scheduler behavior, and database schema
    changes.
intent: Make the default runtime and configuration root platform-agnostic at ~/.aletheia,
  preserve explicit absolute overrides, isolate previews and developer claims, provide
  fail-closed legacy migration, and prove release bundles never write runtime state
  under the source package.
acceptance:
- Without an explicit override, every supported platform resolves application runtime
  and configuration state below the current user's ~/.aletheia directory, independent
  of the checkout, package location, and current working directory.
- ALETHEIA_DATA_DIR remains an absolute-path-only override; preview instances stay
  isolated below ~/.aletheia/instances/dev-preview and cannot attach to primary state.
- Existing repository-root data is never silently abandoned or split: migration is
    explicit, fail-closed, integrity-checked, rollback-safe, and leaves the source
    intact.
- SQLite, config, audit/logs, encrypted fallback files, PID/routes, reflection state,
  backups/exports/artifacts, and developer task claims have no production write path
  under repository-root data.
- The immutable release bundle and Windows launcher prove the same default-home contract
  from a clean extraction while still accepting an explicit absolute override.

id: TASK-2026-036
title: Require durable evidence before position disappearance
status: in_progress
packet_type: standard
scope:
  boundary: cached-view evidence identity, durable disappearance candidates/observations,
    reconcile orchestration gating, reappearance resolution/audit, focused tests and
    matching SDD
  excluded: exchange clients or new network calls, verified fill recovery, direct-query
    adapter implementation, close/PnL/cash accounting, Risk, orders, live authority,
    credentials, gateway restart and runtime database mutation
intent: 'Replace one-snapshot orphan closure eligibility with durable, account-scoped
  disappearance candidates and idempotent observations: incomplete/stale/wrong-account
  views never count, one complete absence never closes, repeated independent evidence
  survives restart, reappearance resolves the candidate with audit, and live remains
  alert-only without changing exchange clients, verified-fill recovery, close accounting,
  Risk, orders or live authority.'
acceptance:
- A fresh complete active-account snapshot missing a local position creates one durable
  candidate and one immutable observation, but never closes or settles the position.
- Re-reading the same cached snapshot is idempotent; confirmation advances only on a
  distinct complete view identity. Stale, incomplete, missing-broker, ambiguous-position
  or wrong-account views never create or advance disappearance evidence.
- Candidate identity contains execution mode, broker, environment, an opaque logical
  account scope identifier, canonical symbol, market type, direction and position id;
  evidence remains durable after the storage connection is reopened.
- Two independent complete absences, or a future adapter-supplied direct confirmed-absent
  result, mark the candidate ready for the later verified-exit phase. This task never calls
  the existing fallback-price close path, even after readiness.
- A verified exchange reappearance resolves the pending candidate with an audit record;
  degraded all-managed fallback must not falsely resolve it. Live remains alert-only.
- OI-B01 becomes GREEN with focused unit/integration/spec tests, while OI-B02/B03 remain
  explicit debt and no exchange, Risk, order, live or credential behavior changes.

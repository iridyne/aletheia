scope:
  boundary: Position persistence fields, additive SQLite DDL/migrations, durable
    disappearance evidence models/repositories, focused tests, and matching SDD only
  excluded: reconciliation classification/action, close accounting, PnL/cash, Risk,
    Learning consumers, analytics semantics, exchange clients, execution, live state,
    runtime database mutation, credentials, and gateway process
intent: Add backward-compatible position closure evidence fields and durable reconciliation
  observation storage with additive idempotent migrations and repository support,
  without changing reconciliation, close accounting, Risk, Learning, execution, or
  broker behavior.
acceptance:
- Position storage additively persists closure category, exit-price source, fill verification,
  outcome eligibility/exclusion, reconciliation identity/evidence, and semantics version
  with conservative legacy defaults.
- A trust-bearing durable disappearance-candidate table preserves scoped observations
  across restart and is not prunable.
- Fresh database and legacy database migrations are idempotent, transactional where
  required, preserve every original position economic field, and obey SQLite concurrency
  rules.
- Repository/model round trips remain backward compatible and unknown legacy closures
  default to ineligible rather than eligible.
- OI-S01 becomes GREEN with focused schema, migration, repository, architecture, and
  spec tests passing; no reconciliation or close behavior changes.

id: TASK-2026-083
title: Retire stale operator tasks during recovery
status: in_progress
packet_type: standard
scope:
  boundary: Operator-shell task recovery, operator task lifecycle persistence, and supervision recommendation freshness.
  excluded: Risk, execution, exchange adapters, live-mode authority, credentials, trading strategy, sizing, and global runtime-state mutation.
intent: Reconcile expired operator-shell running task records at startup so abandoned
  work cannot permanently pollute supervision recommendations; preserve fresh recoverable
  work.
acceptance:
- Startup recovery cancels every persisted running operator task older than 30 minutes with an explicit recovery reason, without treating it as completed or failed work.
- A fresh running task remains recoverable, and expired task records no longer remain in the recovered runtime state.
- Operator-task cancellation is a terminal, idempotent backend lifecycle state with a completion timestamp and audit event.
- Failed-task supervision alerts represent only the current 30-minute observation window; older failures remain queryable audit history.
- Focused TypeScript runtime tests, backend Operator route/event tests, TypeScript compilation, strict workflow validation, and a non-writing simulation against current runtime task records pass.

scope:
  boundary: declare before implementation
  excluded: runtime facts and credentials
intent: Repair the live Learning feedback path so approved, relevant Learning evidence
  reaches the active Market Observer and System Operator paths in shadow mode, add
  durable outcome/attribution safeguards, and prevent repeated Operator diagnostics
  from re-running without new evidence. Do not alter Risk, Execution, exchanges, credentials,
  live enablement, or paper-influence defaults.
acceptance:
- A completed or failed Operator diagnostic is not recreated for the same stable recommendation
  fingerprint; this remains true after process recovery, while genuinely new rejection
  evidence creates a new diagnostic.
- The active PI diagnostic route receives only applied, current Learning lessons as
  advisory context and returns the exact displayed-lesson manifest for the task/event
  audit record.
- Risk, Execution, exchange/authentication, credentials, live enablement, and paper-influence
  defaults remain unchanged; Market Observer's existing fail-closed authority gate
  remains in force.
- Focused Python and TypeScript regressions, Learning final-consumer specs, and architecture/workflow
  checks pass at the implementation commit.

scope:
  boundary: 'Learning paper-authority identity checks for the AT-02 lifecycle: predecessor,
    hypothesis, stage evidence, policy epoch, metric, and declared-horizon binding;
    plus the missing API-reference entry for the already implemented paper-Learning
    settings endpoint'
  excluded: runtime facts and credentials; live trading; Risk, Execution, Exchange,
    Universe, Ranker, Guard, Operator, Sizing, allocation defaults, and lifecycle/scheduler
    semantics
intent: Close the AT-02 authority gap by binding approved measurement evidence to
  the same hypothesis, predecessor experiment, and declared horizon before any paper
  influence can be authorized.
acceptance:
- A supported paper-stage experiment authorizes only when its activation verdict belongs
  to its closed predecessor and the same hypothesis, and its declared horizon matches
  the hypothesis.
- A current-stage measurement from a different hypothesis cannot authorize paper influence.
- Missing or malformed parent/hypothesis identity fails closed without changing any
  experiment state.
- The existing paper-Learning settings endpoint is listed in the canonical API reference.
- Focused lifecycle/authority/spec regressions and the strict workflow check pass.

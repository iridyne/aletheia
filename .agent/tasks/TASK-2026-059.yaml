  resuming DCLS.'
acceptance:
- increase_sizing is classified and dispatched as Level 1 only when recovery conditions
  are safe.
- Sizing recovery uses production config persistence, never exceeds neutral 200, and
  retains cooldown plus daily patch limits.
- win_rate_7d below 35 suppresses increase_sizing so reduce and increase cannot occur
  in one cycle.
- OL-C07 and operator_layer document both bounded recovery exceptions without weakening
  widen_stop_loss proposal authority.
- Existing confidence incident, all Operator specs, architecture, and strict workflow
  checks remain green.

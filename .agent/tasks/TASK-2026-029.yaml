id: TASK-2026-029
title: Make Overview activity layout fluid
status: done
packet_type: standard
scope:
  boundary: frontend Overview layout only
  excluded: backend behavior, trading behavior, feed data, controls, and polling
intent: Remove the Agent Activity height cap, decouple it from the right rail, and
  make the Overview rail responsive at canonical breakpoints without changing backend
  or trading behavior.
acceptance:
- Agent Activity has no measured or fixed vertical cap and uses the page scroll instead
  of an internal feed scrollbar.
- The Overview keeps the latest 40 feed items and does not change feed data, controls,
  polling, or trading behavior.
- Above 1100px the cockpit uses a fluid 320px-380px right rail; from 701px through
  1100px the rail cards form two columns; at 700px and below they form one column.
- Right-rail cards keep their independent overflow protection and remain naturally
  top-aligned instead of stretching to match the feed.
- Frontend build and focused layout regression tests pass, and rendered styles are
  checked at desktop, medium, and narrow viewport widths.

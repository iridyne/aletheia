id: TASK-2026-097
title: Harden CI event isolation and stable verification gates
status: done
packet_type: standard
scope:
  boundary: GitHub Actions concurrency grouping, stable PR/master aggregate gates, and their executable workflow contracts.
  excluded: Ordinary feature-branch commit CI, product runtime, Risk, Execution, exchanges, Live authority, credentials, and trading semantics.
intent: Prevent event-level CI cancellation collisions and expose one stable aggregate result for PR admission and one for final master verification.
acceptance:
- Pull-request runs remain grouped by PR number and cancellable when superseded.
- Push runs remain non-cancellable and isolated by event plus commit SHA.
- A same-SHA push cannot replace a pending workflow-dispatch full-regression run.
- PR CI gate fails unless all eight required pull-request surfaces succeed.
- Master verification gate fails unless all eight required master-push surfaces succeed.
- No ordinary feature-branch push trigger is introduced.
- Focused workflow contracts and strict changed-since validation pass.

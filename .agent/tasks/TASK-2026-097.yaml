id: TASK-2026-097
title: Isolate manual CI concurrency
status: in_progress
packet_type: standard
scope:
  boundary: GitHub Actions concurrency grouping and its executable workflow contract.
  excluded: Product runtime, Risk, Execution, exchanges, Live authority, credentials,
    trading semantics, and unrelated CI jobs.
intent: Prevent duplicate same-SHA master pushes from replacing a pending manually
  dispatched full-regression run.
acceptance:
- Pull-request runs remain grouped by PR number and cancellable when superseded.
- Push runs remain non-cancellable and isolated by event plus commit SHA.
- A same-SHA push cannot replace a pending workflow-dispatch full-regression run.
- Focused workflow contracts and strict changed-since validation pass.

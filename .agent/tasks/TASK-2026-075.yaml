scope:
  boundary: Scheduler-owned public-data collection lanes, collector time budgets,
    deterministic shadow verification, and the required scheduler contract/docs.
  excluded: Risk policy, order execution semantics, exchange integration and credentials,
    live authority, universe scoring, sizing, and runtime-state changes.
intent: Split collector scheduling lanes and protect the real-time derivatives path
  so slow or stalled collectors cannot consume the budget of Hyperliquid or DefiLlama;
  prove the behavior with an offline deterministic shadow scenario without changing
  Risk, Execution, exchange credentials, or live authority.
acceptance:
- Core and context collectors have independent bounded schedules; a context collector
  cannot inherit an exhausted core deadline.
- Primary-exchange CCXT calls remain non-concurrent and providers remain per-call.
- Optional derivatives LSR and history work cannot consume the live Funding/OI
  collection budget.
- A deterministic offline shadow test reproduces the former starvation and proves
  fresh Hyperliquid and DefiLlama results under the corrected scheduler.
- Focused tests, affected executable specs, architecture fitness, and strict workflow
  validation pass.

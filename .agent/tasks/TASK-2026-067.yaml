  branch: iridite/trade-chain-integrity-audit
  lease_holder: codex-trade-chain-audit
  claimed_at: '2026-07-13T07:48:08.118200Z'
  expires_at: '2026-07-16T07:48:08.118358Z'
base_commit: c95b2be34d93368182da21fc81f87e71cf5f64e1
next_action:
  command_key: trade_chain_full_suite
  reason: Implementation commit 995074e4 has same-commit verification for the real
    round-trip, full suite, frontend build, Risk, Execution, specs, and architecture.
    Keep the branch unmerged until the owner resolves the funding and policy-epoch gates.
blockers:
- B-class Operator timing and Bitget original-order protection changes require the
  owner to create a new policy epoch and observation window before merge; prior and
  new observation data must not be mixed.
- Local paper futures have no trustworthy per-Position funding producer. The owner
  must choose between temporarily rejecting new paper_internal futures entries or
  authorizing a separate immutable funding-event ledger; this branch does not invent
  funding or claim local futures paper is fully usable.

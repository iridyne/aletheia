intent: Prevent _auto_register_watchdog from silently reversing a user's explicit
  disable-autostart decision, and surface that the gateway supervisor stays alive
  after bootout.
acceptance:
- After 'gateway disable-autostart' succeeds, runtime.autostart_on_start is written
  False to config; subsequent 'gateway start' does not re-register the launchd plist.
- After 'gateway enable-autostart' succeeds, runtime.autostart_on_start is written
  True to config.
- The API route POST /api/gateway/autostart persists the same intent and returns gateway_still_running
  in the disable response.
- test_lifecycle_skips_auto_register_when_user_disabled passes, proving the guard
  is exercised.
- All 38 test_autostart tests pass.

id: TASK-2026-099
title: Fix macOS launchd autostart re-registration after user disable
status: in_progress
packet_type: standard
scope:
  boundary: gateway autostart CLI (gateway.py), API route (routes/gateway.py), and
    autostart tests. No changes to trading runtime, Risk, Execution, exchange adapters,
    Live authority, credentials, or gateway lifecycle logic.
  excluded: trading runtime, Risk, Execution, exchange adapters, Live authority,
    credentials, gateway lifecycle, and any runtime-state mutation.
intent: Prevent _auto_register_watchdog from silently reversing a user's explicit
  disable-autostart decision, and surface that the gateway supervisor stays alive
  after bootout.
acceptance:
- After 'gateway disable-autostart' succeeds, runtime.autostart_on_start is written
  False to config; subsequent 'gateway start' does not re-register the launchd plist.
- After 'gateway enable-autostart' succeeds, runtime.autostart_on_start is written
  True to config.
- The API route POST /api/gateway/autostart persists the same intent and returns
  gateway_still_running in the disable response.
- test_lifecycle_skips_auto_register_when_user_disabled passes, proving the guard
  is exercised.
- All 38 test_autostart tests pass.

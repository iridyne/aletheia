intent: Provide fast worktree frontend HMR plus an opt-in isolated backend dev API
  that cannot read credentials, execute orders, or affect the master gateway; preserve
  production gateway behavior and verify both paths.
acceptance:
- Worktree frontend development uses Vite HMR without starting, stopping, or restarting
  the master gateway.
- The default Vite proxy permits read methods to the master API and rejects API writes
  with a stable 403 reason code.
- The explicit dev API uses a Worktree-local preview data directory and refuses the
  reserved master ports.
- Preview mode cannot read or write credential values, cannot submit, re-execute,
  or approve a proposal before durable execution state changes, and cannot invoke
  machine-level gateway or update controls.
- Production frontend builds use content-hashed assets, and operator/developer documentation
  distinguishes preview from release acceptance.

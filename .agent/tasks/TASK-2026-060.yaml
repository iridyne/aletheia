title: Runtime Session + core entity provenance
status: done
packet_type: standard
scope:
  boundary: declare before implementation
  excluded: runtime facts and credentials
intent: Create one runtime_sessions row per Gateway process lifecycle and stamp the
  seven core trading-fact entities with the producing session identity (expand-only
  nullable), distinguishing the opening from the closing session on positions, and
  prove full attribution in the Golden Path.
acceptance:
- Each Gateway boot creates one runtime_sessions row (session_id under a runtime_id)
  recording boot_commit/config_hash/behavior_fingerprint/schema_version/active_scope_id/execution_mode;
  clean shutdown sets ended_at+shutdown_clean.
- The seven core entities carry expand-only nullable runtime_session_id/producer_commit/behavior_fingerprint
  stamped at insert; rows with no active session stay NULL; explicit caller values
  win.
- Positions carry closed_* provenance stamped at close so created vs closed session
  are distinguishable and a position is never collapsed onto the last run.
- Golden Path asserts same-session chain, producer_commit==boot commit, one config
  fingerprint, plus a restart scenario (Session A opens, Session B closes).
- Full suite and strict workflow check remain green.

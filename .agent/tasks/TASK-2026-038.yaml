id: TASK-2026-038
title: Split verified and administrative position closure
status: in_progress
packet_type: standard
scope:
  boundary: explicit verified/admin close services, exact verified-fill settlement,
    administrative lifecycle convergence, paper cash idempotency, outcome-hook gating,
    disappearance settlement routing, focused tests, OI-B03 and matching contracts
  excluded: opening orders, position sizing, Risk thresholds, exchange client/signer
    behavior, live authority, broad Operator/analytics consumer migration, historical
    backfill, API/UI, credentials, gateway restart and runtime database mutation
intent: 'Implement RG-T07: verified fills may settle exact economics, while administrative
  closure converges state/audit without fabricated fees, slippage, realized strategy
  PnL, cash settlement, or outcome-only hooks.'
acceptance:
- Administrative closure records category/provenance/exclusion and audit while leaving
  exit price, fees, slippage and realized strategy PnL unavailable; it never settles
  paper cash or invokes outcome-only hooks.
- Verified closure requires a verified_fill result whose scoped identity and exact
  quantity match the open position and whose entry/exit fees are economically usable;
  it settles actual fill price/fee economics once and stamps eligible strategy evidence.
- confirmed_absent_without_fill routes only to administrative closure; inconclusive
  leaves the position and candidate open. Repeated calls never double-close, double-settle
  cash or repeat outcome hooks.
- Ready demo disappearance candidates use the RG-T06 protocol after incident gates;
  live remains alert-only and the old fallback-price orphan close has no production path.
- OI-B03 is GREEN with focused economic/audit/idempotency/spec tests; no opening, Risk,
  exchange request, live authority or credential behavior changes.

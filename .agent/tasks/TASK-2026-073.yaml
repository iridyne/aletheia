id: TASK-2026-073
title: Make Overview PnL curve show live marks honestly
status: in_progress
packet_type: standard
scope:
  boundary: Analytics read model and Overview PnL chart only; add an explicitly labelled live mark-to-market terminal point and truthful zero-verified-outcome state.
  excluded: Orders, Positions, close economics, Risk, execution, exchanges, paper cash, runtime configuration, and credentials.
intent: Expose current mark-to-market movement without mislabeling it as realized
  or verified strategy performance, and make zero verified outcomes explicit.
acceptance:
  - Equity-curve API returns a timestamped live mark separately from both raw closed history and verified strategy outcomes.
  - Overview refreshes that live mark on the existing bounded cadence and never calls it realized or verified PnL.
  - A zero verified cohort states the count and exclusion reasons rather than presenting a misleading slash as missing UI data.
  - Focused API and frontend-contract tests cover the new shape and labels.

id: TASK-2026-096
title: Build modular monolith dogfood release bundle
status: in_progress
packet_type: standard
scope:
  boundary: External durable data-directory selection, deterministic Windows release
    bundle construction, focused release tests, runtime launch/probe scripts, and a
    GitHub Actions clean-install artifact gate.
  excluded: Trading decisions, Risk, Execution, exchange adapters, Live authority,
    credentials, scheduler behavior, database schema changes, UM790 automatic deployment,
    release promotion, and runtime rollback orchestration.
intent: Package the existing Python backend and compiled React dashboard as one immutable
  single-machine dogfood artifact below 100 MiB while keeping all runtime state outside
  the release directory.
acceptance:
- ALETHEIA_DATA_DIR selects an absolute durable state root for the primary runtime while
  preview isolation remains unchanged and the repository data directory remains the default.
- The bundle is produced from an explicit runtime whitelist and excludes tests, frontend
  sources, Node modules, VCS metadata, caches, source maps, and runtime data.
- The same source inputs and Git SHA produce byte-identical ZIP output.
- CI compiles the dashboard, runs focused tests, builds the ZIP, extracts it into a clean
  directory, installs locked production dependencies, and bootstraps against external data.
- The compressed bundle warns above 60 MiB and fails closed above 100 MiB.
- The bundle contains release manifest and SHA-256 verification metadata.

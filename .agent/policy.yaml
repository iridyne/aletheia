schema_version: 1
# Trust-boundary policy. Machine-readable projection of:
#   AGENTS.md §Development Rules "Trust boundaries"
#   docs/governance/trust_and_change_control.md §6.1 Controlled Modules
#
# When a governed change under `changed_since` touches any glob in `paths`,
# the corresponding task packet's `verification[]` MUST carry evidence whose
# `command_key` is one of the group's `required_command_keys`, `exit_code == 0`,
# and `commit` is reachable from HEAD. `validate(strict=True, changed_since=...)`
# and `scripts/hooks/pre-commit` both enforce this rule.
#
# Editing this file without updating AGENTS.md and trust_and_change_control.md
# §6.1 (or vice versa) makes `spec_trust_boundary.py` fail. All three lists are
# expected to stay in lockstep.
trust_boundaries:
  - id: risk
    description: Risk engine and kill-switch. Weakening a check must be a deliberate,
      tested act. `risk_decisions` rows are the audit trail.
    paths:
      - aletheia/risk/**
    required_command_keys:
      - spec_risk_engine
      - spec_kill_conditions

  - id: execution
    description: Order-lifecycle gateway. Every fill flows here and preserves the
      proposal/order/risk-decision causal chain.
    paths:
      - aletheia/execution/**
    required_command_keys:
      - spec_execution
      - spec_pipeline_execution_chain

  - id: bitget_auth
    description: Bitget request signing. Changing signing without rechecking the
      official docs risks silent auth failure and secret leakage.
    paths:
      - aletheia/exchanges/bitget/auth.py
    required_command_keys:
      - spec_execution

  - id: bitget_client
    description: Bitget REST client. Symbol format and error mapping are load-bearing.
    paths:
      - aletheia/exchanges/bitget/client.py
    required_command_keys:
      - spec_execution

  - id: secrets
    description: Config secret loader. Never round-trip a secret through logs or
      task metadata.
    paths:
      - aletheia/config/secrets.py
    required_command_keys:
      - spec_execution

  - id: permissions
    description: Agent runtime permissions. Removing a check grants agents more
      live/credential capability.
    paths:
      - aletheia/agent_runtime/permissions.py
    required_command_keys:
      - spec_execution

  - id: tool_registry
    description: Restricted tool list. Removing an entry grants agents structurally
      unreachable capability.
    paths:
      - aletheia/agent_runtime/tool_registry.py
    required_command_keys:
      - spec_execution

  - id: agent_shell_registry
    description: FORBIDDEN_INTENTS command set; blocks intents regardless of mode.
    paths:
      - aletheia/agent_shell/registry.py
    required_command_keys:
      - spec_execution

  - id: audit_writer
    description: Append-only JSONL writer for audit.jsonl. Any change to append
      semantics or file routing affects the trust invariants.
    paths:
      - aletheia/files/jsonl.py
    required_command_keys:
      - spec_audit_chain

  - id: live_routes
    description: HTTP routes that unlock/lock live trading. Every handler must
      write_audit and respect the human-controlled unlock rule.
    paths:
      - aletheia/server/routes/live.py
    required_command_keys:
      - spec_live_unlock
      - spec_audit_chain

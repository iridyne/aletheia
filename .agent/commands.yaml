schema_version: 1
commands:
  workflow_bootstrap:
    command: uv run aletheia agent workflow bootstrap
    purpose: Recover the next task before any new repository change.
  workflow_tests:
    command: uv run pytest tests/test_agent_workflow.py -q
    purpose: Validate session-independent workflow tooling.
  workflow_trust_boundary_tests:
    command: uv run pytest tests/test_agent_workflow.py tests/specs/spec_trust_boundary.py tests/specs/spec_agent_workflow.py -q
    purpose: Validate workflow tooling and trust-boundary policy contract together.
  architecture:
    command: uv run pytest tests/test_architecture_fitness.py -q
    purpose: Verify dependency direction.
  specs:
    command: uv run pytest tests/specs/ -q
    purpose: Verify executable contracts.
  confidence_incident:
    command: uv run pytest tests/simulation/control_loop/test_confidence_deadlock.py tests/test_operator_loop.py tests/specs/spec_operator_loop.py -q
    purpose: Verify the deterministic confidence-deadlock incident and bounded automatic recovery.
  sizing_symmetry:
    command: uv run pytest tests/test_operator_loop.py tests/specs/spec_operator_loop.py -q
    purpose: Verify bounded sizing recovery, dispatch symmetry, and anti-oscillation guards.
  dcls_mvp:
    command: uv run pytest tests/simulation/control_loop/ tests/specs/spec_deterministic_control_loop.py tests/test_runtime_replay_pack.py tests/e2e/test_active_mainline_golden_path.py -q --tb=short
    purpose: Verify fixed control-loop incidents, stateful invariants, mutation canaries, replay, artifacts, and the active Golden Path.
  dcls_artifacts:
    command: uv run pytest tests/simulation/control_loop/test_confidence_deadlock.py tests/simulation/control_loop/test_sizing_ratchet.py tests/simulation/control_loop/test_failure_artifacts.py tests/specs/spec_deterministic_control_loop.py -q --tb=short
    purpose: Verify every fixed DCLS scenario automatically leaves a complete sanitized replay pack on failure.
  spec_risk_engine:
    command: uv run pytest tests/specs/spec_risk_engine.py -q
    purpose: Verify risk-engine trust-boundary contract.
  spec_execution:
    command: uv run pytest tests/specs/spec_execution.py -q
    purpose: Verify execution/gateway trust-boundary contract.
  spec_kill_conditions:
    command: uv run pytest tests/specs/spec_kill_conditions.py -q
    purpose: Verify kill-switch trust-boundary contract.
  spec_live_unlock:
    command: uv run pytest tests/specs/spec_live_unlock.py -q
    purpose: Verify live-unlock trust-boundary contract.
  spec_audit_chain:
    command: uv run pytest tests/specs/spec_audit_chain.py -q
    purpose: Verify audit chain and JSONL append-only trust-boundary contract.
  spec_pipeline_execution_chain:
    command: uv run pytest tests/specs/spec_pipeline_execution_chain.py -q
    purpose: Verify end-to-end proposal/risk/order/fill causal chain.
  trade_chain_roundtrip:
    command: uv run pytest tests/e2e/test_pipeline_real_paper_roundtrip.py -q
    purpose: Verify the real local-paper entry, close, Outcome, Attribution, outbox, and feedback chain with one causal identity.
  trade_chain_completion:
    command: uv run pytest tests/e2e/test_active_mainline_golden_path.py tests/e2e/test_active_mainline_reachability.py tests/e2e/test_pipeline_observer_to_operator.py tests/e2e/test_pipeline_universe_to_operator.py tests/e2e/test_pipeline_real_paper_roundtrip.py tests/e2e/test_pipeline_futures_leverage.py tests/e2e/test_pipeline_feedback_loop.py -q --tb=short
    purpose: Verify the active production-shaped paper paths from observer and Universe through Operator, exact Risk authority, spot/futures entry, routed close, complete economics, Attribution, and Feedback.
  trade_chain_full_suite:
    command: uv run pytest tests/ -q --tb=line
    purpose: Verify the complete repository suite after the trade-chain repairs.
  frontend_build:
    command: cd frontend && npm run build
    purpose: Verify the dashboard honestly renders unavailable PnL and funding state.
  doctor:
    command: uv run aletheia doctor
    purpose: Probe local runtime facts; never stored as Git state.
  provenance:
    command: uv run pytest tests/test_runtime_session_provenance.py tests/e2e/test_active_mainline_golden_path.py tests/specs/spec_active_runtime_scope.py -q
    purpose: Verify Runtime Session lifecycle, core-entity provenance stamping, and Golden Path full attribution (same-session chain + restart open/close).
  async_collector:
    command: uv run pytest tests/test_data_provider_and_async_fixes.py -q --tb=short
    purpose: Verify fallback market-data routing and that MacroCollector keeps synchronous yfinance work off the event loop without real network calls.
  dcls_ci_gate:
    command: uv run pytest tests/simulation/control_loop/test_failure_artifacts.py tests/specs/spec_deterministic_control_loop.py -q --tb=short
    purpose: Verify pull-request CI directly gates automatic DCLS failure-pack generation.
  startup_behavior_gate:
    command: uv run pytest tests/test_startup_behavior_gate.py tests/test_layered_pause.py -q
    purpose: Verify the Startup Behavior Gate verdict, layered pause + durable blocker, pi_daemon gating, recheck resume, and Health/Doctor surfaces.

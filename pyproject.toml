[project]
name = "aletheia-trading-os"
version = "0.5.0"
description = "Aletheia Trading OS — local-first AI-native agentic trading system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0",
    "httpx[socks]>=0.27",
    "apscheduler>=3.10",
    "cryptography>=42.0",
    "keyring>=25.0",
    "python-multipart>=0.0.9",
    "ccxt>=4.5.56",
    "yfinance>=1.4.1",
    "aiohttp>=3.9",
    "aiohttp-socks>=0.9",   # SOCKS5 proxy connector for aiohttp/ccxt (net.aiohttp_session)
    "feedparser>=6.0",
    "numpy>=2.4.6",
    "psutil>=7.2.2",
]

[project.scripts]
aletheia = "aletheia.main:app"
aletheia-install = "aletheia.cli.install:app"
ato = "aletheia.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "anyio>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aletheia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "spec_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "error:coroutine .* was never awaited:RuntimeWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::starlette.exceptions.StarletteDeprecationWarning",
]
markers = [
    "fast: default AI feedback set; cheap local tests suitable for every bug-fix loop",
    "integration: tests that cross route, DB, scheduler, broker, runtime, or service boundaries",
    "e2e: end-to-end pipeline tests (deselect with -m 'not e2e')",
    "tier_unit: fast unit/pure-function tests",
    "tier_integration: tests that cross module, route, DB, scheduler, broker, or runtime boundaries",
    "tier_e2e: end-to-end pipeline tests",
    "tier_spec: executable specification tests under tests/specs",
    "domain_operator: System Operator / agent shell / operator loop tests",
    "domain_universe: universe scanner / allocator / signal tests",
    "domain_serenity: Serenity Lens / research pipeline tests",
    "domain_risk: Risk Engine / kill switch / risk route tests",
    "domain_execution: order, broker, position, trade, and execution-path tests",
    "domain_market_data: market data, exchange data, price feed, and collector tests",
    "domain_learning: knowledge, learning, dreaming, lesson, and feedback tests",
    "domain_frontend: frontend/static UI source checks",
    "domain_runtime: gateway, scheduler, runtime continuity, lifecycle, and supervisor tests",
    "domain_storage: storage, DB, migration, retention, and audit-log tests",
    "domain_security: secrets, auth, permission, and safety guard tests",
    "domain_config: config/settings tests",
    "domain_misc: fallback domain marker when no narrower domain applies",
    "slow: manually marked slow tests; daily loop can skip with -m 'not slow'",
    "slow_optimizable: duration classifier tag for slow call-path tests worth inspecting",
    "slow_structural: duration classifier tag for slow setup/teardown/framework overhead",
]

[tool.aletheia]
# marker so tooling can detect repo root
root = true

[dependency-groups]
dev = [
    "httpx2>=2.5,<3",
    "hypothesis>=6.155.3",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes (core correctness rules).
# Ignoring: E501 (line length — long lines are pervasive), E402 (module-level
# import-not-at-top — legitimate lazy/conditional imports exist), E702/E731/E741
# (style preferences), F401 (unused import — trust-boundary files use intentional
# re-exports), F841 (unused variable — protective assignments), F402 (import
# shadowed by loop var — one legitimate instance).
select = ["E", "F"]
ignore = ["E501", "E402", "E702", "E731", "E741", "F401", "F841", "F402"]

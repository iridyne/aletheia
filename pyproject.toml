[project]
name = "aletheia-trading-os"
version = "0.1.0"
description = "Aletheia Trading OS — local-first AI-native agentic trading system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "cryptography>=42.0",
    "keyring>=25.0",
    "python-multipart>=0.0.9",
    "ccxt>=4.5.56",
    "yfinance>=1.4.1",
    "aiohttp>=3.9",
]

[project.scripts]
aletheia = "aletheia.main:app"
ato = "aletheia.main:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "anyio>=4.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aletheia"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.aletheia]
# marker so tooling can detect repo root
root = true

  - id: review-evidence
    type: prompt
    prompt: >-
      Read .sdd_shadow_runtime/prompts/convergence.md and perform only the
      review_evidence stage against repo/ and input/change-contract.md.
      Write exactly one bounded JSON object to
      .shadow/{{ context.run_id }}/artifacts/review_evidence.json.
  - id: validate-review-evidence
    type: shell
    run: >-
      python3 .sdd_shadow_runtime/validate.py --phase convergence
      --stage review_evidence --run-dir .shadow/{{ context.run_id }}/artifacts
  - id: qualification
    type: prompt
    prompt: >-
      Read .sdd_shadow_runtime/prompts/convergence.md and perform only the
      qualification stage against repo/ and input/change-contract.md.
      Write exactly one bounded JSON object to
      .shadow/{{ context.run_id }}/artifacts/qualification.json.
  - id: validate-qualification
    type: shell

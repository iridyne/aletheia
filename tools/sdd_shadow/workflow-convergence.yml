      --stage specclaim_coverage --run-dir .shadow/{{ context.run_id }}/artifacts
  - id: scope-entrypoints
    type: prompt
    prompt: >-
      Read .sdd_shadow_runtime/prompts/convergence.md and perform only the
      scope_entrypoints stage against repo/ and input/change-contract.md.
      Write exactly one bounded JSON object to
      .shadow/{{ context.run_id }}/artifacts/scope_entrypoints.json.
  - id: validate-scope-entrypoints
    type: shell
    run: >-
      python3 .sdd_shadow_runtime/validate.py --phase convergence
      --stage scope_entrypoints --run-dir .shadow/{{ context.run_id }}/artifacts
  - id: failure-recovery
    type: prompt
    prompt: >-
      Read .sdd_shadow_runtime/prompts/convergence.md and perform only the
      failure_recovery stage against repo/ and input/change-contract.md.

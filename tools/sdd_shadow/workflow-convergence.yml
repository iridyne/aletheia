schema_version: "1.0"
workflow:
  id: aletheia-sdd-shadow-convergence
  name: Aletheia SDD shadow convergence
  version: "1.0.4"
  author: Aletheia
  description: >-
    Advisory exact-head convergence semantic audit. Aletheia remains the
    Knowledge Plane; this workflow is an ephemeral, non-authoritative Process Plane.
  integration: omp
requires:
  speckit_version: "1.0.4"
  integrations:
    - omp
steps:
  - id: contract-implementation
    type: prompt
    prompt: >-
      Read .sdd_shadow_runtime/prompts/convergence.md and perform only the
      contract_implementation stage against repo/ and input/change-contract.md.
      Write exactly one bounded JSON object to
      .shadow/{{ context.run_id }}/artifacts/contract_implementation.json.
  - id: validate-contract-implementation
    type: shell
    run: >-
      python3 .sdd_shadow_runtime/validate.py --phase convergence
      --stage contract_implementation --run-dir .shadow/{{ context.run_id }}/artifacts
  - id: authority-alignment
    type: prompt
    prompt: >-
      Read .sdd_shadow_runtime/prompts/convergence.md and perform only the
      authority_alignment stage against repo/ and input/change-contract.md.
      Write exactly one bounded JSON object to
      .shadow/{{ context.run_id }}/artifacts/authority_alignment.json.
  - id: validate-authority-alignment
    type: shell
    run: >-
      python3 .sdd_shadow_runtime/validate.py --phase convergence
      --stage authority_alignment --run-dir .shadow/{{ context.run_id }}/artifacts
  - id: specclaim-coverage
    type: prompt
    prompt: >-
      Read .sdd_shadow_runtime/prompts/convergence.md and perform only the
      specclaim_coverage stage against repo/ and input/change-contract.md.
